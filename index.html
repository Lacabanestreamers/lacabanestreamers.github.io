function recentPaliers(days){
  const lim = new Date(Date.now() - days*864e5).toISOString().slice(0,10);
  return (S.data?.paliers || []).filter(x => x.date >= lim).sort((a,b) => b.date.localeCompare(a.date) || b.palier - a.palier);
}
function renderTicker(){
  const el = $("#ticker"); if(!el) return;
  const list = (S.data?.membres || []).filter(m => m.statut !== "Parti" && m.premierStream)
    .map(m => ({m, a:annivInfo(m.premierStream)})).filter(x => x.a.days <= 7).sort((x,y) => x.a.days - y.a.days);
  const today = list.filter(x => x.a.days === 0);
  const shown = today.length ? today : list;
  const pal = recentPaliers(3);
  const aff = (S.data?.evenements || []).filter(x => (x.type === "affilie" || x.type === "partenaire") && x.date >= new Date(Date.now() - 3*864e5).toISOString().slice(0,10));
  const key = shown.map(x => x.m.id + x.a.days).join("|") + "#" + pal.map(x => x.login + x.palier).join("|") + "#" + aff.map(x => x.login + x.type).join("|");
  if(key === S.tickerKey) return; S.tickerKey = key;
  if(!shown.length && !pal.length && !aff.length){ el.classList.add("hidden"); el.innerHTML = ""; return; }
  const ans = n => `${n} ${n > 1 ? "ans" : "an"}`;
  let items = shown.map(({m,a}) => a.days === 0
    ? `<span class="it" data-open="membres:${m.id}">🎂 Joyeux anniversaire de stream à <b>${esc(m.login)}</b> : ${ans(a.years)} de live aujourd'hui !</span>`
    : `<span class="it" data-open="membres:${m.id}">🎂 <b>${esc(m.login)}</b> fêtera ses ${ans(a.years)} de stream ${a.days === 1 ? "demain" : `dans ${a.days} jours`} (${a.next.toLocaleDateString("fr-FR",{day:"numeric",month:"long"})})</span>`).join("");
  const palItems = pal.map(x => { const m = S.data.membres.find(y => y.login === x.login);
    return `<span class="it" ${m ? `data-open="membres:${m.id}"` : ""}>🚀 <b>${esc(x.login)}</b> a passé les ${x.palier} follows${x.date === todayISO() ? " aujourd'hui" : ""} !</span>`; }).join("");
  const affItems = aff.map(x => { const m = S.data.membres.find(y => y.login === x.login);
    return `<span class="it" ${m ? `data-open="membres:${m.id}"` : ""}>🎉 <b>${esc(x.login)}</b> est devenu ${x.type === "affilie" ? "affilié" : "partenaire"} Twitch !</span>`; }).join("");
  items = (today.length ? items + affItems + palItems : affItems + palItems + items);
  const len = items.replace(/<[^>]+>/g,"").length;
  el.innerHTML = `<div class="track" style="--dur:${Math.max(16, Math.round(len * 0.2))}s"><span>${items}</span><span class="dup" aria-hidden="true">${items}</span></div>`;
  el.classList.remove("hidden");
}

/* ----- Courbe des follows ----- */
function sparkline(m){
  const pts = S.data.snapshots.filter(s => s.follows?.[m.login] != null).map(s => ({d:s.date, v:s.follows[m.login]}));
  const cur = currentFollows(m), today = todayISO();
  if(cur != null && !pts.some(p => p.d === today)) pts.push({d:today, v:cur, now:true});
  if(pts.length < 2) return `<p class="meta">La courbe apparaîtra dès qu'il y aura deux relevés (le robot en fait matin, midi et soir).</p>`;
  const W = 320, H = 96, P = 8, B = 16;
  const t0 = new Date(pts[0].d).getTime(), t1 = new Date(pts[pts.length-1].d).getTime() || t0 + 1;
  const vs = pts.map(p => p.v), lo = Math.min(...vs), hi = Math.max(...vs), span = hi - lo || 1;
  const X = p => P + (t1 === t0 ? 0 : (new Date(p.d).getTime() - t0) / (t1 - t0)) * (W - 2*P);
  const Y = p => P + (1 - (p.v - lo) / span) * (H - P - B);
  const line = pts.map(p => `${X(p).toFixed(1)},${Y(p).toFixed(1)}`).join(" ");
  const diff = pts[pts.length-1].v - pts[0].v;
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" role="img" aria-label="Évolution des follows : de ${pts[0].v} à ${pts[pts.length-1].v}"><title>Évolution des follows : de ${pts[0].v} à ${pts[pts.length-1].v}</title>
    <polygon class="area" points="${X(pts[0]).toFixed(1)},${H-B} ${line} ${X(pts[pts.length-1]).toFixed(1)},${H-B}"/>
    <polyline class="ln" points="${line}"/>
    ${pts.length <= 40 ? pts.map(p => `<circle class="${p.now ? "now" : ""}" cx="${X(p).toFixed(1)}" cy="${Y(p).toFixed(1)}" r="2.6"><title>${fmtDate(p.d)} : ${p.v}</title></circle>`).join("") : ""}
    <text x="${P}" y="${H-3}">${fmtDate(pts[0].d)}</text><text x="${W-P}" y="${H-3}" text-anchor="end">${fmtDate(pts[pts.length-1].d)}</text>
  </svg>
  <p class="meta" style="margin-top:4px">${pts[0].v} → <b>${pts[pts.length-1].v}</b> follows (<span class="${diff>0?"up":diff<0?"down":""}">${diff>0?"+":""}${diff}</span>) · min ${lo}, max ${hi} · ${pts.length} relevés</p>`;
}

/* ----- Historique d'une chaîne ----- */
function journalFor(login){
  const re = new RegExp(`(^|[^a-z0-9_])${login.replace(/[^a-z0-9_]/g,"")}([^a-z0-9_]|$)`, "i");
  return (S.data.journal || []).filter(j => re.test(j.txt)).slice(0, 12);
}
function historyBlock(r, c){
  const parts = [];
  if(c === "propositions"){
    (r.historique || []).slice().reverse().forEach(h => parts.push(`<li><span class="when">${fmtDate(h.le)}</span>candidature précédente : ${pill(h.statut)} ${h.proposePar ? "· proposée par " + esc(h.proposePar) : ""}${h.dateProposition ? " le " + fmtDate(h.dateProposition) : ""}${Object.keys(h.avis||{}).length ? "<br><span class='muted'>Avis : " + Object.entries(h.avis).map(([k,v]) => esc(k) + " " + esc(v)).join(", ") + "</span>" : ""}${h.commentaire ? "<br><span class='muted'>« " + esc(h.commentaire) + " »</span>" : ""}</li>`));
    const m = S.data.membres.find(x => x.login === r.login);
    if(m) parts.unshift(`<li><span class="when">La Cabane</span>${m.statut === "Parti" ? `a quitté La Cabane${m.depart ? " le " + fmtDate(m.depart) : ""}` : `membre${m.arrivee ? " depuis le " + fmtDate(m.arrivee) : ""}`} · <a href="#" data-open="membres:${m.id}">voir la fiche</a></li>`);
  } else {
    const cd = r.candidature;
    if(cd) parts.push(`<li><span class="when">${fmtDate(cd.transfereLe)}</span>transféré depuis les Propositions${cd.transferePar ? " par " + esc(cd.transferePar) : ""} · proposé${cd.proposePar ? " par " + esc(cd.proposePar) : ""}${cd.dateProposition ? " le " + fmtDate(cd.dateProposition) : ""}${Object.keys(cd.avis||{}).length ? "<br><span class='muted'>Avis : " + Object.entries(cd.avis).map(([k,v]) => esc(k) + " " + esc(v)).join(", ") + "</span>" : ""}${cd.commentaire ? "<br><span class='muted'>« " + esc(cd.commentaire) + " »</span>" : ""}${cd.contact ? "<br><span class='muted'>Contact : " + contactHtml(cd.contact) + "</span>" : ""}</li>`);
    const p = S.data.propositions.find(x => x.login === r.login);
    if(p) parts.push(`<li><span class="when">Proposition</span>${pill(p.statut)}${p.proposePar ? " · proposée par " + esc(p.proposePar) : ""}${p.dateProposition ? " le " + fmtDate(p.dateProposition) : ""} · <a href="#" data-open="propositions:${p.id}">voir</a></li>`);
  }
  journalFor(r.login).forEach(j => parts.push(`<li><span class="when">${fmtStamp(j.le)}</span><b>${esc(j.par)}</b> · ${esc(j.txt)}</li>`));
  return `<fieldset><legend>Historique</legend>${parts.length ? `<ul class="hist">${parts.join("")}</ul>` : `<p class="meta" style="margin-top:0">Aucun historique pour l'instant.</p>`}</fieldset>`;
}

    ["Jours de stream", v?.days ?? 0, 7, `${v?.days ?? 0} / 7`],
    ["Minutes de stream", (v?.hours ?? 0) * 60, 500, `≈ ${(v?.hours ?? 0) * 60} / 500`],
    ["Viewers moyens", v?.avg ?? 0, 3, `${v?.avg ?? 0} / 3`]
  ];
  const ok = crit.filter(c => (c[1] ?? 0) >= c[2]).length;
  return `<fieldset><legend>Vers l'affiliation (${ok}/4)</legend>
    <div class="gauge">${crit.map(([l, val, obj, txt]) => { const pct = Math.min(100, Math.round((val ?? 0) / obj * 100));

    <p class="meta">Estimation sur 30 jours à partir des mesures horaires du robot : les minutes sont arrondies à l'heure de live observée.</p></fieldset>`;
}

// Même calcul que le robot (robot/robot.mjs) : les deux créent les mêmes occurrences, avec le même identifiant.
function occurrencesSerie(s, du, au){
  if(!s?.debut || !/^\d{4}-\d{2}-\d{2}$/.test(s.debut)) return [];
  const iso = t => new Date(t).toISOString().slice(0, 10), fin = s.fin || "9999-12-31", out = [];
  const [y, m, d] = s.debut.split("-").map(Number), t0 = Date.UTC(y, m - 1, d);
  const garder = x => { if(x >= du && x >= s.debut && !(s.exclus || []).includes(x)) out.push(x); };
  if(s.rythme === "hebdo" || s.rythme === "2sem"){
    const pas = (s.rythme === "hebdo" ? 7 : 14) * 864e5;
    let t = t0; if(iso(t) < du){ const n = Math.floor((Date.UTC(...du.split("-").map((v, i) => i === 1 ? v - 1 : +v)) - t0) / pas); if(n > 0) t += n * pas; }
    for(; iso(t) <= au && iso(t) <= fin; t += pas) garder(iso(t));
  } else if(s.rythme === "mois" || s.rythme === "moisPos"){
    const jourSem = new Date(t0).getUTCDay(), pos = Math.ceil(d / 7);
    for(let k = 0; k < 600; k++){
      const an = y + Math.floor((m - 1 + k) / 12), mo = (m - 1 + k) % 12, dernier = new Date(Date.UTC(an, mo + 1, 0)).getUTCDate();
      let j;
      if(s.rythme === "mois") j = Math.min(d, dernier);
      else { const premier = new Date(Date.UTC(an, mo, 1)).getUTCDay(); j = 1 + ((jourSem - premier + 7) % 7) + (pos - 1) * 7; if(pos >= 5 || j > dernier){ j = 1 + ((jourSem - premier + 7) % 7); while(j + 7 <= dernier) j += 7; } }
      const x = iso(Date.UTC(an, mo, j)); if(x > au || x > fin) break; garder(x);
    }
  }
  return out;
}
const occDe = (s, date) => ({id:`${s.id}_${date}`, serie:s.id, titre:s.titre, date, heure:s.heure || "", duree:s.duree || 120, type:s.type || "",
  description:s.description || "", lien:s.lien || "", public:s.public !== false, discord:s.discord !== false, publierDiscord:!!s.publierDiscord,
  participants:[], par:s.par || "Série"});
const plusJours = (iso, n) => new Date(Date.UTC(...iso.split("-").map((v, i) => i === 1 ? v - 1 : +v)) + n * 864e5).toISOString().slice(0, 10);
// Après modification d'une série : les occurrences à venir reprennent ses réglages, celles qui ne tombent plus
// sur le rythme (et sans inscrit) disparaissent, et celles de la fenêtre « X jours avant » sont créées.
function synchroSerie(d, se, t){
  d.agenda = d.agenda || [];
  const au = plusJours(t, Math.min(60, Math.max(0, Number(se.avance ?? 7)))), dates = se.actif === false ? null : occurrencesSerie(se, t, au);
  const champs = ["titre", "heure", "duree", "type", "description", "lien"];
  d.agenda = d.agenda.filter(e => !(e.serie === se.id && e.date >= t && dates && !dates.includes(e.date) && !(e.participants || []).length && e.date <= au));
  for(const e of d.agenda) if(e.serie === se.id && e.date >= t){ for(const k of champs) e[k] = se[k] ?? (k === "duree" ? 120 : ""); e.public = se.public !== false; e.discord = se.discord !== false; e.publierDiscord = !!se.publierDiscord; }
  for(const x of dates || []) if(!d.agenda.some(e => e.id === `${se.id}_${x}`)) d.agenda.push(occDe(se, x));
}
const RYTHMES = {hebdo:"Chaque semaine", "2sem":"Toutes les 2 semaines", mois:"Chaque mois, même date", moisPos:"Chaque mois, même jour de la semaine"};
function rythmeTxt(se){
  if(!se.debut) return RYTHMES[se.rythme] || "";
  const [y, m, d] = se.debut.split("-").map(Number), dt = new Date(y, m - 1, d), jour = dt.toLocaleDateString("fr-FR", {weekday:"long"});
  const h = se.heure ? ` à ${se.heure.replace(":", "h")}` : "";
  if(se.rythme === "hebdo") return `Chaque ${jour}${h}`;
  if(se.rythme === "2sem") return `Un ${jour} sur deux${h}`;
  if(se.rythme === "mois") return `Le ${d === 1 ? "1er" : d} de chaque mois${h}`;
  const pos = Math.ceil(d / 7); return `Le ${pos >= 5 ? "dernier" : ["1er", "2e", "3e", "4e"][pos - 1]} ${jour} du mois${h}`;
}

const dirUrl = dir => `https://api.github.com/repos/${encodeURIComponent(cfg.owner)}/${encodeURIComponent(cfg.repo)}/contents/${dir}`;
async function listerSauvegardes(){
  S.backups = {loading:true}; render();
  try {
    const r = await fetch(`${dirUrl("sauvegardes")}?ref=${encodeURIComponent(cfg.branch)}&_=${Date.now()}`, {headers:ghHeaders(), cache:"no-store"});
    if(r.status === 404){ S.backups = {list:[]}; }
    else if(!r.ok) throw new Error(`GitHub a répondu ${r.status}`);
    else S.backups = {list:(await r.json()).filter(f => f.type === "file" && f.name.endsWith(".json")).sort((a,b) => b.name.localeCompare(a.name))};
  } catch(e){ S.backups = {erreur:e.message}; }
  render();
}
function nomSauvegarde(n){
  const m = /cabane-data-(\d{4}-\d{2}-\d{2})(?:-(\d{2})(\d{2}))?(?:-(\w+))?\.json/.exec(n);
  if(!m) return esc(n);
  return `${fmtDate(m[1])}${m[2] ? ` à ${m[2]}h${m[3]}` : ""} · ${m[4] === "manuel" ? "manuelle" : m[4] === "avantrestauration" ? "avant restauration" : "automatique (dimanche)"}`;
}
async function sauvegarder(suffixe){
  const n = new Date(), p2 = x => String(x).padStart(2, "0");
  const nom = `cabane-data-${todayISO()}-${p2(n.getHours())}${p2(n.getMinutes())}-${suffixe}.json`;
  const r = await fetch(`${dirUrl("sauvegardes")}/${nom}`, {method:"PUT", headers:{...ghHeaders(), "Content-Type":"application/json"},
    body:JSON.stringify({message:`${cfg.me || "staff"} : sauvegarde ${suffixe === "manuel" ? "manuelle" : "avant restauration"}`, content:b64encodeUtf8(JSON.stringify(S.data, null, 1)), branch:cfg.branch})});
  if(r.status === 401 || r.status === 403) throw new Error("Le jeton n'a pas le droit d'écrire la sauvegarde.");
  if(!r.ok) throw new Error(`Sauvegarde refusée (${r.status}).`);
  return nom;
}
async function lireSauvegarde(f){
  const r = await fetch(`${dirUrl("sauvegardes")}/${encodeURIComponent(f)}?ref=${encodeURIComponent(cfg.branch)}`, {headers:{...ghHeaders(), Accept:"application/vnd.github.raw+json"}, cache:"no-store"});
  if(!r.ok) throw new Error(`Lecture impossible (${r.status}).`);
  const d = JSON.parse(await r.text()); if(!d.membres || !d.propositions) throw new Error("Ce fichier n'est pas une sauvegarde de La Cabane.");
  return d;
}

const INACTIF_JOURS = 90;
function aNettoyer(){
  const d = S.data, presents = d.membres.filter(m => m.statut !== "Parti"), ouvertes = d.propositions.filter(p => !["Refusé","Abandonnée","Aucun contact","Accepté"].includes(p.statut));
  const cle = r => r.twitchId ? "id:" + r.twitchId : "l:" + r.login.toLowerCase();
  const membreDe = new Map(d.membres.map(m => [cle(m), m])), membreLogin = new Map(d.membres.map(m => [m.login.toLowerCase(), m]));
  const vusProp = new Map();
  const dupProps = [], dejaMembres = [];
  for(const p of ouvertes){
    const m = membreDe.get(cle(p)) || membreLogin.get(p.login.toLowerCase());
    if(m) dejaMembres.push({r:p, c:"propositions", info:`déjà dans Streamers (${m.statut === "Parti" ? "parti" : "présent"})`});
    const k = cle(p); if(vusProp.has(k)) dupProps.push({r:p, c:"propositions", info:`même chaîne que la proposition du ${fmtDate(vusProp.get(k).dateProposition || "") || "?"}`}); else vusProp.set(k, p);
  }
  const introuvables = [...presents.map(r => ({r, c:"membres"})), ...ouvertes.map(r => ({r, c:"propositions"}))].filter(x => x.r.introuvable)
    .map(x => ({...x, info:`chaîne Twitch introuvable depuis le ${fmtDate(x.r.introuvable)} (supprimée, bannie ou renommée sans suivi)`}));
  const inactifs = presents.filter(m => !["Admin","Modo"].includes(m.role)).map(m => ({m, x:lastStream(m)})).filter(({x}) => x && !x.live && x.days >= INACTIF_JOURS)
    .sort((a, b) => b.x.days - a.x.days).map(({m, x}) => ({r:m, c:"membres", info:`pas de live depuis ${x.days} jours (${x.src})`, inactif:true}));
  const incompletes = presents.filter(m => !["Admin","Modo"].includes(m.role)).map(m => ({r:m, c:"membres", manque:[!m.referent && "référent", !m.premierStream && "date du 1er stream", !m.arrivee && "date d'arrivée"].filter(Boolean)}))
    .filter(x => x.manque.length).map(x => ({...x, info:`manque : ${x.manque.join(", ")}`}));
  return [["Chaînes introuvables", introuvables, "Le robot ne trouve plus ces chaînes sur Twitch."],
    ["Propositions déjà dans Streamers", dejaMembres, "La proposition est restée ouverte alors que la chaîne est déjà membre."],
    ["Propositions en double", dupProps, "La même chaîne a été proposée plusieurs fois."],
    [`Sans live depuis plus de ${INACTIF_JOURS} jours`, inactifs, "Membres présents (hors Admin et Modo) qui ne streament plus."],
    ["Fiches incomplètes", incompletes, "Membres présents (hors Admin et Modo) à qui il manque des informations."]];
}

/* ============ Modification groupée ============ */
function bulkApply(what){
  if(what === "clear"){ S.sel.clear(); render(); return; }
  const c = S.view === "membres" ? "membres" : "propositions";
  if(what === "delete"){
    const recs = [...S.sel].map(id => S.data[c].find(x => x.id === id)).filter(Boolean);
    if(!recs.length) return;
    const noms = recs.map(r => r.login);
    const liste = noms.length > 15 ? noms.slice(0, 15).join(", ") + ` … et ${noms.length - 15} autres` : noms.join(", ");
    if(!confirm(`Supprimer ${recs.length} fiche${recs.length > 1 ? "s" : ""} (${c === "membres" ? "Streamers" : "Propositions"}) ?\n\n${liste}\n\nElles restent 30 jours dans la corbeille (Réglages) et peuvent être restaurées.`)) return;
    recs.forEach(r => dispatch({t:"del", c, id:r.id}));
    dispatch({t:"note", txt:`Suppression groupée de ${recs.length} fiche${recs.length > 1 ? "s" : ""} (${c === "membres" ? "streamers" : "propositions"}) : ${noms.join(", ")}`});
    S.sel.clear(); S.drawer = null; render();
    toast(`${recs.length} fiche${recs.length > 1 ? "s" : ""} mise${recs.length > 1 ? "s" : ""} à la corbeille`, false, {label:"Annuler", fn:() => restoreFiches(recs.map(r => r.id))});
    return;
  }
  const val = id => { const v = $("#" + id)?.value; return v === undefined || v === "__keep" ? undefined : v; };
  const st = val("bk_statut"), role = c === "membres" ? val("bk_role") : undefined, al = c === "membres" ? val("bk_alerte") : undefined, ref = c === "membres" ? val("bk_ref") : undefined;
  const tag = normTag($("#bk_tag")?.value), tagMode = $("#bk_tagmode")?.value || "add";
  if(st === undefined && role === undefined && al === undefined && ref === undefined && !tag && (c !== "membres" || val("bk_raison") === undefined)){ toast("Choisis au moins une modification.", true); return; }
  const ids = [...S.sel].filter(id => S.data[c].some(x => x.id === id)); const today = todayISO();
  ids.forEach(id => {
    const r = S.data[c].find(x => x.id === id), p = {};
    if(st !== undefined){ p.statut = st;
      if(c === "membres" && st === "Parti" && !r.depart) p.depart = today;
      if(c === "membres" && st === "Présent" && !r.arrivee) p.arrivee = today;
      if(c === "propositions" && ["Accepté","Refusé"].includes(st) && !r.dateRevue) p.dateRevue = today; }
    if(role !== undefined) p.role = role;
    if(al !== undefined) p.alerte = al === "1";
    const rs = c === "membres" ? val("bk_raison") : undefined;
    if(rs !== undefined && (st === "Parti" || (st === undefined && r.statut === "Parti"))) p.raisonDepart = rs;
    if(ref !== undefined) p.referent = ref;
    if(tag){ const cur = r.tags || [];
      if(tagMode === "add" && !hasTag(r, tag)) p.tags = [...cur, tag];
      if(tagMode === "del" && hasTag(r, tag)) p.tags = cur.filter(x => x.toLowerCase() !== tag.toLowerCase()); }
    if(!Object.keys(p).length) return;
    dispatch({t:"patch", c, id, p});
  });
  const desc = [st !== undefined && `statut « ${st || (c === "membres" ? "À renseigner" : "À trier")} »`, role !== undefined && `rôle « ${role || "aucun"} »`, ref !== undefined && `référent « ${ref || "aucun"} »`, tag && `étiquette « ${tag} » ${tagMode === "add" ? "ajoutée" : "retirée"}`, al !== undefined && (al === "1" ? "alerte configurée" : "sans alerte")].filter(Boolean).join(", ");
  dispatch({t:"note", txt:`Modification groupée de ${ids.length} fiche${ids.length>1?"s":""} (${desc}) : ${ids.map(id => S.data[c].find(x => x.id === id)?.login).join(", ")}`});
  S.sel.clear(); render(); toast(`${ids.length} fiche${ids.length>1?"s":""} modifiée${ids.length>1?"s":""}`);
}

    dispatch({t:"settings", notify:true, p:{"vitrine.active":$("#v_active").checked, "vitrine.titre":$("#v_titre").value.trim() || "La Cabane", "vitrine.texte":$("#v_texte").value.trim(), "vitrine.lienDiscord":lien,
      "vitrine.rejoindre":{actif:$("#v_rej").checked, titre:$("#v_rejtitre").value.trim() || "Rejoindre La Cabane", texte:$("#v_rejtexte").value.trim()}}, txt:`Vitrine publique ${$("#v_active").checked ? "activée / modifiée" : "désactivée"}`});
    toast($("#v_active").checked ? "Vitrine enregistrée : le robot la publiera à son prochain passage" : "Vitrine désactivée : le robot la retirera à son prochain passage"); return;
  }
  if(t.id === "bkRefresh"){ listerSauvegardes(); return; }
  if(t.id === "bkNow"){ t.disabled = true; sauvegarder("manuel").then(n => { toast("Sauvegarde faite"); listerSauvegardes(); }, e => { toast(e.message, true); t.disabled = false; }); return; }
  const bkb = t.closest("[data-bk]");
  if(bkb){ const f = bkb.dataset.f;
    if(bkb.dataset.bk === "dl"){ lireSauvegarde(f).then(d => { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([JSON.stringify(d, null, 1)], {type:"application/json"})); a.download = f; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); }, e => toast(e.message, true)); return; }
    if(!confirm(`Restaurer la sauvegarde du ${nomSauvegarde(f).replace(/<[^>]+>/g,"")} ?\n\nToutes les modifications faites depuis seront remplacées, pour tout le staff. L'état actuel est sauvegardé juste avant.`)) return;
    (async () => { try {
      await sauvegarder("avantrestauration");
      const d = await lireSauvegarde(f);
      d.journal = d.journal || []; d.journal.unshift({le:new Date().toISOString(), par:cfg.me || "?", txt:`Restauration de la sauvegarde ${f}`});
      await forceReplace(d); listerSauvegardes();
    } catch(e){ toast(e.message, true); } })();
    return; }
  if(t.id === "tplAdd"){ S.sansRestaurer = true; S.tplEdit = [...lireModeles(), {nom:"Nouveau modèle", pour:"tous", texte:"Coucou {pseudo} !\n"}]; render(); return; }
  const tdl = t.closest("[data-tpldel]"); if(tdl){ const m = lireModeles(); m.splice(Number(tdl.dataset.tpldel), 1); S.sansRestaurer = true; S.tplEdit = m; render(); return; }
  if(t.id === "tplReset"){ S.sansRestaurer = true; S.tplEdit = JSON.parse(JSON.stringify(MODELES_DEFAUT)); render(); toast("Modèles d'origine remis : clique sur Enregistrer pour les garder"); return; }
  if(t.id === "tplSave"){ const m = lireModeles(); dispatch({t:"settings", p:{modeles:m}, txt:`Modèles de messages modifiés (${m.length})`}); S.tplEdit = null; toast("Modèles enregistrés"); return; }
  if(t.id === "msgClose"){ S.msgSel = null; renderDrawer(); return; }
  if(t.id === "msgCopy"){ const txt = $("#msgText").value;
    const ok = () => toast("Message copié : colle-le dans Discord (Ctrl+V)");
    (navigator.clipboard?.writeText(txt) || Promise.reject()).then(ok, () => { const ta = $("#msgText"); ta.focus(); ta.select(); try { document.execCommand("copy") ? ok() : toast("Copie refusée : sélectionne le texte et copie-le à la main.", true); } catch { toast("Copie refusée : sélectionne le texte et copie-le à la main.", true); } });
    return; }
  if(t.id === "s_jetsave"){
    const jetons = [], bad = [];
    $("#s_jetons").value.split("\n").map(l => l.trim()).filter(Boolean).forEach(l => {
      const m = /^(.+?)\s*[;,]\s*(\d{4}-\d{2}-\d{2}|\d{1,2}\/\d{1,2}\/\d{4})$/.exec(l);
      if(!m){ bad.push(l); return; }
      let dt = m[2]; if(dt.includes("/")){ const [jj, mm, aa] = dt.split("/"); dt = `${aa}-${mm.padStart(2,"0")}-${jj.padStart(2,"0")}`; }
      if(isNaN(new Date(dt + "T12:00:00"))){ bad.push(l); return; }
      jetons.push({nom:m[1].trim(), expire:dt}); });
    if(bad.length){ toast(`Ligne illisible : « ${bad[0]} » (format : Nom ; JJ/MM/AAAA ou AAAA-MM-JJ)`, true); return; }
    dispatch({t:"settings", p:{jetons}, txt:"Liste des jetons distribués modifiée"}); toast("Liste des jetons enregistrée"); return;
  }
  if(t.id === "s_save"){
    const lines = id => $("#"+id).value.split("\n").map(s => s.trim()).filter(Boolean);
    dispatch({t:"settings", p:{nom:$("#s_nom").value.trim(), staff:lines("s_staff"), statutsProposition:lines("s_statuts"), roles:lines("s_roles"), liens:lines("s_liens"), integration:lines("s_integ").map(x => x.replace(/\./g, "·")), stagnationJours:Math.max(3, Number($("#s_stag").value) || 14)}, txt:"Listes modifiées"});
    ensureShape(); toast("Listes enregistrées"); return;
  }
});
/* ============ Recherche globale (Ctrl+K) ============ */
const sansAccents = s => String(s ?? "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
const RECH = {q:"", sel:0, res:[]};
function resultatsRecherche(q){
  const d = S.data, n = sansAccents(q.trim()); if(!d || n.length < 2) return [];
  const ok = (...champs) => champs.some(c => sansAccents(c).includes(n));
  const out = [];
  for(const m of d.membres) if(ok(m.login, m.discord, m.notes, (m.tags || []).join(" "))) out.push({k:"Streamer", t:m.login, m:[m.statut, m.role].filter(Boolean).join(" · "), go:() => { S.drawer = {c:"membres", id:m.id}; renderDrawer(); }, score:sansAccents(m.login).startsWith(n) ? 0 : 1});
  for(const p of d.propositions) if(ok(p.login, p.proposePar, p.commentaire, p.notes, p.responsable)) out.push({k:"Proposition", t:p.login, m:[p.statut || "À trier", p.proposePar && "par " + p.proposePar].filter(Boolean).join(" · "), go:() => { S.drawer = {c:"propositions", id:p.id}; renderDrawer(); }, score:sansAccents(p.login).startsWith(n) ? 0 : 1});
  for(const x of d.corbeille || []) if(ok(x.r.login)) out.push({k:"Corbeille", t:x.r.login, m:`supprimé le ${fmtDate((x.le || "").slice(0, 10))}${x.par ? " par " + x.par : ""}`, go:() => { S.view = "reglages"; render(); setTimeout(() => $("#corbeille")?.scrollIntoView({block:"start"}), 50); }, score:2});
  for(const e of d.agenda || []) if(ok(e.titre, e.description, e.type)) out.push({k:"Événement", t:e.titre, m:fmtDate(e.date) + (e.heure ? " · " + e.heure : ""), go:() => { S.view = "agenda"; S.sansRestaurer = true; S.evEdit = clone(e); S.evEdit._pplAvant = [...(e.participants || [])]; render(); window.scrollTo(0, 0); }, score:1});
  for(const se of d.series || []) if(ok(se.titre)) out.push({k:"Série", t:se.titre, m:rythmeTxt(se), go:() => { S.view = "agenda"; S.sansRestaurer = true; S.serieEdit = clone(se); render(); }, score:1});
  for(const j of (d.journal || []).slice(0, 400)) if(ok(j.txt)) { const fiche = [...d.membres.map(r => ["membres", r]), ...d.propositions.map(r => ["propositions", r])].find(([, r]) => j.txt.startsWith(r.login + " ·"));
    out.push({k:"Historique", t:j.txt, m:`${fmtStamp(j.le)} · ${j.par}`, go:fiche ? () => { S.drawer = {c:fiche[0], id:fiche[1].id}; renderDrawer(); } : () => { S.view = "reglages"; render(); }, score:3}); }
  return out.sort((a, b) => a.score - b.score).slice(0, 40);
}
function ouvrirRecherche(){
  if(!S.data){ toast("Connecte-toi d'abord au fichier partagé.", true); return; }
  RECH.q = ""; RECH.sel = 0; RECH.res = [];
  $("#rechRoot").innerHTML = `<div class="rech" id="rechOv" role="dialog" aria-modal="true" aria-label="Recherche"><div class="box"><input id="rechQ" type="search" placeholder="Streamer, proposition, événement, historique…" autocomplete="off" aria-label="Rechercher"><ul id="rechL" role="listbox"></ul></div></div>`;
  majRecherche(); setTimeout(() => $("#rechQ")?.focus(), 0);
}
function fermerRecherche(){ $("#rechRoot").innerHTML = ""; }
function majRecherche(){
  const ul = $("#rechL"); if(!ul) return;
  RECH.res = resultatsRecherche(RECH.q); RECH.sel = Math.min(RECH.sel, Math.max(0, RECH.res.length - 1));
  ul.innerHTML = RECH.q.trim().length < 2 ? `<li class="vide" style="cursor:default">Tape au moins 2 lettres. Échap pour fermer.</li>`
    : RECH.res.length ? RECH.res.map((r, i) => `<li role="option" data-ri="${i}" aria-selected="${i === RECH.sel}"><span class="k">${esc(r.k)}</span><span class="t">${esc(r.t)}</span><span class="m">${esc(r.m || "")}</span></li>`).join("")
    : `<li class="vide" style="cursor:default">Rien trouvé.</li>`;
  ul.querySelector('[aria-selected="true"]')?.scrollIntoView({block:"nearest"});
}
function allerResultat(i){ const r = RECH.res[i]; if(!r) return; fermerRecherche(); r.go(); }
document.addEventListener("input", e => { if(e.target.id === "rechQ"){ RECH.q = e.target.value; RECH.sel = 0; majRecherche(); } });
document.addEventListener("click", e => { const li = e.target.closest?.("#rechL [data-ri]"); if(li){ allerResultat(Number(li.dataset.ri)); return; } if(e.target.id === "rechOv") fermerRecherche(); });
document.addEventListener("keydown", e => {
  if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k"){ e.preventDefault(); $("#rechOv") ? fermerRecherche() : ouvrirRecherche(); return; }
  if(!$("#rechOv")) return;
  if(e.key === "Escape"){ e.preventDefault(); e.stopImmediatePropagation(); fermerRecherche(); return; }
  if(e.key === "ArrowDown" || e.key === "ArrowUp"){ e.preventDefault(); RECH.sel = Math.max(0, Math.min(RECH.res.length - 1, RECH.sel + (e.key === "ArrowDown" ? 1 : -1))); majRecherche(); }
  if(e.key === "Enter"){ e.preventDefault(); allerResultat(RECH.sel); }
}, true);
document.addEventListener("keydown", e => {
  if(e.key === "Escape" && S.drawer){ S.drawer = null; renderDrawer(); }
  if(e.key === "Enter" && e.target.matches(".ann")){ e.target.click(); }
  if(e.key === "Enter" && e.target.id === "ev_ppl"){ e.preventDefault(); e.target.dispatchEvent(new Event("change", {bubbles:true})); }
  if(e.key === "Enter" && e.target.id === "rpTexte"){ e.preventDefault(); $("#rpAdd")?.click(); }
  if(e.key === "Enter" && e.target.id === "tagAdd"){ e.preventDefault(); e.target.dispatchEvent(new Event("change", {bubbles:true})); }
});
document.addEventListener("input", e => {
  const t = e.target;
  if(t.id === "msgText" && S.msgSel) S.msgSel.texte = t.value;
  if(t.id === "pq"){ S.f.pq = t.value; render(); }
  if(t.id === "mq"){ S.f.mq = t.value; render(); }
});
document.addEventListener("change", e => {
  const t = e.target;
  if(t.dataset.integ && S.drawer){ const m = S.data.membres.find(x => x.id === S.drawer.id); if(!m) return;
    patch("membres", m.id, {[`integ.${t.dataset.integ}`]: t.checked ? todayISO() : undefined}, `${m.login} · Intégration : ${t.dataset.integ} ${t.checked ? "fait" : "décoché"}`); renderDrawer(); return; }
  if(t.id === "fileIn" && S.data && !estAdmin()){ t.value = ""; toast("Réservé aux admins de la page (Réglages → Admins).", true); return; }
  if(["sr_rythme", "sr_debut", "sr_heure"].includes(t.id) && S.serieEdit){ S.serieEdit = lireSerieForm(); render(); return; }
  if(t.dataset.evlier && t.value){ const m = S.data.membres.find(x => x.id === t.value), ev = (S.data.agenda || []).find(x => x.id === t.dataset.evlier); if(!m || !ev) return;
    // le compte Discord est mémorisé sur la fiche : ses prochaines réactions seront reconnues toutes seules
    dispatch({t:"patch", c:"membres", id:m.id, p:{discordId:t.dataset.did, discord:t.dataset.dnom}, auto:true});
    dispatch({t:"agendaPpl", id:ev.id, add:m.login, inconnu:t.dataset.did, txt:`${m.login} inscrit à « ${ev.titre} » (✅ Discord de ${t.dataset.dnom})`});
    toast(`${t.dataset.dnom} = ${m.login} : inscrit, et reconnu automatiquement la prochaine fois`); return; }
  if(t.id === "refSel"){ S.f.ref = t.value; render(); return; }
  if(t.id === "roleSel"){ S.f.mrole = t.value; render(); return; }
  if(t.id === "ev_ppl" && S.evEdit){ const l = normLogin(t.value); if(!l) return;
    if(!S.data.membres.some(m => m.login === l)){ toast(`${l} n'est pas dans Streamers.`, true); return; }
    const e = lireEvForm(); if(!(e.participants || []).includes(l)) e.participants = [...(e.participants || []), l];
    S.evEdit = e; t.value = ""; S.sansRestaurer = true; render(); setTimeout(() => $("#ev_ppl")?.focus(), 0); return; }
  if(t.id === "msgPick" && S.drawer){ S.msgSel = t.value === "" ? null : {id:S.drawer.id, i:Number(t.value)}; renderDrawer(); return; }
  if(t.id === "ptagSel"){ S.f.ptag = t.value; render(); return; }
  if(t.id === "mtagSel"){ S.f.mtag = t.value; render(); return; }
  if(t.id === "tagAdd" && S.drawer){ const tag = normTag(t.value); if(!tag) return; t.blur(); const r = S.data[S.drawer.c].find(x => x.id === S.drawer.id); if(!r || hasTag(r, tag)){ t.value = ""; return; }
    patch(S.drawer.c, r.id, {tags:[...(r.tags || []), tag]}, `${r.login} · Étiquette ajoutée : ${tag}`); t.value = ""; renderDrawer(); setTimeout(() => $("#tagAdd")?.focus(), 0); return; }
  if(t.id === "fileIn"){ const f = t.files[0]; if(f) openLocalFile(f); return; }
  if(t.dataset.k && S.drawer){
    if(!t.isConnected || !t.closest("#drawerRoot")) return;          // champ d'une fiche déjà refermée : ne pas l'appliquer à une autre
    if(t.dataset.fiche && t.dataset.fiche !== S.drawer.c + S.drawer.id) return;   // saisie commencée sur une autre fiche
    const {c, id} = S.drawer; const r = S.data[c].find(x => x.id === id); if(!r) return;
    let v = t.type === "checkbox" ? (t.dataset.date ? (t.checked ? todayISO() : null) : t.checked) : t.value.trim();
    if(t.type === "number") v = v === "" ? null : Number(v);
    if(t.type === "date"){ v = v || null;
      // En tapant l'année chiffre par chiffre, le navigateur envoie « 0002 », « 0020 », « 0202 »… : on attend une année plausible
      if(v && (Number(v.slice(0,4)) < 1990 || Number(v.slice(0,4)) > new Date().getFullYear() + 5)) return; }
    const k = t.dataset.k;
    const extra = {};
    if(k === "statut" && v === "Parti" && !r.depart) extra.depart = todayISO();
    if(k === "discord" && (v || "") !== (r.discord || "")) extra.discordId = null;     // nouveau pseudo : le robot relie le bon compte
    if(k === "statut" && v === "Parti" && c === "membres" && !r.raisonDepart) setTimeout(() => { toast("Indique la raison du départ juste en dessous"); $('.drawer select[data-k="raisonDepart"]')?.focus(); }, 50);
    if(k === "statut" && v === "Présent" && !r.arrivee) extra.arrivee = todayISO();
    if(k === "statut" && c === "propositions" && v && !r.dateRevue && ["Accepté","Refusé"].includes(v)) extra.dateRevue = todayISO();
    const label = t.closest("label")?.firstChild?.textContent?.trim() || k.replace("avis.","Avis de ");
    const lib = t.dataset.date ? `Prise de nouvelles J+${k === "suivi7" ? 7 : 30}` : k.startsWith("avis.") ? "Avis de " + k.slice(5) : label;
    if(k === "masquerVitrine"){ dispatch({t:"patch", c, id, p:{[k]: v, ...extra}, notify:true, txt:`${r.login} · ${v ? "masqué de" : "affiché sur"} la vitrine`}); renderDrawer(); return; }
    patch(c, id, {[k]: v, ...extra}, `${r.login} · ${lib} : ${typeof v === "boolean" ? (v?"oui":"non") : t.dataset.date ? (v ? "faite" : "annulée") : (v ?? "vidé")}`);
    renderDrawer();
  }
});
function saveCfg(){
  const c = {...cfg};
  try { if(!cfg.remember){ sessionStorage.setItem("cabane.token", cfg.token); c.token = ""; } else sessionStorage.removeItem("cabane.token"); } catch {}
  store.set(CFG_KEY, c);
}
function exportJson(){
  const blob = new Blob([JSON.stringify(S.data, null, 1)], {type:"application/json"});
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `cabane-data-${todayISO()}.json`; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000); S.dirtyLocal = false; updateSync();
}
function openLocalFile(f){
  const rd = new FileReader();
  rd.onload = () => { try {
      const d = JSON.parse(rd.result); if(!d.membres || !d.propositions) throw 0;
      if(S.mode === "github"){
        if(!confirm("Tu es connecté au fichier partagé. Remplacer TOUTES les données partagées par ce fichier ?")) return;
        d.journal = d.journal || [];
        d.journal.unshift({le:new Date().toISOString(), par:cfg.me||"?", txt:`Données remplacées par le fichier ${f.name}`});
        forceReplace(d); return;
      }
      S.data = d; S.mode = "local"; S.dirtyLocal = false; ensureShape(); store.set(LOCAL_KEY, d);
      S.view = "accueil"; render(); updateSync(); loadLive(); toast(`Fichier ${f.name} ouvert en mode local`);
    } catch { toast("Ce fichier n'est pas un export de La Cabane.", true); } };
  rd.readAsText(f);
}
async function forceReplace(d){
  if(S.pending.length){ toast("Enregistrement en cours, réessaie dans quelques secondes.", true); return; }
  S.saving = true; updateSync();
  try { const fresh = await ghGet(); const sha = await ghPut(d, fresh.sha, `${cfg.me||"staff"} : remplacement complet des données`); if(!sha) throw new Error("Conflit, réessaie.");
    S.sha = sha; S.data = d; ensureShape(); toast("Données remplacées"); }
  catch(e){ toast(e.message, true); }
  S.saving = false; updateSync(); render();
}

/* ============ Démarrage ============ */
// Application installable : le service worker ne sert que la page elle-même (réseau d'abord, cache si hors ligne)
if("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
(function init(){
  if(window.__versVitrine) return;          // connexion Twitch de la vitrine : la page part tout de suite vers /vitrine/
  catchTwitchRedirect();
  if(cfg.owner && cfg.repo && cfg.token){ connectGithub(); }
  else {
    const local = store.get(LOCAL_KEY, null);
    if(local && local.membres){ S.data = local; S.mode = "local"; ensureShape(); loadLive(); }
    render(); updateSync();
  }
})();
</script>
</body>
