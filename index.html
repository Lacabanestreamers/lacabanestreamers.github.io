<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>La Cabane · Suivi staff</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛖</text></svg>">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#100B24">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="La Cabane">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#100B24; --panel:#18123A; --panel2:#201951; --line:#2E2663; --text:#ECE9FF; --muted:#9C95CB;
  --cyan:#3DE3FF; --pink:#FF4FD8; --ok:#5CF2A6; --warn:#FFC857; --ko:#FF5C7A; --grey:#7B769C;
  --radius:10px; color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font:500 16px/1.4 Rajdhani,"Segoe UI",system-ui,sans-serif;min-height:100vh}
a{color:var(--cyan);text-decoration:none}
a:hover{text-decoration:underline}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.hidden{display:none!important}

/* En-tête */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(16,11,36,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:18px;padding:10px 20px;flex-wrap:wrap}
.brand{font:800 20px/1 Orbitron,sans-serif;letter-spacing:.04em;color:var(--text);text-shadow:0 0 12px rgba(255,79,216,.55);white-space:nowrap}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav button{background:none;border:0;padding:8px 14px;border-radius:8px;cursor:pointer;color:var(--muted);font-weight:700;font-size:17px}
nav button[aria-current="page"]{color:var(--text);background:var(--panel2);box-shadow:inset 0 -2px 0 var(--pink)}
.sync{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--grey)}
.dot.ok{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.dot.busy{background:var(--warn);box-shadow:0 0 8px var(--warn)}
.dot.err{background:var(--ko);box-shadow:0 0 8px var(--ko)}

main{padding:20px;max-width:1500px;margin:0 auto}
h1{font:800 26px/1.1 Orbitron,sans-serif;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 18px}

/* Boutons */
.btn{border:1px solid var(--line);background:var(--panel2);padding:7px 14px;border-radius:8px;cursor:pointer;font-weight:700}
.btn:hover{border-color:var(--cyan)}
.btn.primary{background:var(--pink);border-color:var(--pink);color:#1a0716}
.btn.primary:hover{filter:brightness(1.1)}
.btn.ghost{background:none}
.btn.danger{border-color:var(--ko);color:var(--ko);background:none}
.btn:disabled{opacity:.5;cursor:default}

/* Barre d'outils */
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.search{flex:1 1 220px;max-width:340px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 12px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 12px;cursor:pointer;font-weight:600;font-size:15px;display:inline-flex;gap:6px;align-items:center}
.chip b{font-weight:700;color:var(--muted)}
.chip[aria-pressed="true"]{border-color:var(--cyan);background:rgba(61,227,255,.12)}
.chip[aria-pressed="true"] b{color:var(--cyan)}

/* Tableaux */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:15.5px}
th,td{padding:8px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{position:sticky;top:0;background:var(--panel2);color:var(--muted);font-weight:700;font-size:14px;cursor:pointer;user-select:none}
th[data-sort]:hover{color:var(--text)}
th .arrow{color:var(--cyan)}
tbody tr{cursor:pointer}
tbody tr:hover{background:rgba(255,255,255,.03)}
tbody tr:last-child td{border-bottom:0}
td.num{text-align:right;font-variant-numeric:tabular-nums}
.login{font-weight:700;color:var(--text)}
.who{display:inline-flex;align-items:center;gap:8px;vertical-align:middle}
.av{width:22px;height:22px;border-radius:50%;object-fit:cover;flex:none;margin:-3px 0;background:var(--line);display:inline-grid;place-items:center;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase}
.av.big{width:36px;height:36px;margin:0;font-size:18px;box-shadow:0 0 0 2px var(--pink)}
.muted{color:var(--muted)}
.empty{padding:40px;text-align:center;color:var(--muted)}
.up{color:var(--ok)} .down{color:var(--ko)} .warn{color:var(--warn)}

.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:14px;font-weight:700;border:1px solid currentColor}
.s-accepte{color:var(--ok)} .s-refuse{color:var(--ko)} .s-abandon{color:var(--grey)}
.s-attente{color:var(--warn)} .s-encours{color:var(--cyan)} .s-afaire{color:#A99BFF} .s-aucun{color:var(--grey)} .s-vide{color:var(--muted);border-style:dashed}
.s-present{color:var(--ok)} .s-parti{color:var(--grey)}

.live{display:inline-flex;align-items:center;gap:5px;color:var(--ko);font-weight:700;font-size:14px}
.live::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ko);box-shadow:0 0 8px var(--ko)}
.avis{display:inline-flex;gap:3px}
.avis i{width:10px;height:10px;border-radius:3px;background:var(--line);display:inline-block}
.avis i.pour{background:var(--ok)} .avis i.contre{background:var(--ko)} .avis i.neutre{background:var(--warn)} .avis i.autre{background:var(--cyan)}

/* Tiroir d'édition */
.scrim{position:fixed;inset:0;background:rgba(5,3,15,.6);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--panel);border-left:1px solid var(--line);z-index:41;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer .head{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line)}
.drawer .head h2 a.chanlink{color:var(--text)}
.drawer .head h2 a.chanlink:hover{color:var(--cyan);text-decoration:none}
.drawer .head h2 a.chanlink span{font-size:.7em;color:var(--muted)}
.drawer .head h2{margin:0;font:700 22px/1.2 Orbitron,sans-serif;flex:1;overflow:hidden;text-overflow:ellipsis}
.drawer .body{padding:18px 20px;overflow-y:auto;flex:1}
.drawer .foot{display:flex;gap:10px;padding:14px 20px;border-top:1px solid var(--line);flex-wrap:wrap}
.links{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:16px;font-weight:600}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.grid .full{grid-column:1/-1}
label.f{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--muted);font-weight:600}
label.f input,label.f select,label.f textarea{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;color:var(--text);font-size:16px;font-weight:500}
label.f textarea{min-height:80px;resize:vertical}
label.check{display:flex;align-items:center;gap:8px;color:var(--text)}
fieldset{border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;margin:16px 0 0}
legend{padding:0 6px;color:var(--pink);font-weight:700}
.avisrow{display:grid;grid-template-columns:80px 1fr;gap:8px;align-items:center;margin-bottom:8px}
.avisrow.me span{color:var(--pink);font-weight:700}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:4px 10px;cursor:pointer;font-weight:600;font-size:14px}
.seg button[aria-pressed="true"].pour{border-color:var(--ok);color:var(--ok)}
.seg button[aria-pressed="true"].contre{border-color:var(--ko);color:var(--ko)}
.seg button[aria-pressed="true"].neutre{border-color:var(--warn);color:var(--warn)}
.seg input{flex:1;min-width:120px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:4px 8px}
.meta{font-size:13px;color:var(--muted);margin-top:14px}

/* Anniversaires */
.annivs{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.ann{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;cursor:pointer;display:grid;grid-template-columns:62px 1fr;gap:12px;align-items:center}
.ann .d{text-align:center;border-right:1px solid var(--line);padding-right:10px}
.ann .d b{display:block;font:800 22px/1 Orbitron,sans-serif}
.ann .d small{color:var(--muted)}
.ann.soon{border-color:var(--pink);box-shadow:0 0 0 1px var(--pink) inset}
.ann.today{background:linear-gradient(135deg,rgba(255,79,216,.18),rgba(61,227,255,.12));border-color:var(--pink)}
h3.month{font:700 16px/1 Orbitron,sans-serif;color:var(--muted);margin:22px 0 10px}

/* Réglages / connexion */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;margin-bottom:16px;max-width:760px}
.panel h2{margin:0 0 6px;font:700 18px/1.2 Orbitron,sans-serif}
.panel p{color:var(--muted);margin:0 0 12px}
.journal{list-style:none;margin:0;padding:0;font-size:15px}
.journal li{padding:6px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:130px 90px 1fr;gap:10px}
.journal li:last-child{border-bottom:0}

/* Bandeau anniversaires */
.ticker{flex:1 1 220px;min-width:0;height:34px;overflow:hidden;display:flex;align-items:center;border:1px solid var(--line);border-radius:999px;background:linear-gradient(90deg,rgba(255,79,216,.14),rgba(61,227,255,.08));-webkit-mask-image:linear-gradient(90deg,transparent,#000 28px,#000 calc(100% - 28px),transparent);mask-image:linear-gradient(90deg,transparent,#000 28px,#000 calc(100% - 28px),transparent)}
.ticker .track{display:inline-flex;white-space:nowrap;will-change:transform}
.ticker .it{padding:0 34px;font-weight:700;font-size:15px;cursor:pointer}
.ticker .it b{color:var(--pink)}
.ticker .it:hover b{text-decoration:underline}
@media (prefers-reduced-motion:no-preference){
  .ticker .track{animation:tick var(--dur,30s) linear infinite}
  .ticker:hover .track{animation-play-state:paused}
  @keyframes tick{from{transform:translateX(0)}to{transform:translateX(-50%)}}
}
@media (prefers-reduced-motion:reduce){ .ticker .track .dup{display:none} }

/* Sélection groupée */
th.sel,td.sel{width:34px;padding-right:0}
th.sel input,td.sel input{width:17px;height:17px;accent-color:var(--pink);cursor:pointer;vertical-align:middle;margin:0}
tr.picked{background:rgba(255,79,216,.08)}
.bulkbar{position:sticky;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:15;display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:12px;padding:10px 14px;background:var(--panel2);border:1px solid var(--pink);border-radius:var(--radius);box-shadow:0 8px 30px rgba(0,0,0,.45)}
.bulkbar b{color:var(--pink)}
.bulkbar .bulkdel{margin-left:auto}
.bulkbar select{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 10px}

/* Accueil */
.home{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:14px;align-items:start}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
.card h2{font:700 16px/1.2 Orbitron,sans-serif;margin:0 0 10px;display:flex;align-items:center;gap:10px}
.card h2 .n{margin-left:auto;font:700 15px/1 Rajdhani,sans-serif;color:#1a0716;background:var(--pink);border-radius:999px;padding:3px 10px}
.card h2 .n.zero{background:var(--line);color:var(--muted)}
.todo{list-style:none;margin:0;padding:0}
.todo li{display:flex;align-items:center;gap:10px;padding:7px 4px;border-bottom:1px solid var(--line);cursor:pointer;border-radius:6px}
.todo li:hover{background:rgba(255,255,255,.03)}
.todo li:last-child{border-bottom:0}
.todo .login{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.todo .r{margin-left:auto;color:var(--muted);font-size:14px;text-align:right;flex:none;white-space:nowrap}
.todo .r.w{flex:0 1 auto;white-space:normal}
.pill{white-space:nowrap}
.card .more{display:inline-block;margin-top:8px;font-weight:700}
.card .none{color:var(--muted);margin:4px 0}

/* Courbe des follows */
.spark{width:100%;height:auto;display:block;margin-top:6px}
.spark .area{fill:rgba(61,227,255,.12)} .spark .ln{fill:none;stroke:var(--cyan);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
.spark circle{fill:var(--bg);stroke:var(--cyan);stroke-width:2} .spark circle.now{fill:var(--pink);stroke:var(--pink)}
.spark text{fill:var(--muted);font:600 11px Rajdhani,sans-serif}

/* Historique */
.hist{list-style:none;margin:0;padding:0;font-size:14.5px}
.hist li{padding:6px 0;border-bottom:1px solid var(--line)}
.hist li:last-child{border-bottom:0}
.hist .when{color:var(--muted);margin-right:6px}

/* Badges Twitch */
.tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;padding:1px 6px;border-radius:4px;margin-left:6px;vertical-align:middle;line-height:1.35}
.tag.aff{background:rgba(169,112,255,.18);color:#C9A7FF;border:1px solid rgba(169,112,255,.5)}
.tag.par{background:rgba(145,70,255,.9);color:#fff}
.tag.ko{background:rgba(255,92,122,.15);color:var(--ko);border:1px solid rgba(255,92,122,.5)}
/* Votes */
.votes{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 10px}
.vbar{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--line);flex:1 1 140px;min-width:120px}
.vbar i{display:block;height:100%} .vbar .pour{background:var(--ok)} .vbar .contre{background:var(--ko)} .vbar .neutre{background:var(--warn)} .vbar .autre{background:var(--cyan)}
.suggest{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 10px;border:1px dashed var(--cyan);border-radius:8px;margin-bottom:10px;font-weight:600}
.avcount{font-size:13px;color:var(--muted);margin-left:6px}
/* Jauge d'affiliation */
.gauge{display:grid;grid-template-columns:130px 1fr 90px;gap:6px 10px;align-items:center;font-size:14.5px}
.gauge .gbar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.gauge .gbar i{display:block;height:100%;background:var(--cyan)} .gauge .gbar i.ok{background:var(--ok)}
.gauge .v{text-align:right;font-variant-numeric:tabular-nums}
/* Tableau de bord */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px}
.kpi b{display:block;font:800 26px/1.1 Orbitron,sans-serif;margin-top:4px}
.kpi span{color:var(--muted);font-size:14px;font-weight:600}
.kpi small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:14px}
.chart{width:100%;height:auto;display:block}
.chart .ax{stroke:var(--line);stroke-width:1} .chart text{fill:var(--muted);font:600 11px Rajdhani,sans-serif}
.chart .ln{fill:none;stroke:var(--cyan);stroke-width:2.2;stroke-linejoin:round} .chart .ar{fill:rgba(61,227,255,.1)}
.chart .br{fill:var(--pink)}
@media (max-width:700px){ .charts{grid-template-columns:1fr} .gauge{grid-template-columns:110px 1fr 76px} }

.warnbar{background:rgba(255,200,87,.12);border:1px solid var(--warn);color:var(--text);border-radius:var(--radius);padding:10px 14px;margin-bottom:16px;font-weight:600}
.warnbar.ko{background:rgba(255,92,122,.12);border-color:var(--ko)}
.toast button{margin-left:12px;background:none;border:1px solid var(--cyan);color:var(--cyan);border-radius:6px;padding:2px 10px;font-weight:700;cursor:pointer}
.trash{list-style:none;margin:0;padding:0}
.trash li{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.trash li:last-child{border-bottom:0}
.trash .r{margin-left:auto;display:flex;gap:8px}
.recap{display:grid;grid-template-columns:minmax(0,540px) 1fr;gap:16px;align-items:start}
.recap canvas{width:100%;height:auto;border-radius:var(--radius);border:1px solid var(--line);display:block}
@media (max-width:900px){ .recap{grid-template-columns:1fr} }

.spacer{flex:1 1 auto}
.colmenu{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:10px 14px;margin-bottom:12px}
.tg{display:inline-block;font-size:12px;font-weight:700;padding:1px 8px;border-radius:999px;background:rgba(61,227,255,.12);color:var(--cyan);border:1px solid rgba(61,227,255,.35);margin:0 4px 0 0;white-space:nowrap}
.tagedit{display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.tagedit .tg button{background:none;border:0;color:inherit;cursor:pointer;padding:0 0 0 4px;font-weight:700}
.tagedit input{flex:1;min-width:140px;background:none;border:0;padding:4px;color:var(--text)}
.tagedit input:focus{outline:none}
.bulkbar input{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 10px;width:150px}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--panel2);border:1px solid var(--cyan);padding:10px 18px;border-radius:8px;z-index:60;font-weight:600;max-width:90vw}
.toast.err{border-color:var(--ko)}

@media (max-width:700px){
  main{padding:14px}
  .bar{padding:10px 14px;gap:10px}
  .grid{grid-template-columns:1fr}
  .journal li{grid-template-columns:1fr;gap:0}
  .ticker{order:5;flex:1 1 100%}
  header{position:static}
  .brand{font-size:18px}
  nav{order:4;width:100%;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -4px}
  nav::-webkit-scrollbar{display:none}
  nav button{padding:6px 11px;font-size:16px;white-space:nowrap;flex:none}
  .sync{order:2;width:auto;margin-left:auto}
  /* Tableaux en cartes sur téléphone */
  .tablewrap{border:0;background:none;overflow:visible}
  .tablewrap table,.tablewrap tbody,.tablewrap tr,.tablewrap td{display:block;width:100%}
  .tablewrap thead{display:none}
  .tablewrap tr{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:10px;padding:10px 14px;position:relative}
  .tablewrap tr.picked{border-color:var(--pink)}
  .tablewrap td{border:0;padding:3px 0;white-space:normal;display:flex;justify-content:space-between;align-items:center;gap:12px;text-align:right}
  .tablewrap td::before{content:attr(data-l);color:var(--muted);font-size:13.5px;font-weight:600;text-align:left}
  .tablewrap td.first{font-size:17px;padding:0 34px 6px 0;justify-content:flex-start;text-align:left}
  .tablewrap td.first::before,.tablewrap td.sel::before{content:none}
  .tablewrap td.sel{position:absolute;top:12px;right:14px;width:auto;padding:0}
  .tablewrap td.e{display:none}
  .tablewrap td.empty{display:block;text-align:center}
  .tablewrap td.empty::before{content:none}
  .bulkbar{bottom:calc(8px + env(safe-area-inset-bottom,0px))}
  .spacer{display:none}
}
@media (prefers-reduced-motion:no-preference){
  .drawer{animation:slide .18s ease-out}
  @keyframes slide{from{transform:translateX(30px);opacity:.4}}
}
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="brand" id="brand">La Cabane</div>
    <nav id="nav" aria-label="Sections">
      <button data-view="accueil">Accueil</button>
      <button data-view="propositions">Propositions</button>
      <button data-view="membres">Streamers</button>
      <button data-view="anniv">Anniversaires</button>
      <button data-view="stats">Tableau de bord</button>
      <button data-view="reglages">Réglages</button>
    </nav>
    <div class="ticker hidden" id="ticker" aria-label="Anniversaires de stream"></div>
    <div class="sync"><span class="dot" id="syncDot"></span><span id="syncTxt">Non connecté</span></div>
  </div>
</header>
<main id="main"></main>
<div id="drawerRoot"></div>
<div id="toastRoot"></div>

<script>
"use strict";
/* ============ Utilitaires ============ */
const $ = s => document.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = p => p + Math.random().toString(16).slice(2, 10);
const todayISO = () => { const d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset()*60000).toISOString().slice(0,10); };
const fmtDate = iso => { if(!iso) return ""; const [y,m,d] = iso.split("-"); return `${d}/${m}/${y}`; };
const fmtStamp = iso => { if(!iso) return ""; const d = new Date(iso); return d.toLocaleDateString("fr-FR") + " " + d.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"}); };
const normLogin = v => String(v||"").trim().replace(/^@/,"").replace(/^https?:\/\/(www\.)?twitch\.tv\//i,"").replace(/[/?#].*$/,"").toLowerCase();
const safeUrl = u => /^https?:\/\//i.test(u) ? u : null;
const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  del(k){ try { localStorage.removeItem(k); } catch {} }
};
function toast(msg, err, action){
  const el = document.createElement("div"); el.className = "toast" + (err ? " err" : ""); el.textContent = msg;
  if(action){ const b = document.createElement("button"); b.textContent = action.label; b.onclick = () => { el.remove(); action.fn(); }; el.appendChild(b); }
  $("#toastRoot").replaceChildren(el); setTimeout(() => el.remove(), action ? 9000 : err ? 6000 : 2600);
}
function b64decodeUtf8(b64){ const bin = atob(b64.replace(/\s/g,"")); return new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0))); }
function b64encodeUtf8(str){ const bytes = new TextEncoder().encode(str); let bin = ""; for(let i=0;i<bytes.length;i+=0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i,i+0x8000)); return btoa(bin); }

/* ============ État ============ */
const CFG_KEY = "cabane.cfg", LOCAL_KEY = "cabane.localdata";
let cfg = store.get(CFG_KEY, {owner:"Lacabanestreamers", repo:"cabane", branch:"main", path:"cabane-data.json", token:"", me:"", remember:true});
if(!cfg.token){ try { cfg.token = sessionStorage.getItem("cabane.token") || ""; } catch {} }
const S = {
  data:null, sha:null, mode:"none",          // none | github | local
  pending:[], saving:false, dirtyLocal:false,
  live:{}, liveLoading:false, avatars:{},
  view:"accueil", drawer:null, sel:new Set(), selView:"", visible:[], tickerKey:"",
  f:{ ptag:"", mtag:"", pq:"", pst:"__all", msort:["login",1], psort:["login",1], mq:"", mst:"__actifs", mrole:"__all", ref:"" }
};

/* ============ Modèle : opérations ============ */
function setPath(obj, path, val){
  const ks = path.split("."); let o = obj;
  for(let i=0;i<ks.length-1;i++){ if(typeof o[ks[i]] !== "object" || o[ks[i]] === null) o[ks[i]] = {}; o = o[ks[i]]; }
  const last = ks[ks.length-1];
  if(val === undefined || val === "") { if(ks.length > 1) delete o[last]; else o[last] = val === undefined ? null : ""; }
  else o[last] = val;
}
function applyOp(d, op){
  d.journal = d.journal || []; d.snapshots = d.snapshots || [];
  switch(op.t){
    case "patch": { const r = (d[op.c]||[]).find(x => x.id === op.id); if(!r) return;
      for(const [k,v] of Object.entries(op.p)) setPath(r, k, v); if(!op.auto) r.maj = {par:op.par, le:op.le}; break; }
    case "add": if(!d[op.c].some(x => x.id === op.r.id)) d[op.c].push(JSON.parse(JSON.stringify(op.r))); break;
    case "del": { const i = d[op.c].findIndex(x => x.id === op.id); if(i < 0) break;
      const [r] = d[op.c].splice(i, 1);
      if(!op.noTrash){ d.corbeille = d.corbeille || []; d.corbeille.push({c:op.c, r, le:op.le, par:op.par}); }
      break; }
    case "restore": { d.corbeille = d.corbeille || []; const i = d.corbeille.findIndex(x => x.r.id === op.id); if(i < 0) break;
      const [e] = d.corbeille.splice(i, 1); if(!d[e.c].some(x => x.id === e.r.id)) d[e.c].push(e.r); break; }
    case "purge": d.corbeille = (d.corbeille || []).filter(x => x.r.id !== op.id); break;
    case "snapshot": d.snapshots = d.snapshots.filter(s => s.date !== op.s.date); d.snapshots.push(op.s);
      d.snapshots.sort((a,b) => a.date.localeCompare(b.date)); if(d.snapshots.length > 120) d.snapshots = d.snapshots.slice(-120); break;
    case "settings": Object.assign(d.settings, op.p); break;
    case "note": break;
  }
  if(d.corbeille?.length){ const lim = new Date(Date.now() - 30*864e5).toISOString(); d.corbeille = d.corbeille.filter(x => (x.le || "") >= lim); }
  if(op.txt){ d.journal.unshift({le:op.le, par:op.par, txt:op.txt}); if(d.journal.length > 400) d.journal.length = 400; }
}
function dispatch(op){
  if(!S.data) return;
  op.le = new Date().toISOString(); op.par = cfg.me || "?";
  applyOp(S.data, op);
  if(S.mode === "github"){ S.pending.push(op); scheduleSave(); }
  else { S.dirtyLocal = true; store.set(LOCAL_KEY, S.data); }
  updateSync(); render();
}
const patch = (c, id, p, txt) => dispatch({t:"patch", c, id, p, txt});

/* ============ GitHub ============ */
const ghUrl = () => `https://api.github.com/repos/${encodeURIComponent(cfg.owner)}/${encodeURIComponent(cfg.repo)}/contents/${cfg.path.split("/").map(encodeURIComponent).join("/")}`;
const ghHeaders = () => ({Authorization:`Bearer ${cfg.token}`, Accept:"application/vnd.github+json", "X-GitHub-Api-Version":"2022-11-28"});
async function ghGet(){
  const r = await fetch(`${ghUrl()}?ref=${encodeURIComponent(cfg.branch)}&_=${Date.now()}`, {headers:ghHeaders(), cache:"no-store"});
  if(r.status === 401) throw new Error("Jeton refusé par GitHub : il a expiré ou a été révoqué. Colle un nouveau jeton dans Réglages.");
  if(r.status === 404) throw new Error("Fichier introuvable : vérifie le dépôt, la branche, le chemin et que le jeton a accès à ce dépôt.");
  if(!r.ok) throw new Error(`GitHub a répondu ${r.status}.`);
  const j = await r.json();
  let text;
  if(j.content) text = b64decodeUtf8(j.content);
  else { // fichier > 1 Mo
    const raw = await fetch(`${ghUrl()}?ref=${encodeURIComponent(cfg.branch)}`, {headers:{...ghHeaders(), Accept:"application/vnd.github.raw+json"}, cache:"no-store"});
    text = await raw.text();
  }
  return {sha:j.sha, data:JSON.parse(text)};
}
async function ghPut(data, sha, message){
  const r = await fetch(ghUrl(), {method:"PUT", headers:{...ghHeaders(), "Content-Type":"application/json"},
    body:JSON.stringify({message, content:b64encodeUtf8(JSON.stringify(data, null, 1)), sha, branch:cfg.branch})});
  if(r.status === 409 || r.status === 422) return null; // conflit : quelqu'un a enregistré entre-temps
  if(r.status === 401 || r.status === 403) throw new Error("Le jeton n'a pas le droit d'écrire (permission Contents : Read and write).");
  if(!r.ok) throw new Error(`Enregistrement refusé (${r.status}).`);
  return (await r.json()).content.sha;
}
// Réveille le robot (GitHub Actions) pour qu'il poste tout de suite sur Discord. En cas d'échec, son passage horaire rattrape.
async function notifyRobot(){
  try {
    const r = await fetch(`https://api.github.com/repos/${encodeURIComponent(cfg.owner)}/${encodeURIComponent(cfg.repo)}/dispatches`,
      {method:"POST", headers:{...ghHeaders(), "Content-Type":"application/json"}, body:JSON.stringify({event_type:"cabane-notif"})});
    if(!r.ok) console.warn("Robot non déclenché (" + r.status + "), il passera à l'heure suivante.");
  } catch(e){ console.warn("Robot non déclenché", e); }
}
let saveTimer = null;
function scheduleSave(){ clearTimeout(saveTimer); saveTimer = setTimeout(save, 1200); }
async function save(){
  if(S.saving || !S.pending.length) return;
  S.saving = true; updateSync();
  const ops = S.pending.splice(0);
  try {
    let done = false;
    for(let attempt=0; attempt<4 && !done; attempt++){
      const fresh = await ghGet();
      for(const op of ops) applyOp(fresh.data, JSON.parse(JSON.stringify(op)));
      const who = cfg.me || "staff";
      const msg = ops.length === 1 && ops[0].txt ? `${who} : ${ops[0].txt}` : `${who} : ${ops.length} modifications`;
      const sha = await ghPut(fresh.data, fresh.sha, msg.slice(0,200));
      if(sha && ops.some(o => o.notify)) notifyRobot();
      if(sha){
        S.sha = sha; S.data = fresh.data; ensureShape();
        for(const op of S.pending) applyOp(S.data, JSON.parse(JSON.stringify(op))); // modifs faites pendant l'envoi
        done = true;
      }
    }
    if(!done) throw new Error("Trop de conflits d'enregistrement, réessaie dans un instant.");
    S.lastError = null;
  } catch(e){
    S.pending.unshift(...ops); S.lastError = e.message; toast(e.message, true);
  } finally {
    S.saving = false; updateSync(); render();
    if(S.pending.length && !S.lastError) scheduleSave();
  }
}
async function pull(silent){
  if(S.mode !== "github" || S.saving || S.pending.length) return;
  try {
    const fresh = await ghGet();
    if(fresh.sha !== S.sha){ S.data = fresh.data; S.sha = fresh.sha; ensureShape(); render(); if(!silent) toast("Données mises à jour"); }
    else if(!silent) toast("Déjà à jour");
    S.lastError = null;
  } catch(e){ S.lastError = e.message; if(!silent) toast(e.message, true); }
  updateSync();
}
setInterval(() => { if(document.visibilityState === "visible") pull(true); }, 90000);
// Statut live relu toutes les 3 min (et au retour sur l'onglet)
const liveStale = () => S.data && !S.liveLoading && (!S.liveAt || Date.now() - S.liveAt > 180000);
setInterval(() => { if(document.visibilityState === "visible" && liveStale()) loadLive(); }, 30000);
document.addEventListener("visibilitychange", () => { if(document.visibilityState === "visible" && liveStale()) loadLive(); });
window.addEventListener("beforeunload", e => { if(S.pending.length || S.saving){ e.preventDefault(); e.returnValue = ""; } });

async function connectGithub(){
  if(!cfg.owner || !cfg.repo || !cfg.token){ S.mode = "none"; render(); return; }
  S.mode = "github"; updateSync("Connexion…", "busy");
  try { const r = await ghGet(); S.data = r.data; S.sha = r.sha; S.lastError = null; ensureShape(); render(); loadLive(); }
  catch(e){ S.mode = "none"; S.lastError = e.message; toast(e.message, true); render(); }
  updateSync();
}
function ensureShape(){
  const d = S.data; d.settings = d.settings || {}; d.propositions = d.propositions || []; d.membres = d.membres || [];
  d.snapshots = d.snapshots || []; d.journal = d.journal || [];
  d.settings.staff = d.settings.staff || []; d.settings.statutsProposition = d.settings.statutsProposition || [];
  d.settings.roles = d.settings.roles || ["Admin","Modo","Streamer"]; d.settings.liens = d.settings.liens || [];
  if(d.settings.nom) $("#brand").textContent = d.settings.nom;
}
function updateSync(txt, cls){
  const dot = $("#syncDot"), t = $("#syncTxt");
  if(txt){ dot.className = "dot " + (cls||""); t.textContent = txt; return; }
  if(S.mode === "github"){
    if(S.lastError){ dot.className = "dot err"; t.textContent = "Erreur de synchro"; }
    else if(S.saving || S.pending.length){ dot.className = "dot busy"; t.textContent = "Enregistrement…"; }
    else { dot.className = "dot ok"; t.textContent = `Synchronisé${cfg.me ? " · " + cfg.me : ""}`; }
  } else if(S.mode === "local"){ dot.className = "dot busy"; t.textContent = S.dirtyLocal ? "Mode fichier local · non exporté" : "Mode fichier local"; }
  else { dot.className = "dot"; t.textContent = "Non connecté"; }
}

/* ============ Données Twitch en direct ============ */
// Deux sources : l'API Twitch (si un membre du staff a connecté son compte Twitch dans Réglages) ou decapi.me en secours.
// decapi renvoie une durée (« 2 hours, 5 minutes ») seulement si la chaîne est en live ; tout autre texte = hors ligne ou erreur
const LIVE_RE = /^\d+\s+(day|hour|minute|second)s?(\s*,\s*\d+\s+(day|hour|minute|second)s?)*$/i;
const TW_KEY = "cabane.twitch";
let tw = store.get(TW_KEY, null);                        // {token}
const twClientId = () => (S.data?.settings.twitchClientId || "").trim();
const twitchOn = () => !!(tw?.token && twClientId());
const redirectUri = () => location.origin + location.pathname.replace(/index\.html$/, "");
function catchTwitchRedirect(){
  const h = location.hash.slice(1); if(!/access_token=|error=/.test(h)) return;
  const q = new URLSearchParams(h); let st = null;
  try { st = sessionStorage.getItem("cabane.twstate"); sessionStorage.removeItem("cabane.twstate"); } catch {}
  history.replaceState(null, "", location.pathname + location.search);
  if(q.get("error")){ setTimeout(() => toast("Connexion Twitch annulée ou refusée.", true), 300); return; }
  if(!st || q.get("state") !== st){ setTimeout(() => toast("Connexion Twitch refusée (vérification de sécurité).", true), 300); return; }
  tw = {token:q.get("access_token")}; store.set(TW_KEY, tw);
  setTimeout(() => toast("Compte Twitch connecté"), 300);
}
function twitchLogin(){
  const cid = twClientId(); if(!cid){ toast("Renseigne d'abord le Client ID Twitch.", true); return; }
  const st = Math.random().toString(36).slice(2) + Date.now().toString(36);
  try { sessionStorage.setItem("cabane.twstate", st); } catch {}
  location.href = `https://id.twitch.tv/oauth2/authorize?response_type=token&client_id=${encodeURIComponent(cid)}&redirect_uri=${encodeURIComponent(redirectUri())}&scope=&state=${st}`;
}
function twitchLogout(){ tw = null; store.del(TW_KEY); S.twIds = {}; render(); }
async function helix(path){
  const r = await fetch(`https://api.twitch.tv/helix/${path}`, {headers:{Authorization:`Bearer ${tw.token}`, "Client-Id":twClientId()}, cache:"no-store"});
  if(r.status === 401){ tw = null; store.del(TW_KEY); const e = new Error("twitch-auth"); throw e; }
  if(!r.ok) throw new Error("twitch-" + r.status);
  return r.json();
}
const chunks = (arr, n) => { const out = []; for(let i=0;i<arr.length;i+=n) out.push(arr.slice(i,i+n)); return out; };
function durationMs(d){ const m = /(?:(\d+)h)?(?:(\d+)m)?(?:(\d+)s)?/.exec(d||""); return m ? ((+m[1]||0)*3600 + (+m[2]||0)*60 + (+m[3]||0))*1000 : 0; }
function sinceTxt(iso){ const min = Math.max(0, Math.round((Date.now() - new Date(iso))/60000)); return min < 60 ? `${min} min` : `${Math.floor(min/60)} h ${String(min%60).padStart(2,"0")}`; }
async function fetchText(url){ const r = await fetch(url, {cache:"no-store"}); if(!r.ok) throw 0; return (await r.text()).trim(); }
async function pool(items, n, fn){ let i = 0; await Promise.all(Array.from({length:n}, async () => { while(i < items.length){ const it = items[i++]; await fn(it); if(i % 10 === 0) render(); } })); }

async function loadHelix(logins, full){
  const ids = S.twIds || (S.twIds = {});
  for(const c of chunks(logins.filter(l => !ids[l]), 100)){
    const j = await helix("users?" + c.map(l => "login=" + encodeURIComponent(l)).join("&"));
    j.data.forEach(u => { ids[u.login] = u.id; if(u.profile_image_url) S.avatars[u.login] = u.profile_image_url; });
  }
  const live = {};
  for(const c of chunks(logins.map(l => ids[l]).filter(Boolean), 100)){
    const j = await helix("streams?first=100&" + c.map(id => "user_id=" + id).join("&"));
    j.data.forEach(st => live[st.user_login] = st);
  }
  logins.forEach(l => { const e = S.live[l] || (S.live[l] = {}); e.notFound = !ids[l]; e.live = !!live[l]; e.uptime = live[l] ? sinceTxt(live[l].started_at) : ""; });
  if(!full) return;
  await pool(logins.filter(l => ids[l]), 6, async l => {
    const e = S.live[l];
    try { e.follows = (await helix(`channels/followers?broadcaster_id=${ids[l]}&first=1`)).total ?? null; } catch(err){ if(err.message === "twitch-auth") throw err; }
    try { const v = (await helix(`videos?user_id=${ids[l]}&type=archive&first=1`)).data[0];
      e.lastVod = v ? new Date(v.created_at).getTime() + durationMs(v.duration) : null; } catch(err){ if(err.message === "twitch-auth") throw err; }
  });
  S.fullAt = Date.now();
}
async function loadDecapi(logins){
  await pool(logins, 3, async login => {
    const e = S.live[login] || (S.live[login] = {});
    if(!(login in S.avatars)){ try { const a = await fetchText(`https://decapi.me/twitch/avatar/${encodeURIComponent(login)}`); S.avatars[login] = /^https:\/\//.test(a) ? a : null; } catch { S.avatars[login] = null; } }
    try { const f = await fetchText(`https://decapi.me/twitch/followcount/${encodeURIComponent(login)}`); e.follows = /^\d[\d,\s]*$/.test(f) ? parseInt(f.replace(/[^\d]/g,""),10) : null; } catch { e.follows = null; }
    try { const u = await fetchText(`https://decapi.me/twitch/uptime/${encodeURIComponent(login)}`); e.live = LIVE_RE.test(u); e.uptime = e.live ? u : ""; } catch { e.live = false; }
  });
}
async function loadLive(force){
  if(!S.data || S.liveLoading) return;
  S.liveLoading = true; render();
  const logins = [...new Set([
    ...S.data.membres.filter(m => m.statut !== "Parti").map(m => m.login),
    ...S.data.propositions.filter(p => !["Refusé","Abandonnée","Accepté"].includes(p.statut)).map(p => p.login)
  ])];
  try {
    if(twitchOn()){
      const full = force || !S.fullAt || Date.now() - S.fullAt > 15*60000;
      try { await loadHelix(logins, full); }
      catch(e){
        toast(e.message === "twitch-auth" ? "Session Twitch expirée : reconnecte-toi dans Réglages." : "API Twitch indisponible, lecture via decapi.", true);
        await loadDecapi(logins);
      }
    } else await loadDecapi(logins);
  } finally { S.liveLoading = false; S.liveAt = Date.now(); }
  recordSeenLive(); render();
}
// Mémorise le jour où une chaîne de La Cabane a été vue en live (sert au « dernier stream » quand il n'y a pas de VOD)
function recordSeenLive(){
  if(S.mode === "none") return;
  const today = todayISO();
  S.data.membres.forEach(m => { if(liveOf(m.login).live && m.dernierLive !== today) dispatch({t:"patch", c:"membres", id:m.id, p:{dernierLive:today}, auto:true}); });
}
function lastStream(m){
  const l = liveOf(m.login);
  if(l.live) return {live:true, days:0};
  const c = [];
  if(l.lastVod) c.push({t:l.lastVod, src:"dernière VOD"});
  if(m.derniereVod) c.push({t:new Date(m.derniereVod).getTime(), src:"dernière VOD (robot)"});
  if(m.dernierLive) c.push({t:new Date(m.dernierLive + "T12:00:00").getTime(), src:"vu en live sur La Cabane"});
  if(m.dernierStreamManuel) c.push({t:new Date(m.dernierStreamManuel + "T12:00:00").getTime(), src:"saisie manuelle"});
  if(!c.length) return null;
  const best = c.reduce((a,b) => b.t > a.t ? b : a);
  const d0 = new Date(); d0.setHours(0,0,0,0); const d1 = new Date(best.t); d1.setHours(0,0,0,0);
  return {days:Math.max(0, Math.round((d0 - d1)/864e5)), date:d1, src:best.src};
}
function lastStreamCell(m){
  const x = lastStream(m);
  if(!x) return `<span class="muted" title="${twitchOn() ? "Aucune VOD publique : saisis la date sur la fiche" : "Connecte Twitch dans Réglages pour lire la dernière VOD"}">–</span>`;
  if(x.live) return `<span class="up">en live</span>`;
  const cls = x.days >= 30 ? "down" : x.days >= 14 ? "warn" : "";
  return `<span class="${cls}" title="${x.date.toLocaleDateString("fr-FR")} · ${x.src}">${x.days === 0 ? "aujourd'hui" : x.days + " j"}</span>`;
}
const liveOf = login => S.live[login] || {};
function avatarHtml(login, big){
  const u = S.avatars[login], cls = "av" + (big ? " big" : "");
  if(!u) return `<span class="${cls}" aria-hidden="true">${esc((login || "?")[0])}</span>`;
  const src = u.replace(/\d+x\d+(\.\w+)$/, (big ? "150x150" : "70x70") + "$1");
  return `<img class="${cls}" src="${esc(src)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.onerror=null;this.src='${esc(u)}'">`;
}
const liveStamp = () => S.liveAt ? ` · live vérifié à ${new Date(S.liveAt).toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"})}` : "";
function currentFollows(m){ return m.followsMode === "manuel" ? (m.followsManuel ?? null) : (liveOf(m.login).follows ?? null); }
function refSnapshot(){
  const snaps = S.data.snapshots; if(!snaps.length) return null;
  if(S.f.ref) return snaps.find(s => s.date === S.f.ref) || null;
  const limit = new Date(Date.now() - 7*864e5).toISOString().slice(0,10);
  const older = snaps.filter(s => s.date <= limit);
  return older.length ? older[older.length-1] : snaps[0];
}

/* ============ Anniversaires ============ */
function annivInfo(iso){
  if(!iso) return null;
  const [y,m,d] = iso.split("-").map(Number);
  const t = new Date(); t.setHours(0,0,0,0);
  let next = new Date(t.getFullYear(), m-1, d);
  if(next < t) next = new Date(t.getFullYear()+1, m-1, d);
  const days = Math.round((next - t) / 864e5);
  return {days, years: next.getFullYear() - y, next};
}

/* ============ Libellés statuts ============ */
function statutClass(s){
  return ({"Accepté":"s-accepte","Refusé":"s-refuse","Abandonnée":"s-abandon","Attente staff":"s-attente","Proposition en cours":"s-encours","Proposition à faire":"s-afaire","Aucun contact":"s-aucun","Présent":"s-present","Parti":"s-parti"})[s] || "s-vide";
}
const pill = (s, empty="À trier") => `<span class="pill ${statutClass(s)}">${esc(s || empty)}</span>`;
function avisKind(v){ const t = String(v||"").toLowerCase(); if(!t) return ""; if(t.startsWith("pour")||t==="oui"||t==="👍") return "pour"; if(t.startsWith("contre")||t==="non"||t==="👎") return "contre"; if(t.startsWith("neutre")||t.startsWith("mitig")) return "neutre"; return "autre"; }
function contactHtml(c){
  if(!c) return "";
  if(/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(c)) return `<a href="mailto:${esc(c)}" onclick="event.stopPropagation()">${esc(c)}</a>`;
  const u = safeUrl(c); if(!u) return esc(c);
  let label = u; try { const h = new URL(u).hostname.replace(/^www\./,""); label = h.includes("discord") ? "Discord" : h.includes("instagram") ? "Instagram" : (h === "x.com" || h.includes("twitter")) ? "X" : h.includes("tiktok") ? "TikTok" : h; } catch {}
  return `<a href="${esc(u)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${esc(label)}</a>`;
}
function sortRows(rows, [key, dir], getters){
  const g = getters[key] || (r => r[key]);
  return rows.sort((a,b) => { const x = g(a), y = g(b);
    if(x == null || x === "") return 1; if(y == null || y === "") return -1;
    return (typeof x === "number" && typeof y === "number" ? x - y : String(x).localeCompare(String(y), "fr", {numeric:true})) * dir; });
}
const th = (label, key, sort, cls="") => `<th data-sort="${key}" class="${cls}" aria-sort="${sort[0]===key ? (sort[1]>0?"ascending":"descending") : "none"}">${label}${sort[0]===key ? ` <span class="arrow">${sort[1]>0?"▲":"▼"}</span>` : ""}</th>`;

function render(){
  document.querySelectorAll("#nav button").forEach(b => b.setAttribute("aria-current", b.dataset.view === S.view ? "page" : "false"));
  const main = $("#main");
  if(!S.data && S.view !== "reglages"){ main.innerHTML = viewSetup(); renderDrawer(); return; }
  if(S.selView !== S.view){ S.sel.clear(); S.selView = S.view; }
  renderTicker();
  const v = {accueil:viewAccueil, propositions:viewPropositions, membres:viewMembres, anniv:viewAnniv, stats:viewStats, reglages:viewReglages}[S.view];
  const focus = document.activeElement && document.activeElement.id; const caret = document.activeElement && document.activeElement.selectionStart;
  // Les rafraîchissements automatiques (live, synchro) ne doivent pas effacer ce qu'on est en train de saisir
  const saisies = [...main.querySelectorAll("input[id], textarea[id], select[id]")].filter(el =>
    el.type === "checkbox" ? el.checked !== el.defaultChecked
    : el.tagName === "SELECT" ? [...el.options].some(o => o.selected !== o.defaultSelected)
    : el.value !== el.defaultValue).map(el => [el.id, el.type === "checkbox" ? el.checked : el.value]);
  main.innerHTML = tokenWarning() + v();
  for(const [id, val] of saisies){ const el = document.getElementById(id); if(!el) continue; if(el.type === "checkbox") el.checked = val; else el.value = val; }
  if(focus){ const el = document.getElementById(focus); if(el){ el.focus(); try { el.setSelectionRange(caret, caret); } catch {} } }
  renderDrawer();
}

/* ----- Données mesurées par le robot ----- */
// viewers : échantillons horaires [["2026-09-25T20", 12], …] pris par le robot quand la chaîne est en live
function viewersStats(r, days = 30){
  const lim = new Date(Date.now() - days*864e5).toISOString().slice(0,10);
  const smp = (r.viewers || []).filter(x => x[0].slice(0,10) >= lim);
  if(!smp.length) return null;
  const sum = smp.reduce((a,x) => a + x[1], 0);
  return {avg:Math.round(sum / smp.length * 10) / 10, n:smp.length, days:new Set(smp.map(x => x[0].slice(0,10))).size, hours:smp.length};
}
const typeTag = r => r.introuvable ? `<span class="tag ko" title="Introuvable sur Twitch depuis le ${fmtDate(r.introuvable)}">introuvable</span>`
  : r.type === "partner" ? `<span class="tag par" title="Partenaire Twitch">partenaire</span>`
  : r.type === "affiliate" ? `<span class="tag aff" title="Affilié Twitch">affilié</span>` : "";
const viewersCell = r => { const v = viewersStats(r); return v ? `<span title="${v.n} mesures sur ${v.days} jours de live">${v.avg}</span>` : `<span class="muted" title="Pas encore de mesure : le robot en prend une par heure de live">–</span>`; };
function voteInfo(p){
  const staff = S.data.settings.staff;
  const kinds = staff.map(s => avisKind(p.avis?.[s]));
  const c = {pour:0, contre:0, neutre:0, autre:0}; kinds.forEach(k => k && c[k]++);
  const done = kinds.filter(Boolean).length, missing = staff.filter((s,i) => !kinds[i]);
  let suggestion = null;
  const tranche = c.pour + c.contre;
  if(done === staff.length && staff.length){
    suggestion = c.pour > c.contre ? "Accepté" : c.contre > c.pour ? "Refusé" : null;
  } else if(staff.length && c.pour > staff.length / 2) suggestion = "Accepté";
  else if(staff.length && c.contre > staff.length / 2) suggestion = "Refusé";
  return {c, done, total:staff.length, missing, suggestion, egalite: done === staff.length && tranche > 0 && c.pour === c.contre};
}
function evenementsRecents(days){
  const lim = new Date(Date.now() - days*864e5).toISOString().slice(0,10);
  const pal = (S.data?.paliers || []).filter(x => x.date >= lim).map(x => ({date:x.date, login:x.login, kind:"palier", txt:`${x.palier} follows`}));
  const ev = (S.data?.evenements || []).filter(x => x.date >= lim && (x.type === "affilie" || x.type === "partenaire"))
    .map(x => ({date:x.date, login:x.login, kind:x.type, txt:x.type === "affilie" ? "affilié Twitch" : "partenaire Twitch"}));
  return [...ev, ...pal].sort((a,b) => b.date.localeCompare(a.date));
}

/* ----- Import de propositions en lot ----- */
function parseImport(text){
  const d = S.data, seen = new Set(), res = {nouveaux:[], props:[], membres:[], corbeille:[], doublons:[], ignores:[]};
  for(const raw of text.split(/\r?\n/)){
    const line = raw.trim(); if(!line) continue;
    const found = [...line.matchAll(/twitch\.tv\/([A-Za-z0-9_]{2,25})/gi)].map(m => m[1].toLowerCase());
    let cands = found;
    if(!cands.length) cands = line.split(/[,;\t]+/).map(x => x.trim().replace(/^@/, "").toLowerCase()).filter(Boolean);
    const ok = cands.filter(x => /^[a-z0-9_]{2,25}$/.test(x));
    if(!ok.length){ res.ignores.push(line); continue; }
    if(!found.length && ok.length !== cands.length){ res.ignores.push(line); continue; }   // ligne de texte libre : on ne devine pas
    for(const l of ok){
      if(seen.has(l)){ res.doublons.push(l); continue; } seen.add(l);
      const p = d.propositions.find(x => x.login === l), m = d.membres.find(x => x.login === l), t = (d.corbeille || []).find(x => x.r.login === l);
      if(p) res.props.push({l, info:p.statut || "À trier"}); else if(m) res.membres.push({l, info:m.statut || "À renseigner"});
      else if(t) res.corbeille.push({l, info:"dans la corbeille"}); else res.nouveaux.push(l);
    }
  }
  return res;
}

function lineChart(pts, opts = {}){

  const X = i => L + i / (pts.length - 1) * (W - L - Rr), Y = v => T + (1 - (v - lo) / span) * (H - T - B);
  const line = pts.map((p,i) => `${X(i).toFixed(1)},${Y(p.v).toFixed(1)}`).join(" ");
  const ticks = [lo, lo + span/2, hi].map(v => `<text x="${L-6}" y="${Y(v)+4}" text-anchor="end">${Math.round(v)}</text><line class="ax" x1="${L}" x2="${W-Rr}" y1="${Y(v)}" y2="${Y(v)}" stroke-dasharray="2 4"/>`).join("");
  const step = Math.max(1, Math.ceil(pts.length / 6));
  const labels = pts.map((p,i) => i % step === 0 || i === pts.length - 1 ? `<text x="${X(i)}" y="${H-5}" text-anchor="middle">${esc(p.l)}</text>` : "").join("");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.label || "")}">${ticks}
    <polygon class="ar" points="${X(0)},${H-B} ${line} ${X(pts.length-1)},${H-B}"/><polyline class="ln" points="${line}"/>${labels}</svg>`;
}

  const byStatut = {}; d.propositions.forEach(p => byStatut[p.statut || "À trier"] = (byStatut[p.statut || "À trier"] || 0) + 1);
  const transferes = d.membres.filter(m => m.candidature);
  const acceptes = (byStatut["Accepté"] || 0) + transferes.length, refuses = (byStatut["Refusé"] || 0) + (byStatut["Abandonnée"] || 0);
  const taux = acceptes + refuses ? Math.round(acceptes / (acceptes + refuses) * 100) : null;
  const delais = [...transferes.map(m => [m.candidature.dateProposition, m.candidature.transfereLe]),
                  ...d.propositions.filter(p => ["Accepté","Refusé"].includes(p.statut)).map(p => [p.dateProposition, p.dateRevue])]
    .filter(([a,b]) => a && b).map(([a,b]) => (new Date(b) - new Date(a)) / 864e5).filter(x => x >= 0);
  const delai = delais.length ? Math.round(delais.reduce((a,b) => a+b, 0) / delais.length) : null;

  const affi = actifs.filter(m => m.type === "affiliate").length, part = actifs.filter(m => m.type === "partner").length;
  const month = today.slice(0,7);

  const arrivMois = d.membres.filter(m => (m.arrivee || "").startsWith(month)).length, departMois = d.membres.filter(m => (m.depart || "").startsWith(month)).length;
  const kpi = (label, val, sub) => `<div class="kpi"><span>${label}</span><b>${val}</b>${sub ? `<small>${sub}</small>` : ""}</div>`;
  return `<h1>Tableau de bord</h1><p class="sub">La Cabane dans son ensemble</p>
  <div class="kpis">
    ${kpi("Membres présents", actifs.filter(m => m.statut === "Présent").length, `${actifs.length} sans les partis · ${arrivMois} arrivé${arrivMois>1?"s":""}, ${departMois} départ${departMois>1?"s":""} ce mois`)}
    ${kpi("Follows cumulés", totalNow != null ? totalNow.toLocaleString("fr-FR") : "–", prog30 != null ? `<span class="${prog30>=0?"up":"down"}">${prog30>=0?"+":""}${prog30.toLocaleString("fr-FR")}</span> sur 30 jours` : "relevé du " + (lastSnap ? fmtDate(lastSnap.date) : "–"))}
    ${kpi("Affiliés / partenaires", `${affi} / ${part}`, `sur ${actifs.filter(m => m.type !== undefined).length} chaînes vérifiées`)}
    ${kpi("Viewers moyens", vAll.length ? (Math.round(vAll.reduce((a,b)=>a+b,0) / vAll.length * 10) / 10) : "–", vAll.length ? `moyenne de ${vAll.length} chaînes, 30 jours` : "mesures en cours")}
    ${kpi("Taux d'acceptation", taux != null ? taux + " %" : "–", `${acceptes} acceptées, ${refuses} refusées ou abandonnées`)}
    ${kpi("Délai de décision", delai != null ? delai + " j" : "–", delais.length ? `moyenne sur ${delais.length} décisions datées` : "pas encore de dates")}
    ${kpi("Paliers ce mois", palMois, "paliers de 50 follows franchis")}
  </div>
  <section class="card" style="margin-bottom:14px"><h2>Carte récap du mois</h2>
    <div class="tools" style="margin:0 0 12px">
      <select id="recapMonth" aria-label="Mois">${recapMonths().map(m => `<option value="${m.k}" ${S.recapMonth === m.k ? "selected" : ""}>${esc(m.l)}</option>`).join("")}</select>
      <button class="btn primary" id="recapGo">Générer l'image</button>
      ${S.recapUrl ? `<a class="btn" href="${S.recapUrl}" download="la-cabane-recap-${esc(S.recapMonth)}.png">Télécharger</a><button class="btn" id="recapCopy">Copier (pour coller dans Discord)</button>` : ""}
    </div>
    ${S.recapUrl ? `<div class="recap"><img src="${S.recapUrl}" alt="Carte récap du mois" style="width:100%;border-radius:10px;border:1px solid var(--line)"><p class="meta">Format 1080 × 1350, lisible sur Discord et sur les réseaux. Les chiffres viennent des relevés du robot et des fiches.</p></div>` : `<p class="meta" style="margin:0">Choisis un mois puis génère l'image : nouveaux membres, follows gagnés, meilleures progressions, paliers, affiliations et anniversaires.</p>`}
  </section>
  <div class="charts">
    <section class="card"><h2>Membres présents (12 mois)</h2>${lineChart(presents, {zero:true, label:"Membres présents par mois"})}<p class="meta">D'après les dates d'arrivée et de départ renseignées.</p></section>

/* ----- Bandeau d'anniversaires ----- */
function recentPaliers(days){
  const lim = new Date(Date.now() - days*864e5).toISOString().slice(0,10);
  return (S.data?.paliers || []).filter(x => x.date >= lim).sort((a,b) => b.date.localeCompare(a.date) || b.palier - a.palier);
}
function renderTicker(){
  const el = $("#ticker"); if(!el) return;
  const list = (S.data?.membres || []).filter(m => m.statut !== "Parti" && m.premierStream)
    .map(m => ({m, a:annivInfo(m.premierStream)})).filter(x => x.a.days <= 7).sort((x,y) => x.a.days - y.a.days);
  const today = list.filter(x => x.a.days === 0);
  const shown = today.length ? today : list;
  const pal = recentPaliers(3);
  const aff = (S.data?.evenements || []).filter(x => (x.type === "affilie" || x.type === "partenaire") && x.date >= new Date(Date.now() - 3*864e5).toISOString().slice(0,10));
  const key = shown.map(x => x.m.id + x.a.days).join("|") + "#" + pal.map(x => x.login + x.palier).join("|") + "#" + aff.map(x => x.login + x.type).join("|");
  if(key === S.tickerKey) return; S.tickerKey = key;
  if(!shown.length && !pal.length && !aff.length){ el.classList.add("hidden"); el.innerHTML = ""; return; }
  const ans = n => `${n} ${n > 1 ? "ans" : "an"}`;
  let items = shown.map(({m,a}) => a.days === 0
    ? `<span class="it" data-open="membres:${m.id}">🎂 Joyeux anniversaire de stream à <b>${esc(m.login)}</b> : ${ans(a.years)} de live aujourd'hui !</span>`
    : `<span class="it" data-open="membres:${m.id}">🎂 <b>${esc(m.login)}</b> fêtera ses ${ans(a.years)} de stream ${a.days === 1 ? "demain" : `dans ${a.days} jours`} (${a.next.toLocaleDateString("fr-FR",{day:"numeric",month:"long"})})</span>`).join("");
  const palItems = pal.map(x => { const m = S.data.membres.find(y => y.login === x.login);
    return `<span class="it" ${m ? `data-open="membres:${m.id}"` : ""}>🚀 <b>${esc(x.login)}</b> a passé les ${x.palier} follows${x.date === todayISO() ? " aujourd'hui" : ""} !</span>`; }).join("");
  const affItems = aff.map(x => { const m = S.data.membres.find(y => y.login === x.login);
    return `<span class="it" ${m ? `data-open="membres:${m.id}"` : ""}>🎉 <b>${esc(x.login)}</b> est devenu ${x.type === "affilie" ? "affilié" : "partenaire"} Twitch !</span>`; }).join("");
  items = (today.length ? items + affItems + palItems : affItems + palItems + items);
  const len = items.replace(/<[^>]+>/g,"").length;
  el.innerHTML = `<div class="track" style="--dur:${Math.max(16, Math.round(len * 0.2))}s"><span>${items}</span><span class="dup" aria-hidden="true">${items}</span></div>`;
  el.classList.remove("hidden");
}

/* ----- Courbe des follows ----- */
function sparkline(m){
  const pts = S.data.snapshots.filter(s => s.follows?.[m.login] != null).map(s => ({d:s.date, v:s.follows[m.login]}));
  const cur = currentFollows(m), today = todayISO();
  if(cur != null && !pts.some(p => p.d === today)) pts.push({d:today, v:cur, now:true});
  if(pts.length < 2) return `<p class="meta">La courbe apparaîtra dès qu'il y aura deux relevés (le robot en fait matin, midi et soir).</p>`;
  const W = 320, H = 96, P = 8, B = 16;
  const t0 = new Date(pts[0].d).getTime(), t1 = new Date(pts[pts.length-1].d).getTime() || t0 + 1;
  const vs = pts.map(p => p.v), lo = Math.min(...vs), hi = Math.max(...vs), span = hi - lo || 1;
  const X = p => P + (t1 === t0 ? 0 : (new Date(p.d).getTime() - t0) / (t1 - t0)) * (W - 2*P);
  const Y = p => P + (1 - (p.v - lo) / span) * (H - P - B);
  const line = pts.map(p => `${X(p).toFixed(1)},${Y(p).toFixed(1)}`).join(" ");
  const diff = pts[pts.length-1].v - pts[0].v;
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" role="img" aria-label="Évolution des follows : de ${pts[0].v} à ${pts[pts.length-1].v}">
    <polygon class="area" points="${X(pts[0]).toFixed(1)},${H-B} ${line} ${X(pts[pts.length-1]).toFixed(1)},${H-B}"/>
    <polyline class="ln" points="${line}"/>
    ${pts.length <= 40 ? pts.map(p => `<circle class="${p.now ? "now" : ""}" cx="${X(p).toFixed(1)}" cy="${Y(p).toFixed(1)}" r="2.6"><title>${fmtDate(p.d)} : ${p.v}</title></circle>`).join("") : ""}
    <text x="${P}" y="${H-3}">${fmtDate(pts[0].d)}</text><text x="${W-P}" y="${H-3}" text-anchor="end">${fmtDate(pts[pts.length-1].d)}</text>
  </svg>
  <p class="meta" style="margin-top:4px">${pts[0].v} → <b>${pts[pts.length-1].v}</b> follows (<span class="${diff>0?"up":diff<0?"down":""}">${diff>0?"+":""}${diff}</span>) · min ${lo}, max ${hi} · ${pts.length} relevés</p>`;
}

/* ----- Historique d'une chaîne ----- */
function journalFor(login){
  const re = new RegExp(`(^|[^a-z0-9_])${login.replace(/[^a-z0-9_]/g,"")}([^a-z0-9_]|$)`, "i");
  return (S.data.journal || []).filter(j => re.test(j.txt)).slice(0, 12);
}
function historyBlock(r, c){
  const parts = [];
  if(c === "propositions"){
    (r.historique || []).slice().reverse().forEach(h => parts.push(`<li><span class="when">${fmtDate(h.le)}</span>candidature précédente : ${pill(h.statut)} ${h.proposePar ? "· proposée par " + esc(h.proposePar) : ""}${h.dateProposition ? " le " + fmtDate(h.dateProposition) : ""}${Object.keys(h.avis||{}).length ? "<br><span class='muted'>Avis : " + Object.entries(h.avis).map(([k,v]) => esc(k) + " " + esc(v)).join(", ") + "</span>" : ""}${h.commentaire ? "<br><span class='muted'>« " + esc(h.commentaire) + " »</span>" : ""}</li>`));
    const m = S.data.membres.find(x => x.login === r.login);
    if(m) parts.unshift(`<li><span class="when">La Cabane</span>${m.statut === "Parti" ? `a quitté La Cabane${m.depart ? " le " + fmtDate(m.depart) : ""}` : `membre${m.arrivee ? " depuis le " + fmtDate(m.arrivee) : ""}`} · <a href="#" data-open="membres:${m.id}">voir la fiche</a></li>`);
  } else {
    const cd = r.candidature;
    if(cd) parts.push(`<li><span class="when">${fmtDate(cd.transfereLe)}</span>transféré depuis les Propositions${cd.transferePar ? " par " + esc(cd.transferePar) : ""} · proposé${cd.proposePar ? " par " + esc(cd.proposePar) : ""}${cd.dateProposition ? " le " + fmtDate(cd.dateProposition) : ""}${Object.keys(cd.avis||{}).length ? "<br><span class='muted'>Avis : " + Object.entries(cd.avis).map(([k,v]) => esc(k) + " " + esc(v)).join(", ") + "</span>" : ""}${cd.commentaire ? "<br><span class='muted'>« " + esc(cd.commentaire) + " »</span>" : ""}${cd.contact ? "<br><span class='muted'>Contact : " + contactHtml(cd.contact) + "</span>" : ""}</li>`);
    const p = S.data.propositions.find(x => x.login === r.login);
    if(p) parts.push(`<li><span class="when">Proposition</span>${pill(p.statut)}${p.proposePar ? " · proposée par " + esc(p.proposePar) : ""}${p.dateProposition ? " le " + fmtDate(p.dateProposition) : ""} · <a href="#" data-open="propositions:${p.id}">voir</a></li>`);
  }
  journalFor(r.login).forEach(j => parts.push(`<li><span class="when">${fmtStamp(j.le)}</span><b>${esc(j.par)}</b> · ${esc(j.txt)}</li>`));
  return `<fieldset><legend>Historique</legend>${parts.length ? `<ul class="hist">${parts.join("")}</ul>` : `<p class="meta" style="margin-top:0">Aucun historique pour l'instant.</p>`}</fieldset>`;
}

function renderDrawer(){

  if(!S.drawer || !S.data){ root.innerHTML = ""; return; }
  const {c, id} = S.drawer; const r = S.data[c].find(x => x.id === id);
  if(!r){ S.drawer = null; root.innerHTML = ""; return; }
  // Ne pas écraser un champ en cours de saisie
  if(root.contains(document.activeElement) && root.dataset.key === c+id && document.activeElement.matches("input:not([type=checkbox]),textarea")) return;
  root.dataset.key = c+id;
  const scroll = root.querySelector(".body")?.scrollTop || 0;
  root.innerHTML = `<div class="scrim" data-close></div>
    <aside class="drawer" role="dialog" aria-modal="true" aria-label="${esc(r.login)}">
      <div class="head">${avatarHtml(r.login, true)}<h2><a class="chanlink" href="https://www.twitch.tv/${encodeURIComponent(r.login)}" target="_blank" rel="noopener" title="Ouvrir la chaîne Twitch">${esc(r.login)} <span aria-hidden="true">↗</span></a></h2>${liveOf(r.login).live ? `<span class="live">LIVE</span>` : ""}<button class="btn ghost" data-close aria-label="Fermer">✕</button></div>

}
