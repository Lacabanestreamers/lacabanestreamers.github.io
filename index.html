<!DOCTYPE html>

<script>
// Connexion Twitch lancée depuis la vitrine : Twitch revient ici (adresse déjà autorisée), on renvoie aussitôt vers la vitrine.
(function(){ try {
  // Twitch renvoie le jeton dans « #… », mais un refus (« Annuler ») peut arriver dans « ?error=… » : on gère les deux
  var h = location.hash, q = new URLSearchParams(location.search);
  if(!/access_token=|error=/.test(h) && q.has("error")) h = "#" + location.search.slice(1);
  if(!/access_token=|error=/.test(h)) return;
  var r = JSON.parse(sessionStorage.getItem("cabane.vitrine.oauth") || "null"), st = new URLSearchParams(h.slice(1)).get("state");
  if(r && r.etat === st){ window.__versVitrine = true; location.replace(location.origin + "/vitrine/" + (r.retour || "") + h); } } catch(e){} })();
</script>
