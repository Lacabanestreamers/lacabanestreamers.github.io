<!DOCTYPE html>
<html lang="fr">
<head>
<script>
// Connexion Twitch lancée depuis la vitrine : Twitch revient ici (adresse déjà autorisée), on renvoie aussitôt vers la vitrine.
(function(){ try {
  // Twitch renvoie le jeton dans « #… », mais un refus (« Annuler ») peut arriver dans « ?error=… » : on gère les deux
  var h = location.hash, q = new URLSearchParams(location.search);
  if(!/access_token=|error=/.test(h) && q.has("error")) h = "#" + location.search.slice(1);
  if(!/access_token=|error=/.test(h)) return;
  var r = JSON.parse(sessionStorage.getItem("cabane.vitrine.oauth") || "null"), st = new URLSearchParams(h.slice(1)).get("state");
  if(r && r.etat === st){ window.__versVitrine = true; location.replace(location.origin + "/vitrine/" + (r.retour || "") + h); } } catch(e){} })();
</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>La Cabane · Suivi staff</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛖</text></svg>">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#100B24">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="La Cabane">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#100B24; --panel:#18123A; --panel2:#201951; --line:#2E2663; --text:#ECE9FF; --muted:#9C95CB;
  --cyan:#3DE3FF; --pink:#FF4FD8; --ok:#5CF2A6; --warn:#FFC857; --ko:#FF5C7A; --grey:#8E89B4;
  --radius:10px; color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font:500 16px/1.4 Rajdhani,"Segoe UI",system-ui,sans-serif;min-height:100vh}
a{color:var(--cyan);text-decoration:none}
a:hover{text-decoration:underline}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.hidden{display:none!important}

/* En-tête */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(16,11,36,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:18px;padding:10px 20px;flex-wrap:wrap}
.brand{font:800 20px/1 Orbitron,sans-serif;letter-spacing:.04em;color:var(--text);text-shadow:0 0 12px rgba(255,79,216,.55);white-space:nowrap}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav button{background:none;border:0;padding:8px 14px;border-radius:8px;cursor:pointer;color:var(--muted);font-weight:700;font-size:17px}
nav button[aria-current="page"]{color:var(--text);background:var(--panel2);box-shadow:inset 0 -2px 0 var(--pink)}
.sync{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--grey)}
.dot.ok{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.dot.busy{background:var(--warn);box-shadow:0 0 8px var(--warn)}
.dot.err{background:var(--ko);box-shadow:0 0 8px var(--ko)}

main{padding:20px;max-width:1500px;margin:0 auto}
h1{font:800 26px/1.1 Orbitron,sans-serif;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 18px}

/* Boutons */
.btn{border:1px solid var(--line);background:var(--panel2);padding:7px 14px;border-radius:8px;cursor:pointer;font-weight:700}
.btn:hover{border-color:var(--cyan)}
.btn.primary{background:var(--pink);border-color:var(--pink);color:#1a0716}
.btn.primary:hover{filter:brightness(1.1)}
.btn.ghost{background:none}
.btn.danger{border-color:var(--ko);color:var(--ko);background:none}
.btn:disabled{opacity:.5;cursor:default}

/* Barre d'outils */
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.search{flex:1 1 220px;max-width:340px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 12px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 12px;cursor:pointer;font-weight:600;font-size:15px;display:inline-flex;gap:6px;align-items:center}
.chip b{font-weight:700;color:var(--muted)}
.chip[aria-pressed="true"]{border-color:var(--cyan);background:rgba(61,227,255,.12)}
.chip[aria-pressed="true"] b{color:var(--cyan)}

/* Tableaux */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:15.5px}
th,td{padding:8px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{position:sticky;top:0;background:var(--panel2);color:var(--muted);font-weight:700;font-size:14px;cursor:pointer;user-select:none}
th[data-sort]:hover{color:var(--text)}
th .arrow{color:var(--cyan)}
tbody tr{cursor:pointer}
tbody tr:hover{background:rgba(255,255,255,.03)}
tbody tr:last-child td{border-bottom:0}
td.num{text-align:right;font-variant-numeric:tabular-nums}
.login{font-weight:700;color:var(--text)}
.who{display:inline-flex;align-items:center;gap:8px;vertical-align:middle}
.av{width:22px;height:22px;border-radius:50%;object-fit:cover;flex:none;margin:-3px 0;background:var(--line);display:inline-grid;place-items:center;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase}
.av.big{width:36px;height:36px;margin:0;font-size:18px;box-shadow:0 0 0 2px var(--pink)}
.muted{color:var(--muted)}
.empty{padding:40px;text-align:center;color:var(--muted)}
.up{color:var(--ok)} .down{color:var(--ko)} .warn{color:var(--warn)}

.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:14px;font-weight:700;border:1px solid currentColor}
.s-accepte{color:var(--ok)} .s-refuse{color:var(--ko)} .s-abandon{color:var(--grey)}
.s-attente{color:var(--warn)} .s-encours{color:var(--cyan)} .s-afaire{color:#A99BFF} .s-aucun{color:var(--grey)} .s-vide{color:var(--muted);border-style:dashed}
.s-present{color:var(--ok)} .s-parti{color:var(--grey)}

.live{display:inline-flex;align-items:center;gap:5px;color:var(--ko);font-weight:700;font-size:14px}
.live::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ko);box-shadow:0 0 8px var(--ko)}
.avis{display:inline-flex;gap:3px}
.avis i{width:10px;height:10px;border-radius:3px;background:var(--line);display:inline-block}
.avis i.pour{background:var(--ok)} .avis i.contre{background:var(--ko)} .avis i.neutre{background:var(--warn)} .avis i.autre{background:var(--cyan)}

/* Tiroir d'édition */
.scrim{position:fixed;inset:0;background:rgba(5,3,15,.6);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--panel);border-left:1px solid var(--line);z-index:41;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer .head{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line)}
.drawer .head h2 a.chanlink{color:var(--text)}
.drawer .head h2 a.chanlink:hover{color:var(--cyan);text-decoration:none}
.drawer .head h2 a.chanlink span{font-size:.7em;color:var(--muted)}
.drawer .head h2{margin:0;font:700 22px/1.2 Orbitron,sans-serif;flex:1;overflow:hidden;text-overflow:ellipsis}
.drawer .body{padding:18px 20px;overflow-y:auto;flex:1}
.drawer .foot{display:flex;gap:10px;padding:14px 20px;border-top:1px solid var(--line);flex-wrap:wrap}
.links{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:16px;font-weight:600}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.grid .full{grid-column:1/-1}
label.f{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--muted);font-weight:600}
label.f input,label.f select,label.f textarea{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;color:var(--text);font-size:16px;font-weight:500}
label.f textarea{min-height:80px;resize:vertical}
label.check{display:flex;align-items:center;gap:8px;color:var(--text)}
fieldset{border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;margin:16px 0 0}
legend{padding:0 6px;color:var(--pink);font-weight:700}
.avisrow{display:grid;grid-template-columns:80px 1fr;gap:8px;align-items:center;margin-bottom:8px}
.avisrow.me span{color:var(--pink);font-weight:700}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:4px 10px;cursor:pointer;font-weight:600;font-size:14px}
.seg button[aria-pressed="true"].pour{border-color:var(--ok);color:var(--ok)}
.seg button[aria-pressed="true"].contre{border-color:var(--ko);color:var(--ko)}
.seg button[aria-pressed="true"].neutre{border-color:var(--warn);color:var(--warn)}
.seg input{flex:1;min-width:120px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:4px 8px}
.meta{font-size:13px;color:var(--muted);margin-top:14px}

/* Anniversaires */
.annivs{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.ann{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;cursor:pointer;display:grid;grid-template-columns:62px 1fr;gap:12px;align-items:center}
.ann .d{text-align:center;border-right:1px solid var(--line);padding-right:10px}
.ann .d b{display:block;font:800 22px/1 Orbitron,sans-serif}
.ann .d small{color:var(--muted)}
.ann.soon{border-color:var(--pink);box-shadow:0 0 0 1px var(--pink) inset}
.ann.today{background:linear-gradient(135deg,rgba(255,79,216,.18),rgba(61,227,255,.12));border-color:var(--pink)}
h3.month{font:700 16px/1 Orbitron,sans-serif;color:var(--muted);margin:22px 0 10px}

/* Réglages / connexion */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;margin-bottom:16px;max-width:760px}
.panel h2{margin:0 0 6px;font:700 18px/1.2 Orbitron,sans-serif}
.panel p{color:var(--muted);margin:0 0 12px}
.journal{list-style:none;margin:0;padding:0;font-size:15px}
.journal li{padding:6px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:130px 90px 1fr;gap:10px}
.journal li:last-child{border-bottom:0}

/* Bandeau anniversaires */
.ticker{flex:1 1 220px;min-width:0;height:34px;overflow:hidden;display:flex;align-items:center;border:1px solid var(--line);border-radius:999px;background:linear-gradient(90deg,rgba(255,79,216,.14),rgba(61,227,255,.08));-webkit-mask-image:linear-gradient(90deg,transparent,#000 28px,#000 calc(100% - 28px),transparent);mask-image:linear-gradient(90deg,transparent,#000 28px,#000 calc(100% - 28px),transparent)}
.ticker .track{display:inline-flex;white-space:nowrap;will-change:transform}
.ticker .it{padding:0 34px;font-weight:700;font-size:15px;cursor:pointer}
.ticker .it b{color:var(--pink)}
.ticker .it:hover b{text-decoration:underline}
@media (prefers-reduced-motion:no-preference){
  .ticker .track{animation:tick var(--dur,30s) linear infinite}
  .ticker:hover .track{animation-play-state:paused}
  @keyframes tick{from{transform:translateX(0)}to{transform:translateX(-50%)}}
}
@media (prefers-reduced-motion:reduce){ .ticker .track .dup{display:none} }

/* Sélection groupée */
th.sel,td.sel{width:34px;padding-right:0}
th.sel input,td.sel input{width:17px;height:17px;accent-color:var(--pink);cursor:pointer;vertical-align:middle;margin:0}
tr.picked{background:rgba(255,79,216,.08)}
.bulkbar{position:sticky;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:15;display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:12px;padding:10px 14px;background:var(--panel2);border:1px solid var(--pink);border-radius:var(--radius);box-shadow:0 8px 30px rgba(0,0,0,.45)}
.bulkbar b{color:var(--pink)}
.bulkbar .bulkdel{margin-left:auto}
.bulkbar select{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 10px}

/* Accueil */
.home{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:14px;align-items:start}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
.card h2{font:700 16px/1.2 Orbitron,sans-serif;margin:0 0 10px;display:flex;align-items:center;gap:10px}
.card h2 .n{margin-left:auto;font:700 15px/1 Rajdhani,sans-serif;color:#1a0716;background:var(--pink);border-radius:999px;padding:3px 10px}
.card h2 .n.zero{background:var(--line);color:var(--muted)}
.todo{list-style:none;margin:0;padding:0}
.todo li{display:flex;align-items:center;gap:10px;padding:7px 4px;border-bottom:1px solid var(--line);cursor:pointer;border-radius:6px}
.todo li:hover{background:rgba(255,255,255,.03)}
.todo li:last-child{border-bottom:0}
.todo .login{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.todo .r{margin-left:auto;color:var(--muted);font-size:14px;text-align:right;flex:none;white-space:nowrap}
.todo .r.w{flex:0 1 auto;white-space:normal}
.pill{white-space:nowrap}
.card .more{display:inline-block;margin-top:8px;font-weight:700}
.card .none{color:var(--muted);margin:4px 0}

/* Courbe des follows */
.spark{width:100%;height:auto;display:block;margin-top:6px}
.spark .area{fill:rgba(61,227,255,.12)} .spark .ln{fill:none;stroke:var(--cyan);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
.spark circle{fill:var(--bg);stroke:var(--cyan);stroke-width:2} .spark circle.now{fill:var(--pink);stroke:var(--pink)}
.spark text{fill:var(--muted);font:600 11px Rajdhani,sans-serif}

/* Historique */
.hist{list-style:none;margin:0;padding:0;font-size:14.5px}
.hist li{padding:6px 0;border-bottom:1px solid var(--line)}
.hist li:last-child{border-bottom:0}
.hist .when{color:var(--muted);margin-right:6px}

/* Badges Twitch */
.tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;padding:1px 6px;border-radius:4px;margin-left:6px;vertical-align:middle;line-height:1.35}
.tag.aff{background:rgba(169,112,255,.18);color:#C9A7FF;border:1px solid rgba(169,112,255,.5)}
.tag.par{background:rgba(145,70,255,.9);color:#fff}
.tag.ko{background:rgba(255,92,122,.15);color:var(--ko);border:1px solid rgba(255,92,122,.5)}
/* Votes */
.votes{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 10px}
.vbar{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--line);flex:1 1 140px;min-width:120px}
.vbar i{display:block;height:100%} .vbar .pour{background:var(--ok)} .vbar .contre{background:var(--ko)} .vbar .neutre{background:var(--warn)} .vbar .autre{background:var(--cyan)}
.suggest{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 10px;border:1px dashed var(--cyan);border-radius:8px;margin-bottom:10px;font-weight:600}
.avcount{font-size:13px;color:var(--muted);margin-left:6px}
/* Jauge d'affiliation */
.gauge{display:grid;grid-template-columns:130px 1fr 90px;gap:6px 10px;align-items:center;font-size:14.5px}
.gauge .gbar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.gauge .gbar i{display:block;height:100%;background:var(--cyan)} .gauge .gbar i.ok{background:var(--ok)}
.gauge .v{text-align:right;font-variant-numeric:tabular-nums}
/* Tableau de bord */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px}
.kpi b{display:block;font:800 26px/1.1 Orbitron,sans-serif;margin-top:4px}
.kpi span{color:var(--muted);font-size:14px;font-weight:600}
.kpi small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:14px}
.chart{width:100%;height:auto;display:block}
.chart .ax{stroke:var(--line);stroke-width:1} .chart text{fill:var(--muted);font:600 11px Rajdhani,sans-serif}
.chart .ln{fill:none;stroke:var(--cyan);stroke-width:2.2;stroke-linejoin:round} .chart .ar{fill:rgba(61,227,255,.1)}
.chart .br{fill:var(--pink)}
@media (max-width:700px){ .charts{grid-template-columns:1fr} .gauge{grid-template-columns:110px 1fr 76px} }

.warnbar{background:rgba(255,200,87,.12);border:1px solid var(--warn);color:var(--text);border-radius:var(--radius);padding:10px 14px;margin-bottom:16px;font-weight:600}
.warnbar.ko{background:rgba(255,92,122,.12);border-color:var(--ko)}
.toast button{margin-left:12px;background:none;border:1px solid var(--cyan);color:var(--cyan);border-radius:6px;padding:2px 10px;font-weight:700;cursor:pointer}
.trash{list-style:none;margin:0;padding:0}
.trash li{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.trash li:last-child{border-bottom:0}
.trash .r{margin-left:auto;display:flex;gap:8px}
.recap{display:grid;grid-template-columns:minmax(0,540px) 1fr;gap:16px;align-items:start}
.recap canvas{width:100%;height:auto;border-radius:var(--radius);border:1px solid var(--line);display:block}
@media (max-width:900px){ .recap{grid-template-columns:1fr} }

.spacer{flex:1 1 auto}
.colmenu{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:10px 14px;margin-bottom:12px}
.tg{display:inline-block;font-size:12px;font-weight:700;padding:1px 8px;border-radius:999px;background:rgba(61,227,255,.12);color:var(--cyan);border:1px solid rgba(61,227,255,.35);margin:0 4px 0 0;white-space:nowrap}
.tagedit{display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.tagedit .tg button{background:none;border:0;color:inherit;cursor:pointer;padding:0 0 0 4px;font-weight:700}
.tagedit input{flex:1;min-width:140px;background:none;border:0;padding:4px;color:var(--text)}
.tagedit input:focus{outline:none}
.bulkbar input{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 10px;width:150px}

.msgbox{margin:0 0 16px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel2)}
.msgbox .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.msgbox select{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 10px;flex:1 1 180px}
.msgbox textarea{width:100%;margin-top:8px;min-height:130px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;color:var(--text);font:inherit;resize:vertical}
.tpl{border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px;margin-bottom:10px}
.tpl .row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.tpl .row input{flex:1 1 200px}
.tpl input,.tpl select,.tpl textarea{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 10px;color:var(--text);font:inherit}
.tpl textarea{width:100%;min-height:110px;resize:vertical}
.stag{color:var(--warn);margin-left:6px;font-size:14px}

/* Aide */
.aide{max-width:860px}
.aide nav.som{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 20px}
.aide nav.som a{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 12px;font-weight:600;text-decoration:none}
.aide section{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px 20px;margin-bottom:14px;scroll-margin-top:80px}
.aide h2{font:700 18px/1.2 Orbitron,sans-serif;margin:0 0 10px}
.aide h3{font-size:17px;margin:14px 0 4px;color:var(--cyan)}
.aide p,.aide li{color:#D4CFF5;max-width:75ch}
.aide ol,.aide ul{padding-left:22px;margin:6px 0}
.aide li{margin:4px 0}
.aide code{background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:0 5px;font-size:.92em}
.aide .astuce{border-left:3px solid var(--pink);padding:6px 12px;background:rgba(255,79,216,.07);border-radius:0 8px 8px 0;margin:10px 0}
.refs .row{display:grid;grid-template-columns:minmax(90px,1fr) 2fr auto;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.refs .row:last-child{border-bottom:0}
.refs .bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.refs .bar i{display:block;height:100%;background:var(--cyan)}

/* Rappels */
.rappels{list-style:none;margin:0 0 8px;padding:0}
.rappels li{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:7px 0;border-bottom:1px solid var(--line)}
.rappels li:last-child{border-bottom:0}
.rappels .dt{font-weight:700;min-width:84px}
.rappels .tx{flex:1 1 200px}
.rappels .par{color:var(--muted);font-size:13px}
.rappels li .btn{margin-left:auto}
.rpadd{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.rpadd input{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 10px;color:var(--text);font:inherit}
.rpadd input[type=text]{flex:1 1 200px}
.bell{margin-left:6px;font-size:14px}
.card .seg2{margin-left:auto;display:flex;gap:4px}
.card .seg2 button{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:1px 8px;cursor:pointer;font:600 13px Rajdhani,sans-serif;color:var(--muted)}
.card .seg2 button[aria-pressed="true"]{border-color:var(--cyan);color:var(--cyan)}

/* Événements */
.evs{display:grid;gap:12px}
.navn{display:inline-block;min-width:18px;margin-left:6px;padding:0 5px;border-radius:9px;background:var(--warn,#ffb020);color:#1a0716;font-size:12px;line-height:18px;text-align:center;vertical-align:1px}
.navn:empty{display:none}
select{background-color:var(--panel2);color:var(--text)}
.meta a,.muted a,p a{text-decoration:underline;text-underline-offset:2px}
.ev.passe .quand small{color:var(--text)}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
table.tbl{border-collapse:collapse;font-size:15px}
table.tbl th{text-align:left;font-weight:700;color:var(--muted);padding:6px 8px;border-bottom:1px solid var(--line)}
table.tbl td{padding:6px 8px;border-bottom:1px solid var(--line)}
#undoRoot .undo{position:fixed;left:calc(16px + env(safe-area-inset-left,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:61;display:flex;gap:10px;align-items:center;max-width:min(460px,calc(100vw - 32px));background:var(--panel2);border:1px solid var(--pink);border-radius:10px;padding:8px 10px 8px 14px;box-shadow:0 8px 24px rgba(0,0,0,.45)}
#undoRoot .undo span{font-size:14px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
#undoRoot .undo button{flex:none}
.rech{position:fixed;inset:0;z-index:70;background:rgba(8,5,20,.72);display:flex;align-items:flex-start;justify-content:center;padding:10vh 16px 16px}
.rech .box{width:min(640px,100%);background:var(--panel);border:1px solid var(--cyan);border-radius:14px;box-shadow:0 20px 50px rgba(0,0,0,.5);overflow:hidden}
.rech input{width:100%;box-sizing:border-box;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--text);font:600 19px Rajdhani,system-ui,sans-serif;padding:14px 16px;outline:none}
.rech ul{list-style:none;margin:0;padding:6px;max-height:60vh;overflow:auto}
.rech li{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:8px;cursor:pointer}
.rech li[aria-selected="true"],.rech li:hover{background:var(--panel2)}
.rech li .k{font-size:12px;font-weight:700;text-transform:uppercase;color:var(--cyan);min-width:88px}
.rech li .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rech li .m{font-size:13px;color:var(--muted)}
.rech .vide{padding:14px 16px;color:var(--muted)}
#rechBtn{background:none;border:1px solid var(--line);color:var(--text);border-radius:8px;padding:4px 10px;cursor:pointer;font:inherit}
#rechBtn:hover{border-color:var(--cyan)}
button[disabled].adminonly{opacity:.45;cursor:not-allowed}
.integ label{display:flex;gap:8px;align-items:center;padding:3px 0}
.netp{max-width:none}
.netl{display:grid;grid-template-columns:minmax(170px,240px) 1fr auto;gap:10px;align-items:center;padding:7px 0;border-top:1px solid var(--line)}
.netl .login{display:flex;align-items:center;gap:6px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.netl .netb{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.netl .netb .btn{padding:3px 10px}
.netl .meta{margin:0}
@media (max-width:700px){ .netl{grid-template-columns:1fr} .netl .netb{justify-content:flex-start} }
.ev{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;display:grid;grid-template-columns:86px 1fr auto;gap:14px;align-items:start}
.ev.passe{border-style:dashed;background:transparent}
.ev.passe h3{color:var(--muted)}
.ev .quand{text-align:center;border-right:1px solid var(--line);padding-right:12px}
.ev .quand b{display:block;font:800 26px/1 Orbitron,sans-serif}
.ev .quand small{display:block;color:var(--muted)}
.ev h3{margin:0 0 4px;font-size:19px}
.ev .desc{color:#D4CFF5;margin:4px 0 6px;white-space:pre-line}
.ev .ppl{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.evform{background:var(--panel);border:1px solid var(--pink);border-radius:var(--radius);padding:16px 18px;margin-bottom:16px}
.evform .ppl{margin-top:6px}
@media (max-width:700px){ .ev{grid-template-columns:70px 1fr} .ev .acts{grid-column:1/-1} }

nav a.navlink{padding:8px 14px;border-radius:8px;color:var(--muted);font-weight:700;font-size:17px;text-decoration:none;white-space:nowrap;flex:none}
nav a.navlink:hover{color:var(--cyan);text-decoration:none}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--panel2);border:1px solid var(--cyan);padding:10px 18px;border-radius:8px;z-index:60;font-weight:600;max-width:90vw}
.toast.err{border-color:var(--ko)}

@media (max-width:700px){
  main{padding:14px}
  .bar{padding:10px 14px;gap:10px}
  .grid{grid-template-columns:1fr}
  .journal li{grid-template-columns:1fr;gap:0}
  .ticker{order:5;flex:1 1 100%}
  header{position:static}
  .brand{font-size:18px}
  nav{order:4;width:100%;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -4px}
  nav::-webkit-scrollbar{display:none}
  nav button{padding:6px 11px;font-size:16px;white-space:nowrap;flex:none}
  nav a.navlink{padding:6px 11px;font-size:16px}
  .sync{order:2;width:auto;margin-left:auto}
  /* Tableaux en cartes sur téléphone */
  .tablewrap{border:0;background:none;overflow:visible}
  .tablewrap table,.tablewrap tbody,.tablewrap tr,.tablewrap td{display:block;width:100%}
  .tablewrap thead{display:none}
  .tablewrap tr{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:10px;padding:10px 14px;position:relative}
  .tablewrap tr.picked{border-color:var(--pink)}
  .tablewrap td{border:0;padding:3px 0;white-space:normal;display:flex;justify-content:space-between;align-items:center;gap:12px;text-align:right}
  .tablewrap td::before{content:attr(data-l);color:var(--muted);font-size:13.5px;font-weight:600;text-align:left}
  .tablewrap td.first{font-size:17px;padding:0 34px 6px 0;justify-content:flex-start;text-align:left}
  .tablewrap td.first::before,.tablewrap td.sel::before{content:none}
  .tablewrap td.sel{position:absolute;top:12px;right:14px;width:auto;padding:0}
  .tablewrap td.e{display:none}
  .tablewrap td.empty{display:block;text-align:center}
  .tablewrap td.empty::before{content:none}
  .bulkbar{bottom:calc(8px + env(safe-area-inset-bottom,0px))}
  .spacer{display:none}
}
@media (prefers-reduced-motion:no-preference){
  .drawer{animation:slide .18s ease-out}
  @keyframes slide{from{transform:translateX(30px);opacity:.4}}
}

<body>
<header>
  <div class="bar">
    <div class="brand" id="brand">La Cabane</div>
    <nav id="nav" aria-label="Sections">
      <button data-view="accueil">Accueil</button>
      <button data-view="propositions">Propositions</button>
      <button data-view="membres">Streamers</button>
      <button data-view="anniv">Anniversaires</button>
      <button data-view="stats">Tableau de bord</button>
      <button data-view="agenda">Événements</button>
      <button data-view="nettoyage">Nettoyage<span class="navn" id="navNet"></span></button>
      <button data-view="reglages">Réglages</button>
      <button data-view="aide">Aide</button>
      <a class="navlink" id="navVitrine" href="vitrine/" target="_blank" rel="noopener" title="Ouvrir la vitrine publique dans un nouvel onglet">Vitrine ↗</a>
      <a class="navlink hidden" id="navBot" href="#" target="_blank" rel="noopener" title="Ouvrir le site de gestion du bot Discord dans un nouvel onglet">Bot ↗</a>
      <button id="rechBtn" type="button" title="Rechercher partout (Ctrl+K)" aria-label="Rechercher partout">🔍</button>
    </nav>
    <div class="ticker hidden" id="ticker" aria-label="Anniversaires de stream"></div>
    <div class="sync"><span class="dot" id="syncDot"></span><span id="syncTxt">Non connecté</span></div>
  </div>
</header>
<main id="main"></main>
<div id="drawerRoot"></div>
<div id="toastRoot"></div>
<div id="undoRoot"></div>
<div id="rechRoot"></div>

<script>
"use strict";
/* ============ Utilitaires ============ */
const $ = s => document.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = p => p + Math.random().toString(16).slice(2, 10);
const jourLocal = iso => { const d = iso ? new Date(iso) : new Date(); return isNaN(d) ? String(iso || "").slice(0, 10) : `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; };
const todayISO = () => { const d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset()*60000).toISOString().slice(0,10); };
const fmtDate = iso => { if(!iso) return ""; const [y,m,d] = iso.split("-"); return `${d}/${m}/${y}`; };
const fmtStamp = iso => { if(!iso) return ""; const d = new Date(iso); return d.toLocaleDateString("fr-FR") + " " + d.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"}); };
const normLogin = v => String(v||"").trim().replace(/^@/,"").replace(/^https?:\/\/(www\.)?twitch\.tv\//i,"").replace(/[/?#].*$/,"").toLowerCase();
const safeUrl = u => /^https?:\/\//i.test(u) ? u : null;
// Site de gestion du bot Discord : adresse modifiable dans Réglages (elle change à chaque redémarrage du tunnel)
const LIEN_BOT_DEFAUT = "https://growth-compile-planes-velocity.trycloudflare.com/";
const lienBot = () => { const u = S.data?.settings?.lienBot; return u === undefined || u === null ? (S.data ? LIEN_BOT_DEFAUT : "") : u; };
function majLienBot(){ const a = document.getElementById("navBot"); if(!a) return; const u = lienBot(), ok = /^https:\/\/[^\s"'<>]+$/.test(u || "");
  a.classList.toggle("hidden", !ok); if(ok) a.href = u; else a.removeAttribute("href"); }
const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  del(k){ try { localStorage.removeItem(k); } catch {} }
};
function toast(msg, err, action){
  const el = document.createElement("div"); el.className = "toast" + (err ? " err" : ""); el.textContent = msg;
  if(action){ const b = document.createElement("button"); b.textContent = action.label; b.onclick = () => { el.remove(); action.fn(); }; el.appendChild(b); }
  $("#toastRoot").replaceChildren(el); setTimeout(() => el.remove(), action ? 9000 : err ? 6000 : 2600);
}
function b64decodeUtf8(b64){ const bin = atob(b64.replace(/\s/g,"")); return new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0))); }
function b64encodeUtf8(str){ const bytes = new TextEncoder().encode(str); let bin = ""; for(let i=0;i<bytes.length;i+=0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i,i+0x8000)); return btoa(bin); }

/* ============ État ============ */
const CFG_KEY = "cabane.cfg", LOCAL_KEY = "cabane.localdata";
let cfg = store.get(CFG_KEY, {owner:"Lacabanestreamers", repo:"cabane", branch:"main", path:"cabane-data.json", token:"", me:"", remember:true});
if(!cfg.token){ try { cfg.token = sessionStorage.getItem("cabane.token") || ""; } catch {} }
const S = {
  data:null, sha:null, mode:"none",          // none | github | local
  pending:[], saving:false, dirtyLocal:false,
  live:{}, liveLoading:false, avatars:{},
  view:"accueil", drawer:null, sel:new Set(), selView:"", visible:[], tickerKey:"",
  f:{ ptag:"", mtag:"", pq:"", pst:"__all", msort:["login",1], psort:["login",1], mq:"", mst:"__actifs", mrole:"__all", ref:"" }
};

/* ============ Modèle : opérations ============ */
function setPath(obj, path, val){
  const ks = path.split("."); let o = obj;
  for(let i=0;i<ks.length-1;i++){ if(typeof o[ks[i]] !== "object" || o[ks[i]] === null) o[ks[i]] = {}; o = o[ks[i]]; }
  const last = ks[ks.length-1];
  if(val === undefined || val === "") { if(ks.length > 1) delete o[last]; else o[last] = val === undefined ? null : ""; }
  else o[last] = val;
}
function getPath(obj, path){ let o = obj; for(const k of path.split(".")){ if(o == null) return undefined; o = o[k]; } return o; }
const memeValeur = (a, b) => JSON.stringify(a ?? null) === JSON.stringify(b ?? null);
function applyOp(d, op){
  d.journal = d.journal || []; d.snapshots = d.snapshots || [];
  switch(op.t){
    case "patch": { const r = (d[op.c]||[]).find(x => x.id === op.id); if(!r) return;
      let p = op.p;
      // À l'enregistrement : si quelqu'un d'autre a changé ce champ entre-temps, on ne l'écrase pas sans demander
      if(op.verif && op.base){ p = {};
        for(const [k, v] of Object.entries(op.p)){ const cur = getPath(r, k);
          if(k in op.base && !memeValeur(cur, op.base[k]) && !memeValeur(cur, v)){ (S.conflits = S.conflits || []).push({c:op.c, id:op.id, k, mien:v, sien:cur ?? null, par:r.maj?.par || "quelqu'un", login:r.login, notify:op.notify}); }
          else p[k] = v; }
        if(!Object.keys(p).length) return; }
      if("statut" in p && (p.statut || "") !== (r.statut || "")) r.statutDepuis = jourLocal(op.le);
      for(const [k,v] of Object.entries(p)) setPath(r, k, v); if(!op.auto) r.maj = {par:op.par, le:op.le}; break; }
    case "add": if(!d[op.c].some(x => x.id === op.r.id)){ const r = JSON.parse(JSON.stringify(op.r)); if(!r.statutDepuis) r.statutDepuis = jourLocal(op.le); d[op.c].push(r); } break;
    case "del": { const i = d[op.c].findIndex(x => x.id === op.id); if(i < 0) break;
      const [r] = d[op.c].splice(i, 1);
      if(!op.noTrash){ d.corbeille = d.corbeille || []; d.corbeille.push({c:op.c, r, le:op.le, par:op.par}); }
      break; }
    case "restore": { d.corbeille = d.corbeille || []; const i = d.corbeille.findIndex(x => x.r.id === op.id); if(i < 0) break;
      const [e] = d.corbeille.splice(i, 1); if(!d[e.c].some(x => x.id === e.r.id)) d[e.c].push(e.r); break; }
    case "purge": d.corbeille = (d.corbeille || []).filter(x => x.r.id !== op.id); break;
    case "rappelAdd": { const r = (d[op.c]||[]).find(x => x.id === op.id); if(!r) break; r.rappels = r.rappels || [];
      if(!r.rappels.some(x => x.id === op.rp.id)) r.rappels.push({...op.rp, par:op.par, cree:op.le}); break; }
    case "agendaSet": { d.agenda = d.agenda || []; const i = d.agenda.findIndex(x => x.id === op.ev.id);
      if(op.rinclure && op.ev.serie){ const se = (d.series || []).find(x => x.id === op.ev.serie); if(se?.exclus) se.exclus = se.exclus.filter(x => x !== op.ev.date); }
      if(op.remplace){ if(i < 0) d.agenda.push(JSON.parse(JSON.stringify(op.ev))); else d.agenda[i] = JSON.parse(JSON.stringify(op.ev)); break; }
      if(i < 0){ if(op.edition) break; d.agenda.push(op.ev); break; }          // modifié ici mais supprimé entre-temps par quelqu'un d'autre : on ne le recrée pas
      const cur = d.agenda[i], ev = {...op.ev};
      // participants : on n'applique que ce que la personne a changé dans le formulaire,
      // pour ne pas effacer les inscriptions arrivées (Discord, vitrine) pendant qu'elle le remplissait
      if(op.pplAvant){ const av = op.pplAvant, nv = ev.participants || [];
        ev.participants = [...(cur.participants || []).filter(l => !(av.includes(l) && !nv.includes(l))), ...nv.filter(l => !av.includes(l) && !(cur.participants || []).includes(l))]; }
      d.agenda[i] = {...cur, ...ev}; break; }
    case "agendaPpl": { const e = (d.agenda || []).find(x => x.id === op.id); if(!e) break; e.participants = e.participants || [];
      if(op.add && !e.participants.includes(op.add)) e.participants.push(op.add);
      if(op.inconnu && e.discordInconnus) e.discordInconnus = e.discordInconnus.filter(x => x.id !== op.inconnu); break; }
    case "reussiteMasque": { const l = op.kind === "palier" ? (d.paliers || []).filter(x => x.login === op.login && x.palier === op.palier) : (d.evenements || []).filter(x => x.login === op.login && x.type === op.type && x.date === op.date);
      for(const x of l){ if(op.masque) x.masque = true; else delete x.masque; } break; }
    case "agendaDel": { const e = (d.agenda || []).find(x => x.id === op.id);
      // une occurrence de série supprimée est écartée : le robot ne la recréera pas
      if(e?.serie && !op.sansExclure){ const se = (d.series || []).find(x => x.id === e.serie); if(se && !(se.exclus || []).includes(e.date)) se.exclus = [...(se.exclus || []), e.date]; }
      d.agenda = (d.agenda || []).filter(x => x.id !== op.id); break; }
    case "serieSet": { d.series = d.series || []; const i = d.series.findIndex(x => x.id === op.serie.id);
      if(i < 0 && !op.serie.debut) break;           // pause / reprise d'une série supprimée entre-temps
      const se = i < 0 ? op.serie : {...d.series[i], ...op.serie}; if(i < 0) d.series.push(se); else d.series[i] = se;
      synchroSerie(d, se, todayISO()); break; }
    case "serieDel": { const t = todayISO();
      d.series = (d.series || []).filter(x => x.id !== op.id);
      d.agenda = (d.agenda || []).filter(e => !(e.serie === op.id && e.date >= t)); break; }
    case "rappelDel": { const r = (d[op.c]||[]).find(x => x.id === op.id); if(r?.rappels) r.rappels = r.rappels.filter(x => x.id !== op.rid); break; }
    case "snapshot": d.snapshots = d.snapshots.filter(s => s.date !== op.s.date); d.snapshots.push(op.s);
      d.snapshots.sort((a,b) => a.date.localeCompare(b.date)); if(d.snapshots.length > 400) d.snapshots = d.snapshots.slice(-400); break;   // même plafond que le robot
    case "settings": for(const [k, v] of Object.entries(op.p)){ const ks = k.split("."); let o = d.settings;
        for(const x of ks.slice(0, -1)){ if(typeof o[x] !== "object" || o[x] === null) o[x] = {}; o = o[x]; } o[ks[ks.length - 1]] = v; } break;   // « vitrine.titre » : seul ce champ change (pas d'écrasement des réglages voisins)
    case "note": break;
  }
  if(d.corbeille?.length){ const lim = new Date(Date.now() - 30*864e5).toISOString(); d.corbeille = d.corbeille.filter(x => (x.le || "") >= lim); }
  if(op.txt){ d.journal.unshift({le:op.le, par:op.par, txt:op.txt}); if(d.journal.length > 400) d.journal.length = 400; }
}
function dispatch(op){
  if(!S.data) return;
  op.le = new Date().toISOString(); op.par = cfg.me || "?";
  // valeurs avant modification : servent à détecter une modification simultanée et à « Annuler »
  if(op.t === "patch" && !op.auto && !op.force){ const r = (S.data[op.c] || []).find(x => x.id === op.id); if(r) op.base = Object.fromEntries(Object.keys(op.p).map(k => [k, getPath(r, k) ?? null])); }
  if(!op.auto && !op.noUndo) noterAnnulation(op);
  applyOp(S.data, op);
  if(S.mode === "github"){ S.pending.push(op); scheduleSave(); }
  else { S.dirtyLocal = true; store.set(LOCAL_KEY, S.data); }
  if(S.lot) return;                       // plusieurs opérations d'un coup : un seul affichage à la fin
  updateSync(); render();
}
const patch = (c, id, p, txt) => dispatch({t:"patch", c, id, p, txt});

// Chaque champ d'une fiche retient la fiche sur laquelle on a commencé à le modifier
document.addEventListener("focusin", e => { const t = e.target; if(t.dataset?.k && t.closest?.("#drawerRoot") && S.drawer) t.dataset.fiche = S.drawer.c + S.drawer.id; });

/* ============ Annuler (15 s après chaque action) ============ */
const clone = x => x === undefined ? undefined : JSON.parse(JSON.stringify(x));
function inverseDe(op){
  const d = S.data;
  switch(op.t){
    case "patch": { const r = (d[op.c] || []).find(x => x.id === op.id); if(!r) return null;
      const p = Object.fromEntries(Object.keys(op.p).map(k => [k, clone(getPath(r, k)) ?? null])); if("statut" in op.p) p.statutDepuis = r.statutDepuis ?? null;
      return [{t:"patch", c:op.c, id:op.id, p}]; }
    case "add": return [{t:"del", c:op.c, id:op.r.id, noTrash:true}];
    case "del": { const r = (d[op.c] || []).find(x => x.id === op.id); if(!r) return null; return [op.noTrash ? {t:"add", c:op.c, r:clone(r)} : {t:"restore", id:op.id}]; }
    case "restore": { const e = (d.corbeille || []).find(x => x.r.id === op.id); return e ? [{t:"del", c:e.c, id:op.id}] : null; }
    case "agendaSet": { const prev = (d.agenda || []).find(x => x.id === op.ev.id); return [prev ? {t:"agendaSet", ev:clone(prev), remplace:true} : {t:"agendaDel", id:op.ev.id, sansExclure:true}]; }
    case "agendaDel": { const prev = (d.agenda || []).find(x => x.id === op.id); return prev ? [{t:"agendaSet", ev:clone(prev), remplace:true, rinclure:true}] : null; }
    case "agendaPpl": { const prev = (d.agenda || []).find(x => x.id === op.id); return prev ? [{t:"agendaSet", ev:clone(prev), remplace:true}] : null; }
    case "settings": return [{t:"settings", p:Object.fromEntries(Object.keys(op.p).map(k => [k, clone(getPath(d.settings, k)) ?? null]))}];
    case "rappelAdd": return [{t:"rappelDel", c:op.c, id:op.id, rid:op.rp.id}];
    case "rappelDel": { const r = (d[op.c] || []).find(x => x.id === op.id), rp = r?.rappels?.find(x => x.id === op.rid); return rp ? [{t:"rappelAdd", c:op.c, id:op.id, rp:clone(rp)}] : null; }
    case "note": return [];
    case "reussiteMasque": return [{...op, masque:!op.masque, txt:undefined}];
    default: return null;          // séries, sauvegardes… : pas d'annulation rapide (historique et corbeille restent là)
  }
}
const UNDO = {groupe:null, timer:null};
function noterAnnulation(op){
  if(!UNDO.groupe){ UNDO.groupe = {ops:[], ok:true, txt:""}; setTimeout(fermerAnnulation, 0); }
  const inv = inverseDe(op);
  if(!inv) UNDO.groupe.ok = false; else UNDO.groupe.ops.unshift(...inv.map(x => ({...x, notify:op.notify})));
  if(op.txt && !UNDO.groupe.txt) UNDO.groupe.txt = op.txt;
}
function fermerAnnulation(){
  const g = UNDO.groupe; UNDO.groupe = null; if(!g || !g.ok || !g.ops.length) return;
  const root = $("#undoRoot"); clearTimeout(UNDO.timer);
  root.innerHTML = `<div class="undo" role="status"><span>${esc(g.txt || "Modification enregistrée")}</span><button class="btn" type="button" id="undoBtn">↶ Annuler</button></div>`;
  $("#undoBtn").onclick = () => { root.innerHTML = ""; clearTimeout(UNDO.timer);
    g.ops.forEach((o, i) => dispatch({...o, noUndo:true, ...(i === 0 ? {txt:`Annulé : ${g.txt || "dernière action"}`} : {})}));
    renderDrawer(); toast("Action annulée"); };
  UNDO.timer = setTimeout(() => { root.innerHTML = ""; }, 15000);
}

const notifsOn = () => store.get(NOTIF_KEY, false) && "Notification" in window && Notification.permission === "granted";
function notifier(titre, corps, tag, ouvrir){
  if(!notifsOn()) return;
  try { const n = new Notification(titre, {body:corps, tag, icon:"icon-192.png"}); n.onclick = () => { window.focus(); ouvrir?.(); n.close(); }; } catch {}

// Compare les données avant / après une synchro : nouvelles propositions, et rappels du jour (une fois chacun)
function verifierNotifs(avant, apres){
  if(!notifsOn() || !apres) return;
  if(avant){ const ids = new Set(avant.propositions.map(p => p.id));
    for(const p of apres.propositions) if(!ids.has(p.id)) notifier(`📝 Nouvelle proposition : ${p.login}`, p.proposePar ? `Proposée par ${p.proposePar}` : "À trier", "prop-" + p.id, () => { S.drawer = {c:"propositions", id:p.id}; renderDrawer(); }); }
  const vus = new Set(store.get(NOTIF_VU, [])), t = todayISO(), me = cfg.me;
  for(const c of ["membres", "propositions"]) for(const r of apres[c]) for(const rp of r.rappels || []){
    const k = `${rp.id}|${t}`; if(rp.date > t || vus.has(k) || (me && rp.par && rp.par !== me)) continue;
    vus.add(k); notifier(`🔔 Rappel : ${r.login}`, rp.texte, "rp-" + rp.id, () => { S.drawer = {c, id:r.id}; renderDrawer(); }); }
  store.set(NOTIF_VU, [...vus].filter(k => k.endsWith("|" + t)));
}
async function activerNotifs(on){
  if(!on){ store.set(NOTIF_KEY, false); render(); toast("Notifications désactivées sur cet appareil"); return; }
  if(!("Notification" in window)){ toast("Ce navigateur ne gère pas les notifications.", true); return; }
  const p = Notification.permission === "granted" ? "granted" : await Notification.requestPermission();
  if(p !== "granted"){ toast("Notifications refusées par le navigateur (réglages du site pour les autoriser).", true); return; }
  store.set(NOTIF_KEY, true); render(); notifier("La Cabane", "Les notifications sont activées sur cet appareil.", "test"); verifierNotifs(null, S.data);
}
function notifsPanel(){

    <p>Quand la page est ouverte (même dans un onglet en arrière-plan), une notification apparaît pour chaque <b>nouvelle proposition</b> et pour <b>tes rappels du jour</b>. Rien n'arrive si la page est fermée : il n'y a pas de serveur pour les envoyer. Réglage propre à ce navigateur.</p>

/* ============ Réveil du robot groupé ============ */
// Plusieurs enregistrements à la suite = un seul passage du robot (chaque passage coûte au moins 1 minute de quota GitHub)
let reveilT = null;
function planifierReveil(){ if(reveilT) return; reveilT = setTimeout(() => { reveilT = null; notifyRobot(); }, 60000); }
window.addEventListener("pagehide", () => { if(reveilT){ clearTimeout(reveilT); reveilT = null; notifyRobot(true); } });

/* ============ GitHub ============ */
const ghUrl = () => `https://api.github.com/repos/${encodeURIComponent(cfg.owner)}/${encodeURIComponent(cfg.repo)}/contents/${cfg.path.split("/").map(encodeURIComponent).join("/")}`;
const ghHeaders = () => ({Authorization:`Bearer ${cfg.token}`, Accept:"application/vnd.github+json", "X-GitHub-Api-Version":"2022-11-28"});
// siChange : synchro périodique légère. GitHub répond 304 (sans rien renvoyer) si le fichier n'a pas bougé,
// ce qui évite de retélécharger tout le fichier toutes les 90 s quand La Cabane grandit.
async function ghGet(siChange){
  const h = ghHeaders(); if(siChange && S.etag) h["If-None-Match"] = S.etag;
  const r = await fetch(`${ghUrl()}?ref=${encodeURIComponent(cfg.branch)}`, {headers:h, cache:"no-store"});
  if(siChange && r.status === 304) return null;
  if(r.status === 401) throw new Error("Jeton refusé par GitHub : il a expiré ou a été révoqué. Colle un nouveau jeton dans Réglages.");
  if(r.status === 404) throw new Error("Fichier introuvable : vérifie le dépôt, la branche, le chemin et que le jeton a accès à ce dépôt.");
  if(!r.ok) throw new Error(`GitHub a répondu ${r.status}.`);
  const j = await r.json();
  const etag = r.headers.get("ETag") || null;
  let text;
  if(j.content) text = b64decodeUtf8(j.content);
  else { // fichier > 1 Mo
    const raw = await fetch(`${ghUrl()}?ref=${encodeURIComponent(cfg.branch)}`, {headers:{...ghHeaders(), Accept:"application/vnd.github.raw+json"}, cache:"no-store"});
    text = await raw.text();
  }
  return {sha:j.sha, data:JSON.parse(text), etag};
}
async function ghPut(data, sha, message){
  const r = await fetch(ghUrl(), {method:"PUT", headers:{...ghHeaders(), "Content-Type":"application/json"},
    body:JSON.stringify({message, content:b64encodeUtf8(JSON.stringify(data, null, 1)), sha, branch:cfg.branch})});
  if(r.status === 409 || r.status === 422) return null; // conflit : quelqu'un a enregistré entre-temps
  if(r.status === 401 || r.status === 403) throw new Error("Le jeton n'a pas le droit d'écrire (permission Contents : Read and write).");
  if(!r.ok) throw new Error(`Enregistrement refusé (${r.status}).`);
  return (await r.json()).content.sha;
}
// Réveille le robot (GitHub Actions) pour qu'il poste tout de suite sur Discord. En cas d'échec, son passage horaire rattrape.
async function notifyRobot(garder){
  try {
    const r = await fetch(`https://api.github.com/repos/${encodeURIComponent(cfg.owner)}/${encodeURIComponent(cfg.repo)}/dispatches`,
      {method:"POST", headers:{...ghHeaders(), "Content-Type":"application/json"}, body:JSON.stringify({event_type:"cabane-notif"}), keepalive:!!garder});
    if(!r.ok) console.warn("Robot non déclenché (" + r.status + "), il passera à l'heure suivante.");
  } catch(e){ console.warn("Robot non déclenché", e); }
}
let saveTimer = null;
function scheduleSave(){ clearTimeout(saveTimer); saveTimer = setTimeout(save, 1200); }
async function save(){
  if(S.saving || !S.pending.length) return;
  S.saving = true; updateSync();
  const ops = S.pending.splice(0);
  try {
    let done = false;
    for(let attempt=0; attempt<4 && !done; attempt++){
      const fresh = await ghGet();
      S.conflits = [];
      for(const op of ops) applyOp(fresh.data, {...JSON.parse(JSON.stringify(op)), verif:true});
      const who = cfg.me || "staff";
      const msg = ops.length === 1 && ops[0].txt ? `${who} : ${ops[0].txt}` : `${who} : ${ops.length} modifications`;
      const sha = await ghPut(fresh.data, fresh.sha, msg.slice(0,200));
      if(sha && ops.some(o => o.notify)) planifierReveil();
      if(sha){
        const avantNotif = S.data; S.sha = sha; S.etag = null; S.data = fresh.data; ensureShape(); verifierNotifs(avantNotif, S.data);
        for(const op of S.pending) applyOp(S.data, JSON.parse(JSON.stringify(op))); // modifs faites pendant l'envoi
        done = true;
      }
    }
    if(!done) throw new Error("Trop de conflits d'enregistrement, réessaie dans un instant.");
    S.lastError = null;
  } catch(e){
    S.conflits = [];            // l'enregistrement a échoué : les opérations repartiront, les conflits seront recalculés
    S.pending.unshift(...ops); S.lastError = e.message; toast(e.message, true);
  } finally {
    S.saving = false; updateSync(); render();
    if(S.pending.length && !S.lastError) scheduleSave();
    else if(S.pending.length && S.mode === "github"){ clearTimeout(saveTimer); saveTimer = setTimeout(save, 45000); }   // échec (réseau…) : nouvel essai dans 45 s
    const cf = S.conflits || []; S.conflits = [];
    if(cf.length) setTimeout(() => resoudreConflits(cf), 50);
  }
}
// Modification simultanée : on montre les deux versions, la personne choisit
function resoudreConflits(liste){
  const court = v => v == null || v === "" ? "(vide)" : typeof v === "object" ? JSON.stringify(v).slice(0, 80) : String(v).slice(0, 120);
  for(const x of liste){
    const champ = x.k.startsWith("avis.") ? `avis de ${x.k.slice(5)}` : x.k;
    if(confirm(`⚠ ${x.par} a modifié « ${champ} » de ${x.login} pendant que tu l'éditais.

Sa version : ${court(x.sien)}
Ta version : ${court(x.mien)}

OK = garder TA version · Annuler = garder la sienne`))
      dispatch({t:"patch", c:x.c, id:x.id, p:{[x.k]:x.mien}, force:true, notify:x.notify, txt:`${x.login} · ${champ} : ${court(x.mien)} (gardé malgré la modification de ${x.par})`});
  }
  renderDrawer();
}
let pullN = 0;
async function pull(silent){
  if(S.mode !== "github" || S.saving || S.pending.length) return;
  const n = ++pullN, shaAvant = S.sha;
  try {
    const fresh = await ghGet(true);
    // réponse arrivée trop tard (une modification ou un enregistrement a eu lieu entre-temps) : on l'ignore
    if(n !== pullN || S.saving || S.pending.length || S.sha !== shaAvant){ updateSync(); return; }
    if(fresh) S.etag = fresh.etag;          // l'empreinte n'est retenue que pour des données réellement utilisées
    if(fresh && fresh.sha !== S.sha){ const avant = S.data; S.data = fresh.data; S.sha = fresh.sha; ensureShape(); render(); verifierNotifs(avant, S.data); if(!silent) toast("Données mises à jour"); }
    else if(!silent) toast("Déjà à jour");
    relancerRobotSiBesoin();
    S.lastError = null;
  } catch(e){ S.lastError = e.message; if(!silent) toast(e.message, true); }
  updateSync();
}
setInterval(() => { if(document.visibilityState === "visible" || notifsOn()) pull(true); }, 90000);   // en arrière-plan seulement si les notifications sont activées
setInterval(() => { if(S.data) verifierNotifs(null, S.data); }, 10 * 60000);                             // rappels qui tombent dans la journée
// Statut live relu toutes les 3 min (et au retour sur l'onglet)
const liveStale = () => S.data && !S.liveLoading && (!S.liveAt || Date.now() - S.liveAt > 180000);
setInterval(() => { if(document.visibilityState === "visible" && liveStale()) loadLive(); }, 30000);
document.addEventListener("visibilitychange", () => { if(document.visibilityState === "visible" && liveStale()) loadLive(); });
window.addEventListener("beforeunload", e => { if(S.pending.length || S.saving){ e.preventDefault(); e.returnValue = ""; } });

// Filet de sécurité : GitHub saute parfois des passages programmés du robot.
// Si le robot n'est pas passé depuis plus de 2 h, la page le relance (au plus une fois par heure et par navigateur).
function relancerRobotSiBesoin(){
  if(S.mode !== "github" || !S.data) return;
  const dernier = S.data.robot?.passage || S.data.robot?.derniereExecution;
  if(dernier && Date.now() - new Date(dernier) < 2 * 3600e3) return;
  const k = "cabane.relanceRobot", avant = Number(store.get(k, 0));
  if(Date.now() - avant < 3600e3) return;
  store.set(k, Date.now());
  notifyRobot();
  console.info("Robot relancé : dernier passage", dernier || "inconnu");
}
async function connectGithub(){
  if(!cfg.owner || !cfg.repo || !cfg.token){ S.mode = "none"; render(); return; }
  S.mode = "github"; updateSync("Connexion…", "busy");
  try { const r = await ghGet(); S.data = r.data; S.sha = r.sha; S.etag = r.etag; S.lastError = null; ensureShape(); render(); loadLive(); relancerRobotSiBesoin(); }
  catch(e){ S.mode = "none"; S.lastError = e.message; toast(e.message, true); render(); }
  updateSync();
}
const STAG_STATUTS = ["Proposition à faire","Proposition en cours","Attente staff"];
const stagJours = () => Number(S.data?.settings.stagnationJours) || 14;
function depuisStatut(p){
  const d = p.statutDepuis || p.dateRevue || p.dateProposition || p.maj?.le?.slice(0,10);
  return d ? joursAvant(d) * -1 : null;
}
function stagnantes(){
  return S.data.propositions.filter(p => STAG_STATUTS.includes(p.statut)).map(p => ({p, j:depuisStatut(p)}))
    .filter(x => x.j != null && x.j >= stagJours()).sort((a,b) => b.j - a.j);
}
// Rappels : échus (date du jour ou passée) sur toutes les fiches (sauf corbeille)
function rappelsEchus(){
  const t = todayISO(), out = [];
  for(const c of ["membres", "propositions"]) for(const r of S.data[c]) for(const rp of r.rappels || []) if(rp.date <= t) out.push({c, r, rp});
  return out.sort((a, b) => a.rp.date.localeCompare(b.rp.date));
}
const aRappelEchu = r => (r.rappels || []).some(x => x.date <= todayISO());
const RAISONS_DEPART = ["Inactif / ne streame plus","A arrêté Twitch","Pause / manque de temps","A rejoint une autre communauté","Désaccord / conflit","Exclu par le staff","Autre"];
function ensureShape(){
  const d = S.data; d.settings = d.settings || {}; d.propositions = d.propositions || []; d.membres = d.membres || [];
  d.snapshots = d.snapshots || []; d.journal = d.journal || [];
  d.settings.staff = d.settings.staff || []; d.settings.statutsProposition = d.settings.statutsProposition || [];
  d.settings.roles = d.settings.roles || ["Admin","Modo","Streamer"]; d.settings.liens = d.settings.liens || [];
  if(d.settings.nom) $("#brand").textContent = d.settings.nom;
}
function updateSync(txt, cls){
  const dot = $("#syncDot"), t = $("#syncTxt");
  if(txt){ dot.className = "dot " + (cls||""); t.textContent = txt; return; }
  if(S.mode === "github"){
    if(S.lastError){ dot.className = "dot err"; t.textContent = "Erreur de synchro"; }
    else if(S.saving || S.pending.length){ dot.className = "dot busy"; t.textContent = "Enregistrement…"; }
    else { dot.className = "dot ok"; t.textContent = `Synchronisé${cfg.me ? " · " + cfg.me : ""}`; }
  } else if(S.mode === "local"){ dot.className = "dot busy"; t.textContent = S.dirtyLocal ? "Mode fichier local · non exporté" : "Mode fichier local"; }
  else { dot.className = "dot"; t.textContent = "Non connecté"; }
}

/* ============ Données Twitch en direct ============ */
// Deux sources : l'API Twitch (si un membre du staff a connecté son compte Twitch dans Réglages) ou decapi.me en secours.
// decapi renvoie une durée (« 2 hours, 5 minutes ») seulement si la chaîne est en live ; tout autre texte = hors ligne ou erreur
const LIVE_RE = /^\d+\s+(day|hour|minute|second)s?(\s*,\s*\d+\s+(day|hour|minute|second)s?)*$/i;
const TW_KEY = "cabane.twitch";
let tw = store.get(TW_KEY, null);                        // {token}
const twClientId = () => (S.data?.settings.twitchClientId || "").trim();
const twitchOn = () => !!(tw?.token && twClientId());
const redirectUri = () => location.origin + location.pathname.replace(/index\.html$/, "");
function catchTwitchRedirect(){
  let h = location.hash.slice(1); const qs = new URLSearchParams(location.search);
  if(!/access_token=|error=/.test(h) && qs.has("error")) h = location.search.slice(1);     // « Annuler » sur Twitch : l'erreur arrive dans « ?… »
  if(!/access_token=|error=/.test(h)) return;
  const q = new URLSearchParams(h); let st = null;
  try { st = sessionStorage.getItem("cabane.twstate"); sessionStorage.removeItem("cabane.twstate"); } catch {}
  history.replaceState(null, "", location.pathname + (qs.has("error") ? "" : location.search));
  if(q.get("error")){ setTimeout(() => toast("Connexion Twitch annulée ou refusée.", true), 300); return; }
  if(!st || q.get("state") !== st){ setTimeout(() => toast("Connexion Twitch refusée (vérification de sécurité).", true), 300); return; }
  tw = {token:q.get("access_token")}; store.set(TW_KEY, tw);
  setTimeout(() => toast("Compte Twitch connecté"), 300);
}
function twitchLogin(){
  const cid = twClientId(); if(!cid){ toast("Renseigne d'abord le Client ID Twitch.", true); return; }
  const st = Math.random().toString(36).slice(2) + Date.now().toString(36);
  try { sessionStorage.setItem("cabane.twstate", st); } catch {}
  location.href = `https://id.twitch.tv/oauth2/authorize?response_type=token&client_id=${encodeURIComponent(cid)}&redirect_uri=${encodeURIComponent(redirectUri())}&scope=&state=${st}`;
}
function twitchLogout(){ tw = null; store.del(TW_KEY); S.twIds = {}; render(); }
async function helix(path){
  const r = await fetch(`https://api.twitch.tv/helix/${path}`, {headers:{Authorization:`Bearer ${tw.token}`, "Client-Id":twClientId()}, cache:"no-store"});
  if(r.status === 401){ tw = null; store.del(TW_KEY); const e = new Error("twitch-auth"); throw e; }
  if(!r.ok) throw new Error("twitch-" + r.status);
  return r.json();
}
const chunks = (arr, n) => { const out = []; for(let i=0;i<arr.length;i+=n) out.push(arr.slice(i,i+n)); return out; };
function durationMs(d){ const m = /(?:(\d+)h)?(?:(\d+)m)?(?:(\d+)s)?/.exec(d||""); return m ? ((+m[1]||0)*3600 + (+m[2]||0)*60 + (+m[3]||0))*1000 : 0; }
function sinceTxt(iso){ const min = Math.max(0, Math.round((Date.now() - new Date(iso))/60000)); return min < 60 ? `${min} min` : `${Math.floor(min/60)} h ${String(min%60).padStart(2,"0")}`; }
async function fetchText(url){ const r = await fetch(url, {cache:"no-store"}); if(!r.ok) throw 0; return (await r.text()).trim(); }
async function pool(items, n, fn){ let i = 0; await Promise.all(Array.from({length:n}, async () => { while(i < items.length){ const it = items[i++]; await fn(it); if(i % 10 === 0) render(); } })); }

async function loadHelix(logins, full){
  const ids = S.twIds || (S.twIds = {});
  for(const c of chunks(logins.filter(l => !ids[l]), 100)){
    const j = await helix("users?" + c.map(l => "login=" + encodeURIComponent(l)).join("&"));
    j.data.forEach(u => { ids[u.login] = u.id; if(u.profile_image_url) S.avatars[u.login] = u.profile_image_url; });
  }
  const live = {};
  for(const c of chunks(logins.map(l => ids[l]).filter(Boolean), 100)){
    const j = await helix("streams?first=100&" + c.map(id => "user_id=" + id).join("&"));
    j.data.forEach(st => live[st.user_login] = st);
  }
  logins.forEach(l => { const e = S.live[l] || (S.live[l] = {}); e.notFound = !ids[l]; e.live = !!live[l]; e.uptime = live[l] ? sinceTxt(live[l].started_at) : ""; });
  if(!full) return;
  await pool(logins.filter(l => ids[l]), 6, async l => {
    const e = S.live[l];

async function loadDecapi(logins){

async function loadLive(force){

    ...S.data.membres.filter(m => m.statut !== "Parti").map(m => m.login),

// Mémorise le jour où une chaîne de La Cabane a été vue en live (sert au « dernier stream » quand il n'y a pas de VOD)
function recordSeenLive(){
  if(S.mode === "none") return;
  const today = todayISO();
  const vus = S.data.membres.filter(m => liveOf(m.login).live && m.dernierLive !== today);
  if(!vus.length) return;
  S.lot = true; try { vus.forEach(m => dispatch({t:"patch", c:"membres", id:m.id, p:{dernierLive:today}, auto:true})); } finally { S.lot = false; }
  updateSync(); render();
}
function lastStream(m){
  const l = liveOf(m.login);
  if(l.live) return {live:true, days:0};
  const c = [];
  if(l.lastVod) c.push({t:l.lastVod, src:"dernière VOD"});
  if(m.derniereVod) c.push({t:new Date(m.derniereVod).getTime(), src:"dernière VOD (robot)"});
  if(m.dernierLive) c.push({t:new Date(m.dernierLive + "T12:00:00").getTime(), src:"vu en live sur La Cabane"});
  if(m.dernierStreamManuel) c.push({t:new Date(m.dernierStreamManuel + "T12:00:00").getTime(), src:"saisie manuelle"});
  if(!c.length) return null;
  const best = c.reduce((a,b) => b.t > a.t ? b : a);
  const d0 = new Date(); d0.setHours(0,0,0,0); const d1 = new Date(best.t); d1.setHours(0,0,0,0);
  return {days:Math.max(0, Math.round((d0 - d1)/864e5)), date:d1, src:best.src};
}
function lastStreamCell(m){
  const x = lastStream(m);
  if(!x) return `<span class="muted" title="${twitchOn() ? "Aucune VOD publique : saisis la date sur la fiche" : "Connecte Twitch dans Réglages pour lire la dernière VOD"}">–</span>`;
  if(x.live) return `<span class="up">en live</span>`;
  const cls = x.days >= 30 ? "down" : x.days >= 14 ? "warn" : "";
  return `<span class="${cls}" title="${x.date.toLocaleDateString("fr-FR")} · ${x.src}">${x.days === 0 ? "aujourd'hui" : x.days + " j"}</span>`;
}

function refSnapshot(){

  const limit = new Date(Date.now() - 7*864e5).toISOString().slice(0,10);

/* ============ Anniversaires ============ */
function annivInfo(iso){
  if(!iso) return null;
  const [y,m,d] = iso.split("-").map(Number);
  const t = new Date(); t.setHours(0,0,0,0);
  let next = new Date(t.getFullYear(), m-1, d);
  if(next < t) next = new Date(t.getFullYear()+1, m-1, d);
  const days = Math.round((next - t) / 864e5);
  return {days, years: next.getFullYear() - y, next};
}

function sortRows(rows, [key, dir], getters){

/* ----- Données mesurées par le robot ----- */
// viewers : échantillons horaires [["2026-09-25T20", 12], …] pris par le robot quand la chaîne est en live
function viewersStats(r, days = 30){
  const lim = new Date(Date.now() - days*864e5).toISOString().slice(0,10);
  const smp = (r.viewers || []).filter(x => x[0].slice(0,10) >= lim);
  if(!smp.length) return null;
  const sum = smp.reduce((a,x) => a + x[1], 0);
  return {avg:Math.round(sum / smp.length * 10) / 10, n:smp.length, days:new Set(smp.map(x => x[0].slice(0,10))).size, hours:smp.length};
}
const typeTag = r => r.introuvable ? `<span class="tag ko" title="Introuvable sur Twitch depuis le ${fmtDate(r.introuvable)}">introuvable</span>`
  : r.type === "partner" ? `<span class="tag par" title="Partenaire Twitch">partenaire</span>`
  : r.type === "affiliate" ? `<span class="tag aff" title="Affilié Twitch">affilié</span>` : "";
const viewersCell = r => { const v = viewersStats(r); return v ? `<span title="${v.n} mesures sur ${v.days} jours de live">${v.avg}</span>` : `<span class="muted" title="Pas encore de mesure : le robot en prend une par heure de live">–</span>`; };
function voteInfo(p){
  const staff = S.data.settings.staff;
  const kinds = staff.map(s => avisKind(p.avis?.[s]));
  const c = {pour:0, contre:0, neutre:0, autre:0}; kinds.forEach(k => k && c[k]++);
  const done = kinds.filter(Boolean).length, missing = staff.filter((s,i) => !kinds[i]);
  let suggestion = null;
  const tranche = c.pour + c.contre;
  if(done === staff.length && staff.length){
    suggestion = c.pour > c.contre ? "Accepté" : c.contre > c.pour ? "Refusé" : null;
  } else if(staff.length && c.pour > staff.length / 2) suggestion = "Accepté";
  else if(staff.length && c.contre > staff.length / 2) suggestion = "Refusé";
  return {c, done, total:staff.length, missing, suggestion, egalite: done === staff.length && tranche > 0 && c.pour === c.contre};
}
function evenementsRecents(days){
  const lim = new Date(Date.now() - days*864e5).toISOString().slice(0,10);
  const pal = (S.data?.paliers || []).filter(x => x.date >= lim).map(x => ({date:x.date, login:x.login, kind:"palier", palier:x.palier, masque:!!x.masque, txt:`${x.palier} follows`}));
  const ev = (S.data?.evenements || []).filter(x => x.date >= lim && (x.type === "affilie" || x.type === "partenaire"))
    .map(x => ({date:x.date, login:x.login, kind:x.type, type:x.type, masque:!!x.masque, txt:x.type === "affilie" ? "affilié Twitch" : "partenaire Twitch"}));
  return [...ev, ...pal].sort((a,b) => b.date.localeCompare(a.date));
}

function exportCsv(view){

    ? [["Pseudo Discord", m => m.discord], ["Référent", m => m.referent], ["Départ", m => m.depart || ""], ["1er stream", m => m.premierStream || ""], ["Twitch", m => m.type === "partner" ? "partenaire" : m.type === "affiliate" ? "affilié" : ""], ["Notes", m => m.notes]]
    : [["Contact", p => p.contact], ["Date de revue", p => p.dateRevue || ""], ["Date d'invitation", p => p.dateInvitation || ""], ...S.data.settings.staff.map(s => [`Avis ${s}`, p => p.avis?.[s] || ""]), ["Commentaire", p => p.commentaire]];
  const cols = [["Chaîne", r => r.login], ["Lien", r => `https://twitch.tv/${r.login}`], ...COLS[view].map(c => [c.l, c.x]), ...extra]
    .filter((c, i, arr) => arr.findIndex(z => z[0] === c[0]) === i);
  const q = v => { const t = String(v ?? "").replace(/\r?\n/g, " "); return /[;"]/.test(t) ? `"${t.replace(/"/g, '""')}"` : t; };
  const csv = "\ufeff" + [cols.map(c => q(c[0])).join(";"), ...rows.map(r => cols.map(c => q(c[1](r))).join(";"))].join("\r\n");
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([csv], {type:"text/csv;charset=utf-8"}));
  a.download = `la-cabane-${view === "membres" ? "streamers" : "propositions"}-${todayISO()}.csv`; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  toast(`${rows.length} ligne${rows.length > 1 ? "s" : ""} exportée${rows.length > 1 ? "s" : ""}`);
}

/* ----- Import de propositions en lot ----- */
function parseImport(text){
  const d = S.data, seen = new Set(), res = {nouveaux:[], props:[], membres:[], corbeille:[], doublons:[], ignores:[]};
  for(const raw of text.split(/\r?\n/)){
    const line = raw.trim(); if(!line) continue;
    const found = [...line.matchAll(/twitch\.tv\/([A-Za-z0-9_]{2,25})/gi)].map(m => m[1].toLowerCase());
    let cands = found;
    if(!cands.length) cands = line.split(/[,;\t]+/).map(x => x.trim().replace(/^@/, "").toLowerCase()).filter(Boolean);
    const ok = cands.filter(x => /^[a-z0-9_]{2,25}$/.test(x));
    if(!ok.length){ res.ignores.push(line); continue; }
    if(!found.length && ok.length !== cands.length){ res.ignores.push(line); continue; }   // ligne de texte libre : on ne devine pas
    for(const l of ok){
      if(seen.has(l)){ res.doublons.push(l); continue; } seen.add(l);
      const p = d.propositions.find(x => x.login === l), m = d.membres.find(x => x.login === l), t = (d.corbeille || []).find(x => x.r.login === l);
      if(p) res.props.push({l, info:p.statut || "À trier"}); else if(m) res.membres.push({l, info:m.statut || "À renseigner"});
      else if(t) res.corbeille.push({l, info:"dans la corbeille"}); else res.nouveaux.push(l);
    }
  }
  return res;
}

// Charge des référents : nouveaux suivis (arrivés depuis 60 jours ou moins) et total des fiches suivies
function chargeReferents(){
  const d = S.data, now = Date.now();
  const actifs = d.membres.filter(m => m.statut !== "Parti" && !["Admin","Modo"].includes(m.role));
  return d.settings.staff.map(nom => {
    const siens = actifs.filter(m => m.referent === nom);
    const nouveaux = siens.filter(m => m.arrivee && (now - new Date(m.arrivee + "T12:00:00")) / 864e5 <= 60);
    return {nom, nouveaux:nouveaux.length, total:siens.length};
  }).sort((a, b) => a.nouveaux - b.nouveaux || a.total - b.total || a.nom.localeCompare(b.nom, "fr"));
}
function suggestionReferent(){ const c = chargeReferents(); return c.length ? c[0] : null; }

/* ----- Tableau de bord ----- */
function lineChart(pts, opts = {}){
  if(pts.length < 2) return `<p class="none">Pas encore assez de données.</p>`;
  const W = 420, H = 170, L = 44, B = 22, T = 10, Rr = 10;
  const vs = pts.map(p => p.v), lo = opts.zero ? 0 : Math.min(...vs), hi = Math.max(...vs), span = hi - lo || 1;
  const X = i => L + i / (pts.length - 1) * (W - L - Rr), Y = v => T + (1 - (v - lo) / span) * (H - T - B);
  const line = pts.map((p,i) => `${X(i).toFixed(1)},${Y(p.v).toFixed(1)}`).join(" ");
  const ticks = [lo, lo + span/2, hi].map(v => `<text x="${L-6}" y="${Y(v)+4}" text-anchor="end">${Math.round(v)}</text><line class="ax" x1="${L}" x2="${W-Rr}" y1="${Y(v)}" y2="${Y(v)}" stroke-dasharray="2 4"/>`).join("");
  const step = Math.max(1, Math.ceil(pts.length / 6));
  const labels = pts.map((p,i) => i % step === 0 || i === pts.length - 1 ? `<text x="${X(i)}" y="${H-5}" text-anchor="middle">${esc(p.l)}</text>` : "").join("");
  const resume = `${opts.label ? opts.label + " : " : ""}de ${Math.round(pts[0].v)} (${pts[0].l}) à ${Math.round(pts[pts.length - 1].v)} (${pts[pts.length - 1].l})`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(resume)}"><title>${esc(resume)}</title>${ticks}
    <polygon class="ar" points="${X(0)},${H-B} ${line} ${X(pts.length-1)},${H-B}"/><polyline class="ln" points="${line}"/>${labels}</svg>`;
}
function barChart(rows){
  if(!rows.length) return `<p class="none">Pas de données.</p>`;
  const W = 420, rowH = 26, H = rows.length * rowH + 6, L = 150, max = Math.max(...rows.map(r => r.v)) || 1;
  const resume = rows.map(r => `${r.l} : ${r.v}`).join(", ");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(resume)}"><title>${esc(resume)}</title>${rows.map((r,i) => { const w = (W - L - 40) * r.v / max;
    return `<text x="${L-8}" y="${i*rowH+18}" text-anchor="end">${esc(r.l)}</text><rect class="br" x="${L}" y="${i*rowH+6}" width="${Math.max(2,w).toFixed(1)}" height="16" rx="3" style="${r.c ? `fill:${r.c}` : ""}"/><text x="${L+w+6}" y="${i*rowH+18}">${r.v}</text>`; }).join("")}</svg>`;
}
/* ----- Carte récap du mois (image) ----- */
function recapMonths(){

    out.push({k:`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`, l:d.toLocaleDateString("fr-FR",{month:"long", year:"numeric"}) + (i === 0 ? " (en cours)" : "")}); }

function recapStats(mk){
  const d = S.data, [y, mo] = mk.split("-").map(Number);
  const start = `${mk}-01`, end = jourLocal(new Date(y, mo, 0));
  const snaps = d.snapshots.filter(s => s.date <= end);
  const base = [...snaps].reverse().find(s => s.date < start) || snaps.find(s => s.date >= start);
  const last = [...snaps].reverse().find(s => s.date >= start);
  const gains = [];
  if(base && last && base !== last) for(const [l, v] of Object.entries(last.follows || {})) if(base.follows?.[l] != null) gains.push({login:l, g:v - base.follows[l], v});
  const actifs = new Set(d.membres.filter(m => m.statut !== "Parti").map(m => m.login));
  const g = gains.filter(x => actifs.has(x.login));
  return {
    label:new Date(y, mo-1, 1).toLocaleDateString("fr-FR", {month:"long", year:"numeric"}),
    nouveaux:d.membres.filter(m => (m.arrivee || "").startsWith(mk)).map(m => m.login),
    gagnes:g.reduce((a,x) => a + x.g, 0),
    top:g.filter(x => x.g > 0).sort((a,b) => b.g - a.g).slice(0, 5),
    paliers:(d.paliers || []).filter(x => x.date.startsWith(mk)),
    affi:(d.evenements || []).filter(x => x.date.startsWith(mk) && (x.type === "affilie" || x.type === "partenaire")),
    annivs:d.membres.filter(m => m.statut !== "Parti" && m.premierStream && m.premierStream.slice(5,7) === mk.slice(5,7) && m.premierStream.slice(0,4) < mk.slice(0,4))
      .map(m => ({login:m.login, ans:Number(mk.slice(0,4)) - Number(m.premierStream.slice(0,4))})),
    periode:base && last && base !== last ? `relevés du ${fmtDate(base.date)} au ${fmtDate(last.date)}` : "pas assez de relevés sur ce mois"
  };
}

const lastSnapTotal = snaps => { const s = snaps[snaps.length-1]; return s ? Object.values(s.follows || {}).reduce((a,b) => a + (b||0), 0) : null; };

function entonnoirCard(){
  const d = S.data, mois = [], now = new Date();
  for(let i = 5; i >= 0; i--){ const dt = new Date(now.getFullYear(), now.getMonth() - i, 1); mois.push({k:`${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, "0")}`, l:dt.toLocaleDateString("fr-FR", {month:"long"})}); }
  const lignes = [...d.propositions.map(p => ({m:(p.dateProposition || "").slice(0, 7), st:p.statut || "À trier", fin:["Accepté","Refusé","Abandonnée","Aucun contact"].includes(p.statut) ? (p.dateRevue || p.statutDepuis) : null, deb:p.dateProposition})),
    ...d.membres.filter(m => m.candidature?.dateProposition).map(m => ({m:m.candidature.dateProposition.slice(0, 7), st:"Accepté", fin:m.candidature.transfereLe, deb:m.candidature.dateProposition}))];
  const stat = k => { const l = lignes.filter(x => x.m === k), n = st => l.filter(x => st.includes(x.st)).length;
    const dl = l.filter(x => x.fin && x.deb).map(x => (new Date(x.fin) - new Date(x.deb)) / 864e5).filter(x => x >= 0);
    return {recues:l.length, acc:n(["Accepté"]), ref:n(["Refusé"]), aband:n(["Abandonnée","Aucun contact"]), cours:l.length - n(["Accepté","Refusé","Abandonnée","Aucun contact"]), delai:dl.length ? Math.round(dl.reduce((a, b) => a + b, 0) / dl.length) : null}; };
  const rows = mois.map(mo => ({...mo, ...stat(mo.k)})), tot = rows.reduce((a, r) => ({recues:a.recues + r.recues, acc:a.acc + r.acc, ref:a.ref + r.ref, aband:a.aband + r.aband, cours:a.cours + r.cours}), {recues:0, acc:0, ref:0, aband:0, cours:0});
  const max = Math.max(1, ...rows.map(r => r.recues));
  const barre = r => r.recues ? `<span style="display:flex;height:10px;border-radius:5px;overflow:hidden;width:${Math.round(r.recues / max * 100)}%;min-width:8px;background:var(--line)" aria-hidden="true">${[["acc","var(--ok)"],["ref","var(--ko)"],["aband","var(--grey)"],["cours","var(--cyan)"]].map(([k, c]) => r[k] ? `<span style="flex:${r[k]};background:${c}"></span>` : "").join("")}</span>` : "";

    <div style="overflow-x:auto" tabindex="0" role="region" aria-label="Tableau de l'entonnoir des propositions"><table class="tbl" style="width:100%;min-width:520px"><thead><tr><th scope="col">Mois</th><th scope="col">Reçues</th><th scope="col">Acceptées</th><th scope="col">Refusées</th><th scope="col">Abandon</th><th scope="col">En cours</th><th scope="col">Délai moyen</th><th scope="col" style="width:30%"><span class="sr">Répartition</span></th></tr></thead>
    <tbody>${rows.map(r => `<tr><td>${esc(r.l)}</td><td><b>${r.recues}</b></td><td class="up">${r.acc || ""}</td><td class="down">${r.ref || ""}</td><td>${r.aband || ""}</td><td>${r.cours || ""}</td><td>${r.delai != null ? r.delai + " j" : "–"}</td><td>${barre(r)}</td></tr>`).join("")}</tbody></table></div>
