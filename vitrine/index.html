<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>La Cabane · Nos streamers</title>
<meta name="description" content="La Cabane, communauté d'entraide et de motivation entre streamers : découvre nos membres et qui est en live.">
<!-- Aperçu affiché quand le lien est collé sur Discord, X, WhatsApp… (adresses absolues obligatoires) -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="La Cabane">
<meta property="og:locale" content="fr_FR">
<meta property="og:url" content="https://lacabanestreamers.github.io/vitrine/">
<meta property="og:title" content="La Cabane · Nos streamers">
<meta property="og:description" content="Communauté d'entraide et de motivation entre streamers : découvre nos membres, qui est en live et nos prochains événements.">
<meta property="og:image" content="https://lacabanestreamers.github.io/vitrine/apercu.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="La Cabane · Nos streamers">
<meta name="twitter:description" content="Communauté d'entraide et de motivation entre streamers : découvre nos membres, qui est en live et nos prochains événements.">
<meta name="twitter:image" content="https://lacabanestreamers.github.io/vitrine/apercu.png">
<link rel="canonical" href="https://lacabanestreamers.github.io/vitrine/">
<meta name="theme-color" content="#100B24">
<link rel="icon" href="../icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#100B24; --panel:#18123A; --panel2:#201951; --line:#2E2663; --text:#ECE9FF; --muted:#A59FD3;
  --cyan:#3DE3FF; --pink:#FF4FD8; --ok:#5CF2A6; --ko:#FF5C7A; --aff:#C9A7FF;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:500 17px/1.45 Rajdhani,"Segoe UI",system-ui,sans-serif;min-height:100vh;
  background-image:radial-gradient(900px 500px at 12% -10%, rgba(255,79,216,.20), transparent 60%),radial-gradient(900px 600px at 100% 0%, rgba(61,227,255,.12), transparent 60%);background-attachment:fixed}
a{color:var(--cyan)}
:focus-visible{outline:2px solid var(--cyan);outline-offset:3px;border-radius:6px}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
.hidden{display:none!important}

/* En-tête */
header{padding:56px 0 30px}
h1{font:800 clamp(40px,8vw,76px)/1 Orbitron,sans-serif;margin:0;letter-spacing:.02em;text-shadow:0 0 18px rgba(255,79,216,.65),0 0 44px rgba(255,79,216,.25)}
.intro{max-width:62ch;color:#D4CFF5;font-size:20px;margin:18px 0 0;white-space:pre-line}
.cta{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-top:24px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 20px;border-radius:10px;font-weight:700;font-size:17px;text-decoration:none;border:1px solid var(--pink);background:var(--pink);color:#1a0716}
.btn:hover{filter:brightness(1.1)}
button.btn{cursor:pointer;font-family:inherit}
.stats{color:var(--muted);font-weight:600}
.stats b{color:var(--text);font-size:19px}

/* Sections */
section{margin:34px 0}
h2{font:700 20px/1.2 Orbitron,sans-serif;margin:0 0 16px;display:flex;align-items:center;gap:10px}
h2 .dot{width:11px;height:11px;border-radius:50%;background:var(--ko);box-shadow:0 0 10px var(--ko)}
@media (prefers-reduced-motion:no-preference){ h2 .dot{animation:pulse 1.6s ease-in-out infinite} @keyframes pulse{50%{opacity:.35}} }

/* En live */
.lives{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.lv{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;text-decoration:none;color:inherit;display:flex;flex-direction:column;transition:border-color .15s}
.lv:hover{border-color:var(--ko)}
.lv .img{aspect-ratio:16/9;background:#0b0820 center/cover no-repeat;position:relative}
.lv .badge{position:absolute;left:10px;top:10px;background:var(--ko);color:#1a0716;font-weight:700;font-size:13px;padding:2px 8px;border-radius:5px;letter-spacing:.04em}
.lv .vw{position:absolute;left:10px;bottom:10px;background:rgba(10,6,25,.8);font-weight:700;font-size:14px;padding:2px 8px;border-radius:5px}
.lv .b{display:flex;gap:10px;padding:12px 14px;align-items:flex-start}
.lv .t{font-size:15px;color:#D4CFF5;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.lv .g{font-size:14px;color:var(--cyan);font-weight:700}

/* Membres */
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.search{flex:1 1 240px;max-width:360px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px;color:var(--text);font:inherit}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 14px;cursor:pointer;font:600 16px Rajdhani,sans-serif;color:var(--text)}
.chip[aria-pressed="true"]{border-color:var(--cyan);background:rgba(61,227,255,.12)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(250px,100%),1fr));gap:14px}
.card{min-width:0;overflow-wrap:anywhere;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px;text-decoration:none;color:inherit;transition:border-color .15s,transform .15s}
.card:hover{border-color:var(--pink);transform:translateY(-2px)}
.card.on{border-color:rgba(255,92,122,.6)}
.who{display:flex;gap:12px;align-items:center;min-width:0}
.av{width:56px;height:56px;border-radius:50%;object-fit:cover;flex:none;background:var(--panel2);display:grid;place-items:center;font:800 22px Orbitron,sans-serif;color:var(--muted)}
.card.on .av{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--ko)}
.lv .av{width:40px;height:40px;font-size:16px}
.nm{font-weight:700;font-size:19px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.tag{font-size:12px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;padding:1px 7px;border-radius:4px}
.tag.aff{background:rgba(169,112,255,.18);color:var(--aff);border:1px solid rgba(169,112,255,.5)}
.tag.par{background:#9146FF;color:#fff}
.tag.staff{background:rgba(255,79,216,.15);color:var(--pink);border:1px solid rgba(255,79,216,.5)}
.tag.live{background:var(--ko);color:#1a0716}
.bio{color:#C9C3EE;font-size:15.5px;margin:0;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
.since{color:var(--muted);font-size:14px;margin-top:auto}
.empty{color:var(--muted);padding:30px 0}

/* Réussites */
.clips{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.clip{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;text-decoration:none;color:inherit;display:flex;flex-direction:column}
.clip:hover,.clip:focus-visible{border-color:var(--pink)}
.clip .img{aspect-ratio:16/9;background:#0a0718 center/cover no-repeat;position:relative}
.clip .img .vw{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.72);border-radius:6px;padding:2px 8px;font-size:14px;font-weight:700}
.clip .b{padding:10px 12px;display:flex;gap:10px;align-items:center}
.clip .b .av{width:34px;height:34px}
.clip .t{font-weight:700;line-height:1.2;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.clip .n{font-size:14px;color:var(--muted)}
.jeux{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 0}
.jeu{font-size:14px;font-weight:700;color:var(--cyan);border:1px solid rgba(61,227,255,.35);border-radius:999px;padding:1px 10px}
select.chip{appearance:none;padding-right:28px;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 15px) 55%,calc(100% - 10px) 55%;background-size:5px 5px;background-repeat:no-repeat}
.rejoindre{background:linear-gradient(135deg,rgba(255,79,216,.12),rgba(61,227,255,.08));border:1px solid var(--line);border-radius:16px;padding:22px 24px}
.rejoindre p{white-space:pre-line;font-size:18px;margin:0 0 14px;max-width:70ch}
.wins{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.win{display:flex;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px;text-decoration:none;color:inherit}
.win:hover{border-color:var(--pink)}
.win .av{width:40px;height:40px;font-size:16px}
.win .ic{font-size:22px;flex:none}
.win b{color:var(--text)}
.win .d{color:var(--muted);font-size:14px;display:block}

/* Page d'un membre */
body.profil header{padding:26px 0 6px}
body.profil h1{font-size:clamp(28px,5vw,40px)}
body.profil .intro, body.profil #stats, body.profil #discord, body.profil #hasard{display:none!important}
.back{display:inline-block;margin:6px 0 18px;font-weight:700;text-decoration:none}
.prof{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:26px;display:grid;grid-template-columns:auto 1fr;gap:24px;align-items:start}
.prof .av{width:128px;height:128px;font-size:48px;box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--pink),0 0 34px rgba(255,79,216,.45)}
.prof.on .av{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--ko),0 0 34px rgba(255,92,122,.5)}
.prof h2{font:800 clamp(26px,5vw,38px)/1.1 Orbitron,sans-serif;margin:0 0 8px;display:block;overflow-wrap:anywhere}
.prof .bio{-webkit-line-clamp:unset;display:block;margin:12px 0 0;font-size:17px;white-space:pre-line}
.prof .since{display:block;margin-top:12px;font-size:16px}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.btn.alt{background:transparent;color:var(--text);border-color:var(--line)}
.btn.alt:hover{border-color:var(--cyan)}
.golive{margin-top:18px;display:grid;grid-template-columns:minmax(0,300px) 1fr;gap:16px;align-items:center;background:rgba(255,92,122,.08);border:1px solid rgba(255,92,122,.5);border-radius:14px;padding:12px;text-decoration:none;color:inherit}
.golive .img{aspect-ratio:16/9;border-radius:10px;background:#0b0820 center/cover no-repeat}
.timeline{list-style:none;margin:0;padding:0}
.timeline li{display:flex;gap:12px;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--line)}
.timeline li:last-child{border-bottom:0}
.timeline .d{color:var(--muted);min-width:96px;font-size:15px}
.hint{color:var(--muted);font-size:15px;margin-top:10px}
@media (max-width:600px){
  .prof{grid-template-columns:1fr;justify-items:start;padding:20px}
  .prof .av{width:96px;height:96px;font-size:36px}
  .golive{grid-template-columns:1fr}
}

/* Anniversaires de stream */
.annivs{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.ann{display:flex;gap:12px;align-items:center;background:linear-gradient(135deg,rgba(255,79,216,.16),rgba(61,227,255,.08));border:1px solid rgba(255,79,216,.5);border-radius:12px;padding:10px 14px;text-decoration:none;color:inherit}
.ann.bientot{background:var(--panel);border-color:var(--line)}
.ann:hover{border-color:var(--pink)}
.ann .av{width:44px;height:44px;font-size:17px}
.ann .d{color:var(--muted);font-size:14px;display:block}
.fete{margin-top:14px;padding:10px 14px;border-radius:12px;background:linear-gradient(135deg,rgba(255,79,216,.2),rgba(61,227,255,.1));border:1px solid var(--pink);font-weight:700;font-size:18px}
.fete.calme{background:none;border-color:var(--line);font-weight:600;font-size:16px;color:#D4CFF5}

/* En chiffres */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin:0 0 6px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.kpi b{display:block;font:800 30px/1.1 Orbitron,sans-serif;background:linear-gradient(90deg,var(--pink),var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent}
.kpi span{color:var(--muted);font-weight:600;font-size:15px}
/* Nouveaux */
.news{display:flex;gap:12px;flex-wrap:wrap}
.new{display:flex;flex-direction:column;align-items:center;gap:6px;width:110px;text-decoration:none;color:inherit;text-align:center}
.new .av{width:72px;height:72px;box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--cyan)}
.new:hover .av{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--pink)}
.new .nm{font-size:15px;max-width:110px}
.new .d{color:var(--muted);font-size:13px}
/* Événements */
.evts{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.evt{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;grid-template-columns:70px 1fr;gap:14px}
.evt.today{border-color:var(--pink);background:linear-gradient(135deg,rgba(255,79,216,.14),rgba(61,227,255,.06))}
.evt .q{text-align:center;border-right:1px solid var(--line);padding-right:10px}
.evt .q b{display:block;font:800 28px/1 Orbitron,sans-serif}
.evt .q small{display:block;color:var(--muted);font-size:14px}
.evt h3{margin:0 0 4px;font-size:19px}
.evt .ty{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:var(--cyan)}
.evt p{margin:6px 0;color:#D4CFF5;font-size:15.5px;white-space:pre-line}
.evt .ppl{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.evt .ppl a .av{width:30px;height:30px;font-size:13px}
.evt .acts{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-top:10px}
.btn.mini{padding:7px 14px;font-size:15px;border-radius:8px}
.evt .acts a.dc{font-size:15px}
.evt .wait{font-size:14px;color:var(--muted);flex-basis:100%}
.evt .moi{font-size:14px;color:var(--cyan)}
.evt details.cal{margin-top:8px;font-size:15px}
.evt details.cal summary{cursor:pointer;color:var(--cyan);list-style:none}
.evt details.cal summary::-webkit-details-marker{display:none}
.evt details.cal[open] summary{margin-bottom:6px}
.evt details.cal a{margin-right:14px}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);max-width:min(560px,calc(100% - 32px));background:var(--panel);border:1px solid var(--pink);color:var(--text);padding:12px 18px;border-radius:12px;font-size:16px;box-shadow:0 8px 30px rgba(0,0,0,.45);z-index:50}
#toast[hidden]{display:none}

footer{border-top:1px solid var(--line);margin-top:50px;padding:22px 0 40px;color:var(--muted);font-size:15px;display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between}

@media (max-width:600px){
  header{padding:36px 0 20px}
  .intro{font-size:18px}
  .grid{grid-template-columns:minmax(0,1fr)}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="titre">La Cabane</h1>
    <p class="intro" id="texte"></p>
    <div class="cta"><a class="btn hidden" id="discord" target="_blank" rel="noopener">Rejoindre le Discord</a><button class="btn alt hidden" id="hasard" type="button">🎲 Découvrir un streamer</button><span class="stats" id="stats"></span></div>
  </header>

  <main id="main"><p class="empty">Chargement…</p></main>

  <div id="toast" role="status" aria-live="polite" hidden></div>
  <footer><span id="maj"></span><span>Données publiques Twitch · <a href="https://www.twitch.tv" target="_blank" rel="noopener">twitch.tv</a></span></footer>
</div>

<script>
"use strict";
const $ = s => document.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const okLogin = l => /^[a-z0-9_]{1,25}$/i.test(l || "");
const okImg = u => /^https:\/\/static-cdn\.jtvnw\.net\/[\w\-./%~]+$/.test(u || "");
const okClipImg = u => /^https:\/\/(static-cdn\.jtvnw\.net|clips-media-assets2\.twitch\.tv)\/[\w\-./%~]+$/.test(u || "");
const okClip = c => c && /^https:\/\/(clips\.twitch\.tv|www\.twitch\.tv)\//.test(c.url || "");
const chan = l => `https://www.twitch.tv/${encodeURIComponent(l)}`;
const horsParis = (() => { try { return Intl.DateTimeFormat().resolvedOptions().timeZone !== "Europe/Paris"; } catch { return false; } })();
let DATA = null, filtre = "tous", q = "", chargerFait = false, jeuFiltre = "";

function av(m){ return okImg(m.avatar) ? `<img class="av" src="${esc(m.avatar)}" alt="" loading="lazy" referrerpolicy="no-referrer">` : `<span class="av" aria-hidden="true">${esc((m.nom || m.login || "?")[0])}</span>`; }
function tags(m){
  return [m.live && `<span class="tag live">En live</span>`, m.type === "partner" && `<span class="tag par">Partenaire</span>`,
    m.type === "affiliate" && `<span class="tag aff">Affilié</span>`, m.staff && `<span class="tag staff">Staff</span>`].filter(Boolean).join("");
}
function depuis(iso){ if(!iso) return ""; const [y, mo] = iso.split("-").map(Number); return `Membre depuis ${new Date(y, mo - 1, 1).toLocaleDateString("fr-FR", {month:"long", year:"numeric"})}`; }
const fmtD = iso => { const [y, m, d] = iso.split("-").map(Number); return new Date(y, m - 1, d).toLocaleDateString("fr-FR", {day:"numeric", month:"long", year:"numeric"}); };
function succesTxt(x){ return x.type === "palier" ? `a passé les <b>${Number(x.palier)} follows</b>` : x.type === "partenaire" ? `est devenu <b>partenaire Twitch</b>` : `est devenu <b>affilié Twitch</b>`; }
const succesIc = x => x.type === "palier" ? "🚀" : "🎉";
const pageUrl = l => `?m=${encodeURIComponent(l)}`;
// Anniversaire de stream : prochaine date (aujourd'hui compris), nombre de jours et d'années de stream fêtées
function anniv(m, champ = "premierStream"){
  if(!/^\d{4}-\d{2}-\d{2}$/.test(m[champ] || "")) return null;
  const [y, mo, d] = m[champ].split("-").map(Number);
  const t = new Date(); t.setHours(0, 0, 0, 0);
  const le = an => { const x = new Date(an, mo - 1, d); if(mo === 2 && d === 29 && x.getMonth() !== 1) x.setDate(0); return x; };  // 29/02 → 28/02 les années non bissextiles
  let prochain = le(t.getFullYear()); if(prochain < t) prochain = le(t.getFullYear() + 1);
  const ans = prochain.getFullYear() - y;
  return ans < 1 ? null : {jours:Math.round((prochain - t) / 864e5), ans, date:prochain};
}
const ansTxt = n => `${n} an${n > 1 ? "s" : ""}`;
const fete = n => n === 1 ? "sa première année" : `ses ${n} ans`;   // « fête ses 3 ans » / « fête sa première année »
function duree(iso){ const min = Math.max(0, Math.round((Date.now() - new Date(iso)) / 60000)); return min < 60 ? `${min} min` : `${Math.floor(min / 60)} h ${String(min % 60).padStart(2, "0")}`; }

function render(){
  // garder ce que la personne avait ouvert ou sélectionné (agenda déplié, menu des jeux…) malgré les rafraîchissements
  const ouverts = [...document.querySelectorAll("details.cal[open]")].map(x => x.closest("[data-ev]")?.dataset.ev).filter(Boolean);
  const focusId = document.activeElement?.id || "";
  const r = _render();
  for(const id of ouverts) document.querySelector(`[data-ev="${CSS.escape(id)}"] details.cal`)?.setAttribute("open", "");
  if(focusId && focusId !== "q") document.getElementById(focusId)?.focus({preventScroll:true});
  return r;
}
function _render(){
  const d = DATA, main = $("#main");
  const perso = new URLSearchParams(location.search).get("m");
  document.body.classList.toggle("profil", !!perso && !!d?.active);
  if(!d || !d.active){
    main.innerHTML = `<p class="empty">La vitrine n'est pas publiée pour le moment. Reviens bientôt !</p>`;
    $("#stats").textContent = ""; return;
  }
  document.title = `${d.titre || "La Cabane"} · Nos streamers`;
  $("#titre").textContent = d.titre || "La Cabane";
  $("#texte").textContent = d.texte || "";
  const dc = $("#discord");
  if(/^https:\/\/(discord\.gg|discord\.com\/invite)\//i.test(d.lienDiscord || "")){ dc.href = d.lienDiscord; dc.classList.remove("hidden"); } else dc.classList.add("hidden");
  $("#hasard").classList.toggle("hidden", !(d.membres || []).length);

  const membres = (d.membres || []).filter(m => okLogin(m.login));
  if(!perso) profilAffiche = null;
  if(perso){ renderProfil(membres.find(m => m.login.toLowerCase() === perso.toLowerCase()), d); return; }
  // Anniversaires de stream : aujourd'hui, puis les 7 prochains jours

// Le robot ne passe qu'une fois par heure : les lives qu'il a notés sont revérifiés ici, en direct.
// decapi renvoie une durée (« 1 hour, 5 minutes ») si la chaîne est en live, « … is offline » sinon.
const LIVE_RE = /^\d+\s+(day|hour|minute|second)s?(\s*,\s*\d+\s+(day|hour|minute|second)s?)*$/i;
let liveVerifieA = null;
const horsLigne = new Map();   // pseudo -> version des données (maj) pour laquelle le live a été vu terminé
// Le live est vérifié ici, en direct, pour TOUS les membres (pas seulement ceux notés par le robot) :
// la vitrine reste juste même si le robot a du retard. decapi renvoie une durée si la chaîne est en live.
const horsLigneOk = t => /offline/i.test(t) && !LIVE_RE.test(t);
function dureeMs(t){ let ms = 0; for(const [, n, u] of t.matchAll(/(\d+)\s+(day|hour|minute|second)/gi)) ms += n * {day:864e5, hour:36e5, minute:6e4, second:1e3}[u.toLowerCase()]; return ms; }
async function pool(items, n, fn){ let i = 0; await Promise.all(Array.from({length:Math.min(n, items.length)}, async () => { while(i < items.length) await fn(items[i++]); })); }
async function decapi(path){ const r = await fetch(`https://decapi.me/twitch/${path}`, {cache:"no-store"}); if(!r.ok) throw 0; return (await r.text()).trim(); }
let verifEnCours = false, rotation = 0;
async function verifierLives(){
  if(verifEnCours) return;                                    // un passage à la fois
  const donnees = DATA;
  const tous = (donnees?.membres || []).filter(m => okLogin(m.login));
  // au-delà de 40 membres : ceux notés en live + 40 autres à tour de rôle (tout le monde est vu en quelques minutes)
  let aVerifier = tous;
  if(tous.length > 40){ const autres = tous.filter(m => !m.live); const lot = autres.slice(rotation, rotation + 40); rotation = rotation + 40 >= autres.length ? 0 : rotation + 40;
    aVerifier = [...tous.filter(m => m.live), ...lot]; }
  if(!aVerifier.length) return;
  verifEnCours = true;
  let change = false;
  await pool(aVerifier, 6, async m => {
    let t; try { t = await decapi(`uptime/${encodeURIComponent(m.login)}`); } catch { return; }   // réseau : on garde l'information du robot
    if(LIVE_RE.test(t)){
      if(!m.live){   // passé en live depuis le passage du robot : on complète les infos
        const [jeu, titre, vw] = await Promise.all([decapi(`game/${encodeURIComponent(m.login)}`).catch(() => ""), decapi(`title/${encodeURIComponent(m.login)}`).catch(() => ""), decapi(`viewercount/${encodeURIComponent(m.login)}`).catch(() => "")]);
        m.live = {viewers:/^\d+$/.test(vw) ? Number(vw) : 0, jeu:/offline|error|not found/i.test(jeu) ? "" : jeu, titre:/error|not found/i.test(titre) ? "" : titre.slice(0, 140),
          depuis:new Date(Date.now() - dureeMs(t)).toISOString(), apercu:`https://static-cdn.jtvnw.net/previews-ttv/live_user_${m.login.toLowerCase()}-440x248.jpg`};
        horsLigne.delete(m.login); change = true;
      }
    } else if(horsLigneOk(t) && m.live){ m.live = null; horsLigne.set(m.login, DATA.maj); change = true; }
  });
  verifEnCours = false;
  liveVerifieA = new Date();
  if(change && DATA === donnees) render();          // données rechargées entre-temps : le prochain passage s'en charge
}

// « Découvrir un streamer » : tirage parmi les membres de La Cabane uniquement.
// En priorité quelqu'un en live (les petits lives ont plus de chances), sinon n'importe quel membre,
// avec un coup de pouce aux chaînes pas encore affiliées. On évite de retomber sur les derniers tirés.
const deja = [];
function tirage(){
  const membres = (DATA?.membres || []).filter(m => okLogin(m.login));
  if(!membres.length) return null;
  const libres = membres.filter(m => !deja.includes(m.login));
  const pool = libres.length ? libres : membres;
  const lives = pool.filter(m => m.live);
  const choix = lives.length && Math.random() < 0.7 ? lives : pool;
  const poids = m => m.live ? 1 / (1 + Math.sqrt(Number(m.live.viewers) || 0)) : (m.type ? 1 : 2);
  let total = choix.reduce((a, m) => a + poids(m), 0), x = Math.random() * total;
  for(const m of choix){ x -= poids(m); if(x <= 0) return m; }
  return choix[choix.length - 1];
}
function decouvrir(){
  const m = tirage(); if(!m) return;
  deja.push(m.login); if(deja.length > 8) deja.shift();
  history.pushState(null, "", pageUrl(m.login)); render();
}

/* ---------- Inscriptions aux événements (streamers de La Cabane) ----------
   Connexion Twitch (prouve qui tu es) → demande déposée dans un salon Discord privé →
   le robot la vérifie auprès de Twitch, l'ajoute, puis efface le message. */
const SESSION = "cabane.vitrine.twitch", ATTENTE = "cabane.vitrine.attente", RETOUR = "cabane.vitrine.oauth";
const lire = (st, k) => { try { return JSON.parse(st.getItem(k)); } catch { return null; } };
const ecrire = (st, k, v) => { try { v == null ? st.removeItem(k) : st.setItem(k, JSON.stringify(v)); } catch {} };
// l'adresse du webhook est publiée masquée (voir le robot) : on la reconstitue ici
const webhookDe = ins => { try { return ins?.cle ? decodeURIComponent(escape(atob(ins.cle.split("").reverse().join("")))) : (ins?.webhook || ""); } catch { return ""; } };
const okWebhook = u => /^https:\/\/(discord\.com|discordapp\.com)\/api\/webhooks\/\d+\/[\w-]+$/.test(u || "");
const redirectUri = () => location.origin + "/";   // adresse déjà autorisée dans l'application Twitch (page staff), qui renvoie ici
let toastT = null;
function toast(t){ const el = $("#toast"); el.textContent = t; el.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { el.hidden = true; }, 6000); }
function attentes(){
  const a = lire(localStorage, ATTENTE) || {}, s = lire(sessionStorage, SESSION);
  for(const [id, x] of Object.entries(a)){
    const e = (DATA?.agenda || []).find(y => y.id === id), dedans = !!e?.participants?.some(p => p.login.toLowerCase() === x.login.toLowerCase());
    if(!e || Date.now() - x.le > 3 * 36e5 || (x.action === "in") === dedans || (s && s.login !== x.login)) delete a[id];
  }
  ecrire(localStorage, ATTENTE, a); return a;
}
function actionsEvt(e, d){
  const ins = d.inscriptions && okWebhook(webhookDe(d.inscriptions)) && e.id, dc = /^https:\/\/discord\.com\/channels\//.test(e.discord || "") ? e.discord : "";
  if(!ins && !dc) return "";
  const s = lire(sessionStorage, SESSION), att = attentes()[e.id];
  const dedans = !!(s && (e.participants || []).some(p => p.login.toLowerCase() === s.login.toLowerCase()));
  const veut = att ? att.action === "in" : dedans;
  return `<div class="acts">
    ${ins ? (veut ? `<span class="moi">✓ Tu participes</span><button class="btn alt mini" type="button" data-insout="${esc(e.id)}">Me désinscrire</button>`
                  : `<button class="btn mini" type="button" data-ins="${esc(e.id)}">✋ Je participe</button>`) : ""}
    ${dc ? `<a class="dc" href="${esc(dc)}" target="_blank" rel="noopener">${ins ? "ou réagis ✅ sur Discord" : "S'inscrire : réagis ✅ sur Discord"}</a>` : ""}
    ${att ? `<span class="wait">⏳ ${att.action === "in" ? "Inscription" : "Désinscription"} envoyée : elle apparaîtra ici d'ici une heure.</span>` : ""}
  </div>`;
}
async function inscrire(id, action){
  const ins = DATA?.inscriptions, wh = webhookDe(ins); if(!ins || !okWebhook(wh)) return;
  const s = lire(sessionStorage, SESSION);
  if(!s){   // d'abord : qui es-tu ? (connexion Twitch, sans aucune autorisation demandée)
    const etat = Math.random().toString(36).slice(2) + Date.now().toString(36);
    ecrire(sessionStorage, RETOUR, {etat, id, action, retour:location.search});
    location.href = `https://id.twitch.tv/oauth2/authorize?${new URLSearchParams({client_id:ins.clientId, redirect_uri:redirectUri(), response_type:"token", scope:"", state:etat})}`;
    return;
  }
  if(!(DATA.membres || []).some(m => m.login.toLowerCase() === s.login.toLowerCase())){
    render(); toast(`Les inscriptions sont réservées aux streamers de La Cabane (tu es connecté à Twitch en tant que ${s.login}). Si tu en fais partie mais n'apparais pas sur la vitrine, inscris-toi avec ✅ sous le message Discord.`); return; }
  if(!navigator.onLine){ render(); toast("Pas de connexion internet : réessaie dans un instant."); return; }
  const fd = new FormData();
  fd.append("payload_json", JSON.stringify({username:`Vitrine · ${s.login}`, allowed_mentions:{parse:[]},
    content:JSON.stringify({cabane:"inscription", ev:id, action, jeton:s.jeton})}));
  let ok = true;
  try { const r = await fetch(wh, {method:"POST", body:fd}); ok = r.ok; } catch { /* réponse illisible (CORS) : la demande est quand même partie */ }
  if(!ok){ render(); toast("La demande n'a pas pu être envoyée. Réessaie plus tard, ou réagis ✅ sur Discord."); return; }
  const a = attentes(); a[id] = {action, login:s.login, le:Date.now()}; ecrire(localStorage, ATTENTE, a);
  render();
  toast(action === "in" ? "C'est noté ! Ton inscription sera visible d'ici une heure." : "Désinscription envoyée, elle sera prise en compte d'ici une heure.");
}
async function retourTwitch(){
  const h = new URLSearchParams(location.hash.slice(1)); if(!h.has("access_token") && !h.has("error")) return;
  const r = lire(sessionStorage, RETOUR); ecrire(sessionStorage, RETOUR, null);
  history.replaceState(null, "", location.pathname + (r?.retour || ""));
  if(h.has("error")){ toast("Connexion Twitch annulée."); return; }
  if(!r || h.get("state") !== r.etat){ toast("Connexion Twitch refusée (vérification de sécurité)."); return; }
  try {
    const j = await (await fetch("https://api.twitch.tv/helix/users", {headers:{Authorization:`Bearer ${h.get("access_token")}`, "Client-Id":DATA?.inscriptions?.clientId || ""}})).json();
    const u = j.data?.[0]; if(!u) throw 0;
    ecrire(sessionStorage, SESSION, {jeton:h.get("access_token"), login:u.login, id:u.id});
  } catch { toast("Impossible de vérifier ton compte Twitch. Réessaie."); return; }
  if(r.id) await inscrire(r.id, r.action);
}

/* ---------- Ajouter à mon agenda (heure de Paris) ---------- */
const pad = n => String(n).padStart(2, "0");
function bornes(e){   // début / fin en heure murale de Paris, au format AAAAMMJJTHHMMSS (ou AAAAMMJJ pour une journée entière)
  const [y, m, d] = e.date.split("-").map(Number);
  if(!/^\d{2}:\d{2}$/.test(e.heure || "")){ const f = new Date(Date.UTC(y, m - 1, d + 1)); return {journee:true, debut:`${y}${pad(m)}${pad(d)}`, fin:`${f.getUTCFullYear()}${pad(f.getUTCMonth() + 1)}${pad(f.getUTCDate())}`}; }
  const [h, mi] = e.heure.split(":").map(Number), a = new Date(Date.UTC(y, m - 1, d, h, mi)), b = new Date(a.getTime() + (Number(e.duree) || 120) * 6e4);
  const f = t => `${t.getUTCFullYear()}${pad(t.getUTCMonth() + 1)}${pad(t.getUTCDate())}T${pad(t.getUTCHours())}${pad(t.getUTCMinutes())}00`;
  return {journee:false, debut:f(a), fin:f(b)};
}
const texteEvt = e => [e.type, e.description, e.lien, "La Cabane · " + location.origin + location.pathname].filter(Boolean).join("\n\n");
function lienGoogle(e){
  const b = bornes(e);
  return `https://calendar.google.com/calendar/render?${new URLSearchParams({action:"TEMPLATE", text:e.titre, dates:`${b.debut}/${b.fin}`, ctz:"Europe/Paris", details:texteEvt(e), location:e.lien || "Twitch"})}`;
}
function telechargerIcs(e){
  const b = bornes(e), x = t => String(t || "").replace(/\\/g, "\\\\").replace(/;/g, "\\;").replace(/,/g, "\\,").replace(/\r?\n/g, "\\n");
  const now = new Date().toISOString().replace(/[-:]/g, "").slice(0, 15) + "Z";
  const ics = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//La Cabane//Vitrine//FR", "CALSCALE:GREGORIAN",
    "BEGIN:VTIMEZONE", "TZID:Europe/Paris",
    "BEGIN:DAYLIGHT", "TZOFFSETFROM:+0100", "TZOFFSETTO:+0200", "TZNAME:CEST", "DTSTART:19700329T020000", "RRULE:FREQ=YEARLY;BYMONTH=3;BYDAY=-1SU", "END:DAYLIGHT",
    "BEGIN:STANDARD", "TZOFFSETFROM:+0200", "TZOFFSETTO:+0100", "TZNAME:CET", "DTSTART:19701025T030000", "RRULE:FREQ=YEARLY;BYMONTH=10;BYDAY=-1SU", "END:STANDARD",
    "END:VTIMEZONE",
    "BEGIN:VEVENT", `UID:${e.id}@lacabane`, `DTSTAMP:${now}`,
    b.journee ? `DTSTART;VALUE=DATE:${b.debut}` : `DTSTART;TZID=Europe/Paris:${b.debut}`,
    b.journee ? `DTEND;VALUE=DATE:${b.fin}` : `DTEND;TZID=Europe/Paris:${b.fin}`,
    `SUMMARY:${x(e.titre)}`, `DESCRIPTION:${x(texteEvt(e))}`, `LOCATION:${x(e.lien || "Twitch")}`, ...(e.lien ? [`URL:${e.lien}`] : []),
    "END:VEVENT", "END:VCALENDAR"].join("\r\n");
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([ics], {type:"text/calendar;charset=utf-8"}));
  a.download = `${e.titre.normalize("NFD").replace(/[^\w]+/g, "-").replace(/^-|-$/g, "").toLowerCase() || "evenement"}.ics`;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 3000);
}

async function charger(){
  try {
    const r = await fetch(`membres.json?t=${Date.now()}`, {cache:"no-store"});
    if(r.status === 404){ DATA = {active:false}; }
    else if(!r.ok) throw 0;
    else { const ancien = DATA; DATA = await r.json();
      for(const m of DATA.membres || []){
        if(m.live && horsLigne.get(m.login) === DATA.maj) m.live = null;
        const avant = ancien?.membres?.find(x => x.login === m.login);
        if(!m.live && avant?.live && ancien.maj === DATA.maj) m.live = avant.live;      // live vu en direct, pas encore dans les données du robot
      } }
  } catch { if(!DATA) $("#main").innerHTML = `<p class="empty">Impossible de charger la liste pour le moment. Réessaie dans quelques minutes.</p>`; return; }
  const focus = document.activeElement?.id === "q", pos = focus ? document.activeElement.selectionStart : 0;
  render();
  if(!chargerFait){ chargerFait = true; await retourTwitch(); }
  if(focus){ const el = $("#q"); el.focus(); try { el.setSelectionRange(pos, pos); } catch {} }
  if(!liveVerifieA || Date.now() - liveVerifieA > 60e3) verifierLives();
}
document.addEventListener("click", e => {
  const c = e.target.closest("[data-f]"); if(c){ filtre = c.dataset.f; render(); return; }
  const n = e.target.closest("a[data-nav]");
  if(n && !e.ctrlKey && !e.metaKey && !e.shiftKey && e.button === 0){ e.preventDefault(); const retour = !new URLSearchParams(location.search).get("m"); if(retour) sessionScroll = window.scrollY;
    if(n.getAttribute("href") === "./" && history.state?.depuisAccueil){ history.back(); return; }   // « ← Tous les streamers » = retour arrière
    history.pushState(retour ? {depuisAccueil:true} : null, "", n.getAttribute("href")); render(); if(n.getAttribute("href") === "./") window.scrollTo(0, sessionScroll || 0); return; }
  if(e.target.closest("#hasard, #autre")){ const m = new URLSearchParams(location.search).get("m"); if(m && !deja.includes(m)) deja.push(m); decouvrir(); return; }
  const ic = e.target.closest("[data-ics]"); if(ic){ e.preventDefault(); const ev = (DATA?.agenda || []).find(x => x.id === ic.dataset.ics); if(ev) telechargerIcs(ev); return; }
  const ib = e.target.closest("[data-ins], [data-insout]");
  if(ib){ ib.disabled = true; inscrire(ib.dataset.ins || ib.dataset.insout, ib.dataset.ins ? "in" : "out"); return; }
  if(e.target.id === "copyLien"){ const t = location.href; const ok = () => { e.target.textContent = "Lien copié ✓"; setTimeout(() => { e.target.textContent = "Copier le lien de cette page"; }, 2500); };
    (navigator.clipboard?.writeText(t) || Promise.reject()).then(ok, () => prompt("Copie ce lien :", t)); }
});
let sessionScroll = 0;
window.addEventListener("popstate", () => { render(); if(!new URLSearchParams(location.search).get("m")) window.scrollTo(0, sessionScroll || 0); });
document.addEventListener("change", e => { if(e.target.id === "jeuSel"){ jeuFiltre = e.target.value; render(); $("#jeuSel")?.focus(); } });
document.addEventListener("compositionend", e => { if(e.target.id === "q"){ q = e.target.value; const pos = e.target.selectionStart; render(); const el = $("#q"); el.focus(); el.setSelectionRange(pos, pos); } });
document.addEventListener("input", e => { if(e.target.id === "q" && !e.isComposing){ q = e.target.value; const pos = e.target.selectionStart; render(); const el = $("#q"); el.focus(); el.setSelectionRange(pos, pos); } });
charger();
setInterval(() => { if(document.visibilityState === "visible") charger(); }, 5 * 60 * 1000);
setInterval(() => { if(document.visibilityState === "visible") verifierLives(); }, 2 * 60 * 1000);
</script>
